name: Build VortexPS3 Full Emulator

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner imagemagick
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool apktool.jar
          sudo mv apktool apktool.jar /usr/local/bin/

      - name: Build Clean Installable Engine APK
        run: |
          # 1. Download Base APK
          LATEST_URL=$(curl -sL https://api.github.com/repos/Producdevity/gamehub-lite/releases/latest | grep "browser_download_url.*apk" | head -n 1 | cut -d '"' -f 4)
          wget -q -O base.apk "$LATEST_URL"

          # 2. Decompile WITHOUT breaking resources (-s and -r)
          apktool d -s -r base.apk -o engine_work -f

          # 3. Create Welcome Image
          convert -size 1080x1920 xc:black -gravity center \
            -fill white -pointsize 80 -annotate 0 "WELCOME" \
            -fill cyan -pointsize 45 -annotate +0+140 "VORTEXPS3 EMU" \
            welcome_splash.png

          # 4. Safe image replace
          find engine_work/res -type f \( -iname "*splash*" -o -iname "*logo*" -o -iname "*launch*" \) \( -name "*.png" -o -name "*.webp" \) | while read -r img; do
            W=$(identify -format "%w" "$img" 2>/dev/null || echo 1080)
            H=$(identify -format "%h" "$img" 2>/dev/null || echo 1920)
            convert welcome_splash.png -resize "${W}x${H}!" "$img" 2>/dev/null || true
          done

          # 5. Rebuild with proper Android manifest structure
          apktool b engine_work -o unsigned.apk

          # 6. Proper alignment (4-byte boundary)
          zipalign -v -p 4 unsigned.apk aligned.apk

          # 7. Generate debug signature (v1 + v2 + v3 scheme enabled)
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          apksigner sign --ks debug.keystore --ks-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out VortexPS3-Final-Installable.apk aligned.apk

          # Verify signature
          apksigner verify --verbose VortexPS3-Final-Installable.apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-Final-Installable
          path: VortexPS3-Final-Installable.apk
          
