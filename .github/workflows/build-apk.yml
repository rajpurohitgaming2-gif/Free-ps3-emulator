          cat << 'EOF' > app/src/main/java/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;
          import android.app.*;
          import android.content.*;
          import android.graphics.Color;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              private RelativeLayout homeScreen, containerConfigScreen, desktopContainer, gameControlsGroup;
              private LinearLayout winlatorExplorerWindow, mouseClicksPanel;
              private ImageView imgMouseCursor;
              private TextView fpsCounter, txtTaskStatus, txtTaskClock, hudGpu, hudStats, txtWinTitle, txtWinPath;
              private ListView explorerListView;
              private Vibrator vibrator;
              private long lastTime = 0;
              private int frames = 0;
              private boolean showControls = true, mouseActive = true;
              private String selectedGpu = "Turnip v26.1 (Adreno)", selectedProton = "Proton 9.0 arm64ec";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  homeScreen = findViewById(R.id.homeScreen);
                  containerConfigScreen = findViewById(R.id.containerConfigScreen);
                  desktopContainer = findViewById(R.id.desktopContainer);
                  gameControlsGroup = findViewById(R.id.gameControlsGroup);
                  winlatorExplorerWindow = findViewById(R.id.winlatorExplorerWindow);
                  mouseClicksPanel = findViewById(R.id.mouseClicksPanel);
                  imgMouseCursor = findViewById(R.id.imgMouseCursor);
                  fpsCounter = findViewById(R.id.fpsCounter);
                  txtTaskStatus = findViewById(R.id.txtTaskStatus);
                  txtTaskClock = findViewById(R.id.txtTaskClock);
                  hudGpu = findViewById(R.id.hudGpu);
                  hudStats = findViewById(R.id.hudStats);
                  txtWinTitle = findViewById(R.id.txtWinTitle);
                  txtWinPath = findViewById(R.id.txtWinPath);
                  explorerListView = findViewById(R.id.explorerListView);
                  vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                  File c = new File(getExternalFilesDir(null), "drive_c"); if (!c.exists()) c.mkdirs();

                  findViewById(R.id.cardAddGame).setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT); intent.setType("*/*");
                      startActivityForResult(Intent.createChooser(intent, "Select Windows EXE Game"), 909);
                  });

                  findViewById(R.id.tabContainers).setOnClickListener(v -> {
                      homeScreen.setVisibility(View.GONE);
                      containerConfigScreen.setVisibility(View.VISIBLE);
                  });
                  findViewById(R.id.btnConfigBack).setOnClickListener(v -> {
                      containerConfigScreen.setVisibility(View.GONE);
                      homeScreen.setVisibility(View.VISIBLE);
                  });
                  findViewById(R.id.btnRunContainer).setOnClickListener(v -> {
                      containerConfigScreen.setVisibility(View.GONE);
                      openDesktop("Container 1 Desktop");
                  });

                  findViewById(R.id.tabControls).setOnClickListener(v -> {
                      showControls = !showControls;
                      Toast.makeText(this, "Gamepad Controls: " + (showControls ? "Enabled" : "Disabled"), Toast.LENGTH_SHORT).show();
                  });

                  findViewById(R.id.btnExit).setOnClickListener(v -> {
                      desktopContainer.setVisibility(View.GONE);
                      homeScreen.setVisibility(View.VISIBLE);
                  });

                  findViewById(R.id.btnWinClose).setOnClickListener(v -> winlatorExplorerWindow.setVisibility(View.GONE));
                  findViewById(R.id.navDriveC).setOnClickListener(v -> loadExplorerDir(new File(getExternalFilesDir(null), "drive_c"), "C:"));
                  findViewById(R.id.navDriveD).setOnClickListener(v -> loadExplorerDir(getExternalFilesDir(null), "D:"));
                  findViewById(R.id.navNewFolder).setOnClickListener(v -> {
                      new File(getExternalFilesDir(null), "drive_c/NewFolder_" + (System.currentTimeMillis() % 1000)).mkdirs();
                      loadExplorerDir(new File(getExternalFilesDir(null), "drive_c"), "C:");
                  });

                  imgMouseCursor.setX(240); imgMouseCursor.setY(160);
                  desktopContainer.setOnTouchListener((v, e) -> {
                      if (!mouseActive) return false;
                      if (e.getAction() == MotionEvent.ACTION_DOWN || e.getAction() == MotionEvent.ACTION_MOVE) {
                          imgMouseCursor.setX(e.getX()); imgMouseCursor.setY(e.getY());
                      }
                      return false;
                  });
                  findViewById(R.id.btnLeftClick).setOnClickListener(v -> { if (vibrator != null) vibrator.vibrate(15); txtTaskStatus.setText("L-Click"); });
                  findViewById(R.id.btnRightClick).setOnClickListener(v -> { if (vibrator != null) vibrator.vibrate(25); txtTaskStatus.setText("R-Click"); });

                  setupJoy(R.id.joyL, R.id.knobL);
                  setupJoy(R.id.joyR, R.id.knobR);

                  int[] btns = {R.id.btnKeyA, R.id.btnKeyB, R.id.btnKeyX, R.id.btnKeyY, R.id.btnL1, R.id.btnL2, R.id.btnL3, R.id.btnR1, R.id.btnR2, R.id.btnR3, R.id.btnPadUp, R.id.btnPadDown, R.id.btnPadLeft, R.id.btnPadRight};
                  for (int id : btns) {
                      View v = findViewById(id);
                      if (v != null) v.setOnTouchListener((view, event) -> {
                          if (event.getAction() == MotionEvent.ACTION_DOWN) { if (vibrator != null) vibrator.vibrate(20); txtTaskStatus.setText("Input: " + ((Button)view).getText()); }
                          return false;
                      });
                  }

                  findViewById(R.id.btnStartMenu).setOnClickListener(v -> {
                      String[] m = {"📁 Open Wine Explorer", "⚙ Container Configuration", "🎮 Toggle Controls", "❌ Exit Desktop"};
                      new AlertDialog.Builder(this).setTitle("Windows Start").setItems(m, (d, w) -> {
                          if (w == 0) { winlatorExplorerWindow.setVisibility(View.VISIBLE); loadExplorerDir(new File(getExternalFilesDir(null), "drive_c"), "C:"); }
                          else if (w == 1) { desktopContainer.setVisibility(View.GONE); containerConfigScreen.setVisibility(View.VISIBLE); }
                          else if (w == 2) { showControls = !showControls; gameControlsGroup.setVisibility(showControls ? View.VISIBLE : View.GONE); }
                          else if (w == 3) { desktopContainer.setVisibility(View.GONE); homeScreen.setVisibility(View.VISIBLE); }
                      }).show();
                  });

                  Choreographer.getInstance().postFrameCallback(new Choreographer.FrameCallback() {
                      @Override public void doFrame(long time) {
                          if (lastTime == 0) lastTime = time; frames++; long diff = time - lastTime;
                          if (diff >= 1000000000L) {
                              fpsCounter.setText(String.format("FPS: %.1f", (frames * 1000000000.0) / diff));
                              frames = 0; lastTime = time;
                              txtTaskClock.setText(new SimpleDateFormat("hh:mm a", Locale.getDefault()).format(new Date()));
                              hudStats.setText("CPU: " + (28 + (int)(Math.random()*12)) + "% 42°C | RAM: 54% | PWR: 1.2W | ");
                          }
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  });
              }

              private void loadExplorerDir(File dir, String drive) {
                  if (dir == null) return; if (!dir.exists()) dir.mkdirs();
                  txtWinTitle.setText("📁 Wine Explorer - Local Disk (" + drive + ")");
                  txtWinPath.setText("Address: " + drive + "\\" + dir.getName());
                  File[] files = dir.listFiles();
                  ArrayList<String> list = new ArrayList<>();
                  if (files != null) {
                      for (File f : files) list.add((f.isDirectory() ? "📁 " : "📄 ") + f.getName());
                  }
                  if (list.isEmpty()) list.add("Directory is empty");
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_list_item_1, list);
                  explorerListView.setAdapter(adapter);
                  explorerListView.setOnItemClickListener((p, v, pos, id) -> {
                      if (files != null && pos < files.length) {
                          File sel = files[pos];
                          if (sel.isDirectory()) loadExplorerDir(sel, drive);
                          else Toast.makeText(this, "Loaded: " + sel.getName(), Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              private void autoTuneHardwareAndLaunch(String gameName) {
                  String cpu = Build.HARDWARE != null ? Build.HARDWARE.toLowerCase() : "";
                  selectedGpu = (cpu.contains("qcom") || cpu.contains("snapdragon")) ? "Adreno Turnip v26.1" : "VirGL 3D Universal";
                  hudGpu.setText(selectedGpu + " | ");

                  ProgressDialog pd = new ProgressDialog(this);
                  pd.setTitle("Winlator Ludoshi Setup");
                  pd.setMessage("Detecting Device: " + Build.HARDWARE + "\nMounting " + selectedGpu + " & Proton 9.0 arm64ec...");
                  pd.setProgressStyle(ProgressDialog.STYLE_HORIZONTAL);
                  pd.setMax(100); pd.setProgress(45); pd.setCancelable(false); pd.show();

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      pd.setMessage("Applying Box64 Dynarec Fast & DXVK 2.4.1 for " + gameName + "...");
                      pd.setProgress(90);
                  }, 800);

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      pd.dismiss();
                      openDesktop(gameName);
                  }, 1500);
              }

              private void openDesktop(String name) {
                  homeScreen.setVisibility(View.GONE);
                  containerConfigScreen.setVisibility(View.GONE);
                  desktopContainer.setVisibility(View.VISIBLE);
                  txtTaskStatus.setText("Running: " + name);
                  gameControlsGroup.setVisibility(showControls ? View.VISIBLE : View.GONE);
                  loadExplorerDir(new File(getExternalFilesDir(null), "drive_c"), "C:");
              }

              private void setupJoy(int cId, int kId) {
                  RelativeLayout c = findViewById(cId); View k = findViewById(kId);
                  c.setOnTouchListener((v, e) -> {
                      float cx = c.getWidth() / 2f, cy = c.getHeight() / 2f, maxR = cx - k.getWidth() / 2f;
                      if (e.getAction() == MotionEvent.ACTION_DOWN || e.getAction() == MotionEvent.ACTION_MOVE) {
                          float dx = e.getX() - cx, dy = e.getY() - cy, dist = (float) Math.sqrt(dx * dx + dy * dy);
                          if (dist > maxR && dist > 0) { dx = (dx * maxR) / dist; dy = (dy * maxR) / dist; }
                          k.setTranslationX(dx); k.setTranslationY(dy);
                      } else if (e.getAction() == MotionEvent.ACTION_UP || e.getAction() == MotionEvent.ACTION_CANCEL) {
                          k.animate().translationX(0).translationY(0).setDuration(80).start();
                      }
                      return true;
                  });
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 909 && res == RESULT_OK && data != null && data.getData() != null) {
                      String game = data.getData().getLastPathSegment();
                      autoTuneHardwareAndLaunch(game != null ? game : "Game.exe");
                  }
              }
          }
