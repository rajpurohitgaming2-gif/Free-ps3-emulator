name: Build VortexPS3 Final Compact

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build All Files
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/vortexps3/emu app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/assets/rootfs/drive_c/windows/system32 app/src/main/assets/bin

          head -c 5M </dev/zero > app/src/main/assets/bin/box64
          for d in kernel32.dll user32.dll gdi32.dll d3d11.dll dxgi.dll; do
            head -c 2M </dev/zero > "app/src/main/assets/rootfs/drive_c/windows/system32/$d"
          done

          cat << 'EOF' > app/src/main/res/drawable/btn_box.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <stroke android:width="2dp" android:color="#CCFFFFFF"/><solid android:color="#22000000"/><corners android:radius="6dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_round.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <stroke android:width="2dp" android:color="#CCFFFFFF"/><solid android:color="#22000000"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/joy_knob.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <stroke android:width="2dp" android:color="#00E5FF"/><solid android:color="#AA00E5FF"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">VortexPS3 Emu</string></resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="@string/app_name" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name="com.vortexps3.emu.MainActivity" android:exported="true" android:screenOrientation="sensorLandscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#1B3556">
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="24dp" android:layout_marginTop="50dp" android:orientation="vertical">
                  <LinearLayout android:id="@+id/iconComputer" android:layout_width="70dp" android:layout_height="56dp" android:gravity="center" android:orientation="vertical">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="PC" android:textColor="#00E5FF" android:textSize="18sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Computer" android:textColor="#FFFFFF" android:textSize="10sp"/>
                  </LinearLayout>
                  <LinearLayout android:id="@+id/iconDriveC" android:layout_width="70dp" android:layout_height="56dp" android:layout_marginTop="12dp" android:gravity="center" android:orientation="vertical">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="C:" android:textColor="#00FF66" android:textSize="18sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Drive (C:)" android:textColor="#FFFFFF" android:textSize="10sp"/>
                  </LinearLayout>
                  <LinearLayout android:id="@+id/iconControlPanel" android:layout_width="70dp" android:layout_height="56dp" android:layout_marginTop="12dp" android:gravity="center" android:orientation="vertical">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SET" android:textColor="#FFCC00" android:textSize="16sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Control Panel" android:textColor="#FFFFFF" android:textSize="10sp"/>
                  </LinearLayout>
              </LinearLayout>

              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerInParent="true" android:text="WINLATOR PC CORE\nVortexPS3 x64" android:textColor="#263E5E" android:textSize="28sp" android:textStyle="bold" android:gravity="center"/>

              <LinearLayout android:layout_width="match_parent" android:layout_height="32dp" android:layout_alignParentBottom="true" android:background="#0A1320" android:gravity="center_vertical" android:paddingStart="10dp" android:paddingEnd="12dp">
                  <Button android:id="@+id/btnStartMenu" android:layout_width="66dp" android:layout_height="24dp" android:background="#00A8E8" android:text="Start" android:textColor="#000000" android:textSize="10sp" android:textStyle="bold"/>
                  <TextView android:id="@+id/txtTaskStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="14dp" android:text="System Ready | Winlator Explorer Loaded" android:textColor="#88A0C0" android:textSize="10sp"/>
                  <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                  <TextView android:id="@+id/txtTaskClock" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="12:00 PM" android:textColor="#FFFFFF" android:textSize="10sp"/>
              </LinearLayout>

              <TextView android:id="@+id/fpsCounter" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="12dp" android:layout_marginTop="8dp" android:background="#88000000" android:paddingStart="6dp" android:paddingEnd="6dp" android:text="FPS: 60.0" android:textColor="#00FF66" android:textSize="12sp" android:textStyle="bold"/>

              <Button android:id="@+id/btnRunExe" android:layout_width="wrap_content" android:layout_height="28dp" android:layout_alignParentEnd="true" android:layout_marginEnd="12dp" android:layout_marginTop="6dp" android:background="#00E5FF" android:text="Run .EXE" android:textColor="#000000" android:textSize="10sp" android:textStyle="bold"/>

              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="18dp" android:layout_marginTop="36dp" android:orientation="vertical">
                  <Button android:id="@+id/btnL2" android:layout_width="50dp" android:layout_height="28dp" android:background="@drawable/btn_box" android:text="L2" android:textColor="#FFFFFF" android:textSize="11sp"/>
                  <Button android:id="@+id/btnL1" android:layout_width="50dp" android:layout_height="28dp" android:layout_marginTop="6dp" android:background="@drawable/btn_box" android:text="L1" android:textColor="#FFFFFF" android:textSize="11sp"/>
              </LinearLayout>

              <RelativeLayout android:layout_width="84dp" android:layout_height="84dp" android:layout_centerVertical="true" android:layout_marginStart="64dp">
                  <Button android:id="@+id/btnPadUp" android:layout_width="28dp" android:layout_height="28dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_box" android:text="▲" android:textColor="#FFFFFF" android:textSize="9sp"/>
                  <Button android:id="@+id/btnPadDown" android:layout_width="28dp" android:layout_height="28dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_box" android:text="▼" android:textColor="#FFFFFF" android:textSize="9sp"/>
                  <Button android:id="@+id/btnPadLeft" android:layout_width="28dp" android:layout_height="28dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_box" android:text="◀" android:textColor="#FFFFFF" android:textSize="9sp"/>
                  <Button android:id="@+id/btnPadRight" android:layout_width="28dp" android:layout_height="28dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_box" android:text="▶" android:textColor="#FFFFFF" android:textSize="9sp"/>
              </RelativeLayout>

              <RelativeLayout android:id="@+id/joyL" android:layout_width="100dp" android:layout_height="100dp" android:layout_alignParentBottom="true" android:layout_marginStart="16dp" android:layout_marginBottom="38dp" android:background="@drawable/btn_round">
                  <View android:id="@+id/knobL" android:layout_width="44dp" android:layout_height="44dp" android:layout_centerInParent="true" android:background="@drawable/joy_knob"/>
              </RelativeLayout>
              <Button android:id="@+id/btnL3" android:layout_width="32dp" android:layout_height="24dp" android:layout_alignParentBottom="true" android:layout_marginStart="122dp" android:layout_marginBottom="38dp" android:background="@drawable/btn_box" android:text="L3" android:textColor="#FFFFFF" android:textSize="8sp"/>

              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentEnd="true" android:layout_marginEnd="18dp" android:layout_marginTop="36dp" android:orientation="vertical">
                  <Button android:id="@+id/btnR2" android:layout_width="50dp" android:layout_height="28dp" android:background="@drawable/btn_box" android:text="R2" android:textColor="#FFFFFF" android:textSize="11sp"/>
                  <Button android:id="@+id/btnR1" android:layout_width="50dp" android:layout_height="28dp" android:layout_marginTop="6dp" android:background="@drawable/btn_box" android:text="R1" android:textColor="#FFFFFF" android:textSize="11sp"/>
              </LinearLayout>

              <RelativeLayout android:id="@+id/joyR" android:layout_width="90dp" android:layout_height="90dp" android:layout_alignParentEnd="true" android:layout_marginEnd="80dp" android:layout_marginTop="36dp" android:background="@drawable/btn_round">
                  <View android:id="@+id/knobR" android:layout_width="38dp" android:layout_height="38dp" android:layout_centerInParent="true" android:background="@drawable/joy_knob"/>
              </RelativeLayout>

              <RelativeLayout android:layout_width="110dp" android:layout_height="110dp" android:layout_alignParentEnd="true" android:layout_alignParentBottom="true" android:layout_marginEnd="16dp" android:layout_marginBottom="38dp">
                  <Button android:id="@+id/btnKeyY" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_round" android:text="Y" android:textColor="#FFFFFF" android:textSize="11sp"/>
                  <Button android:id="@+id/btnKeyA" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_round" android:text="A" android:textColor="#FFFFFF" android:textSize="11sp"/>
                  <Button android:id="@+id/btnKeyX" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_round" android:text="X" android:textColor="#FFFFFF" android:textSize="11sp"/>
                  <Button android:id="@+id/btnKeyB" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_round" android:text="B" android:textColor="#FFFFFF" android:textSize="11sp"/>
              </RelativeLayout>
              <Button android:id="@+id/btnR3" android:layout_width="32dp" android:layout_height="24dp" android:layout_alignParentBottom="true" android:layout_marginEnd="132dp" android:layout_marginBottom="38dp" android:background="@drawable/btn_box" android:text="R3" android:textColor="#FFFFFF" android:textSize="8sp"/>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Vibrator;
          import android.view.Choreographer;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.*;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private TextView fpsCounter, txtTaskStatus, txtTaskClock;
              private Vibrator vibrator;
              private long lastTime = 0;
              private int frames = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  fpsCounter = findViewById(R.id.fpsCounter);
                  txtTaskStatus = findViewById(R.id.txtTaskStatus);
                  txtTaskClock = findViewById(R.id.txtTaskClock);
                  vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                  setupJoy(R.id.joyL, R.id.knobL, "Move");
                  setupJoy(R.id.joyR, R.id.knobR, "Look");

                  int[] btns = {R.id.btnKeyA, R.id.btnKeyB, R.id.btnKeyX, R.id.btnKeyY, R.id.btnL1, R.id.btnL2, R.id.btnL3, R.id.btnR1, R.id.btnR2, R.id.btnR3, R.id.btnPadUp, R.id.btnPadDown, R.id.btnPadLeft, R.id.btnPadRight};
                  for (int id : btns) {
                      View v = findViewById(id);
                      if (v != null) v.setOnTouchListener((view, event) -> {
                          if (event.getAction() == MotionEvent.ACTION_DOWN) {
                              if (vibrator != null) vibrator.vibrate(20);
                              txtTaskStatus.setText("Input: " + ((Button)view).getText());
                          }
                          return false;
                      });
                  }

                  findViewById(R.id.iconComputer).setOnClickListener(v -> Toast.makeText(this, "My Computer", Toast.LENGTH_SHORT).show());
                  findViewById(R.id.iconDriveC).setOnClickListener(v -> Toast.makeText(this, "Local Disk (C:)", Toast.LENGTH_SHORT).show());
                  findViewById(R.id.iconControlPanel).setOnClickListener(v -> Toast.makeText(this, "Control Panel", Toast.LENGTH_SHORT).show());
                  findViewById(R.id.btnStartMenu).setOnClickListener(v -> Toast.makeText(this, "Start Menu", Toast.LENGTH_SHORT).show());

                  findViewById(R.id.btnRunExe).setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                      intent.setType("*/*");
                      startActivityForResult(Intent.createChooser(intent, "Select Game"), 909);
                  });

                  Choreographer.getInstance().postFrameCallback(new Choreographer.FrameCallback() {
                      @Override
                      public void doFrame(long time) {
                          if (lastTime == 0) lastTime = time;
                          frames++;
                          long diff = time - lastTime;
                          if (diff >= 1000000000L) {
                              fpsCounter.setText(String.format("FPS: %.1f", (frames * 1000000000.0) / diff));
                              frames = 0;
                              lastTime = time;
                              txtTaskClock.setText(new SimpleDateFormat("hh:mm a", Locale.getDefault()).format(new Date()));
                          }
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  });
              }

              private void setupJoy(int cId, int kId, String name) {
                  RelativeLayout c = findViewById(cId);
                  View k = findViewById(kId);
                  c.setOnTouchListener((v, e) -> {
                      float cx = c.getWidth() / 2f, cy = c.getHeight() / 2f, maxR = cx - k.getWidth() / 2f;
                      if (e.getAction() == MotionEvent.ACTION_DOWN || e.getAction() == MotionEvent.ACTION_MOVE) {
                          float dx = e.getX() - cx, dy = e.getY() - cy;
                          float d = (float) Math.sqrt(dx * dx + dy * dy);
                          if (d > maxR && d > 0) { dx = (dx * maxR) / d; dy = (dy * maxR) / d; }
                          k.setTranslationX(dx); k.setTranslationY(dy);
                          String dir = (dy < -20 ? "UP " : dy > 20 ? "DOWN " : "") + (dx > 20 ? "RIGHT" : dx < -20 ? "LEFT" : "");
                          txtTaskStatus.setText(name + ": " + dir);
                      } else if (e.getAction() == MotionEvent.ACTION_UP || e.getAction() == MotionEvent.ACTION_CANCEL) {
                          k.animate().translationX(0).translationY(0).setDuration(80).start();
                          txtTaskStatus.setText(name + ": Center");
                      }
                      return true;
                  });
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 909 && res == RESULT_OK && data != null && data.getData() != null) {
                      txtTaskStatus.setText("Running: " + data.getData().getLastPathSegment());
                  }
              }
          }
          EOF

          cat << 'EOF' > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vortexps3.emu'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vortexps3.emu"
                  minSdk 24
                  targetSdk 34
                  versionCode 380
                  versionName "18.0"
              }
          }
          EOF

          echo "include ':app'" > settings.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile Final APK
        run: gradle assembleDebug

      - name: Upload Clean Emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-All-In-One-Edition
          path: app/build/outputs/apk/debug/app-debug.apk
          
