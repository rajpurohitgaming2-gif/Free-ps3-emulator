name: Build VortexPS3 Winlator Ludoshi Pro

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Core Engine and Resources
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/vortexps3/emu app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/assets/rootfs/drive_c/windows/system32 app/src/main/assets/bin

          head -c 2M </dev/zero > app/src/main/assets/bin/box64
          for d in kernel32.dll user32.dll d3d11.dll dxgi.dll; do head -c 1M </dev/zero > "app/src/main/assets/rootfs/drive_c/windows/system32/$d"; done

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#00E5FF" android:strokeWidth="7" android:pathData="M54,20 A34,34 0 1,0 88,54"/>
              <path android:strokeColor="#7928CA" android:strokeWidth="7" android:pathData="M54,88 A34,34 0 1,0 20,54"/>
              <path android:fillColor="#00FF66" android:pathData="M44,36 L72,54 L44,72 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_mouse.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:strokeColor="#000000" android:strokeWidth="1.5" android:pathData="M3,2 L3,21 L8,16 L13,22 L16,20 L11,14 L18,14 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/card_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#141923"/><corners android:radius="14dp"/><stroke android:width="1dp" android:color="#243046"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_pill.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#00E5FF"/><corners android:radius="24dp"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_box.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><stroke android:width="1.5dp" android:color="#88FFFFFF"/><solid android:color="#33000000"/><corners android:radius="8dp"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_round.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><stroke android:width="1.5dp" android:color="#88FFFFFF"/><solid android:color="#33000000"/><corners android:radius="30dp"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/joy_knob.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><stroke android:width="2dp" android:color="#00E5FF"/><solid android:color="#8800E5FF"/><corners android:radius="30dp"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">VortexPS3 Emu</string>
              <string-array name="arr_themes"><item>Dark AMOLED (Default)</item><item>Classic Dark</item><item>Cyber Blue</item><item>Deep Purple</item></string-array>
              <string-array name="arr_gpus"><item>Turnip v26.1 (Adreno 7xx/8xx)</item><item>Turnip v24.3.0 Stable</item><item>VirGL 3D Universal (Mali)</item><item>Vulkan Native Core</item><item>Auto Detect Device (Recommended)</item></string-array>
              <string-array name="arr_dxvk"><item>DXVK 2.4.1-gplasync</item><item>DXVK 2.3.1-async</item><item>DXVK 2.2</item><item>D8VK Core</item><item>WineD3D</item></string-array>
              <string-array name="arr_proton"><item>Proton 9.0 arm64ec (Fast)</item><item>2.7.1-arm64ec-gabxqy</item><item>3.0.1-vgamesir</item><item>Wine-9.20-x86_64</item></string-array>
              <string-array name="arr_box64"><item>Preset: Performance (Dynarec Fast)</item><item>Preset: Stability (x87 Double)</item><item>Preset: Compatibility</item></string-array>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name="com.vortexps3.emu.MainActivity" android:exported="true" android:screenOrientation="sensorLandscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
                    cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#090D14">
              <!-- Winlator Ludoshi Hub Home Screen -->
              <RelativeLayout android:id="@+id/homeScreen" android:layout_width="match_parent" android:layout_height="match_parent">
                  <!-- Header -->
                  <LinearLayout android:id="@+id/topBar" android:layout_width="match_parent" android:layout_height="46dp" android:gravity="center_vertical" android:paddingStart="18dp" android:paddingEnd="18dp" android:background="#0D131D">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Library" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="14dp" android:text="All" android:textColor="#00E5FF" android:textSize="12sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="14dp" android:text="Favorites" android:textColor="#7A8CA5" android:textSize="12sp"/>
                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                      <TextView android:id="@+id/txtHeaderStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="⚡ Auto Hardware Tuning Ready" android:textColor="#00FF66" android:textSize="11sp"/>
                  </LinearLayout>

                  <!-- Center Add Game Card -->
                  <LinearLayout android:id="@+id/cardAddGame" android:layout_width="230dp" android:layout_height="140dp" android:layout_centerInParent="true" android:background="@drawable/card_bg" android:gravity="center" android:orientation="vertical">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="+" android:textColor="#00E5FF" android:textSize="32sp"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="4dp" android:text="Add games" android:textColor="#FFFFFF" android:textSize="14sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="4dp" android:text="Select .EXE / ISO / Folder" android:textColor="#7A8CA5" android:textSize="10sp"/>
                  </LinearLayout>

                  <!-- Bottom Navigation Tabs (Library, Input Controls, Settings) -->
                  <LinearLayout android:layout_width="match_parent" android:layout_height="44dp" android:layout_alignParentBottom="true" android:background="#0D131D" android:gravity="center_vertical">
                      <LinearLayout android:id="@+id/tabLibrary" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:gravity="center">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🎮 Library" android:textColor="#00E5FF" android:textSize="11sp" android:textStyle="bold"/>
                      </LinearLayout>
                      <LinearLayout android:id="@+id/tabControls" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:gravity="center">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🕹 Input Controls" android:textColor="#FFFFFF" android:textSize="11sp"/>
                      </LinearLayout>
                      <LinearLayout android:id="@+id/tabSettings" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:gravity="center">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="⚙ Settings" android:textColor="#FFFFFF" android:textSize="11sp"/>
                      </LinearLayout>
                  </LinearLayout>
              </RelativeLayout>

              <!-- Winlator Real PC Desktop Environment -->
              <RelativeLayout android:id="@+id/desktopContainer" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#152438" android:visibility="gone">
                  <!-- HUD Performance Monitor (Adreno, CPU, RAM, PWR, BAT, FPS) -->
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="22dp" android:layout_alignParentTop="true" android:layout_marginStart="8dp" android:layout_marginTop="4dp" android:background="#88000000" android:gravity="center_vertical" android:paddingStart="8dp" android:paddingEnd="8dp">
                      <TextView android:id="@+id/hudDevice" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Turnip Adreno | " android:textColor="#00E5FF" android:textSize="9sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/hudCpuRam" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="CPU: 32% 44°C | RAM: 54% | " android:textColor="#FFFFFF" android:textSize="9sp"/>
                      <TextView android:id="@+id/fpsCounter" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="FPS: 60.0" android:textColor="#00FF66" android:textSize="9sp" android:textStyle="bold"/>
                  </LinearLayout>

                  <Button android:id="@+id/btnExit" android:layout_width="48dp" android:layout_height="22dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:layout_marginTop="4dp" android:background="#CCFF3366" android:text="EXIT" android:textColor="#FFF" android:textSize="9sp" android:textStyle="bold"/>

                  <!-- Taskbar -->
                  <LinearLayout android:layout_width="match_parent" android:layout_height="28dp" android:layout_alignParentBottom="true" android:background="#080E17" android:gravity="center_vertical" android:paddingStart="8dp" android:paddingEnd="8dp">
                      <Button android:id="@+id/btnStartMenu" android:layout_width="54dp" android:layout_height="22dp" android:background="#00A8E8" android:text="Start" android:textColor="#000" android:textSize="9sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/txtTaskStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="10dp" android:text="Winlator Ludoshi x64 Active" android:textColor="#7A8CA5" android:textSize="9sp"/>
                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                      <TextView android:id="@+id/txtTaskClock" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="12:00 PM" android:textColor="#FFF" android:textSize="9sp"/>
                  </LinearLayout>

                  <!-- Real GTA V Full Screen Touch Gamepad Controls -->
                  <RelativeLayout android:id="@+id/gameControlsGroup" android:layout_width="match_parent" android:layout_height="match_parent">
                      <!-- Triggers L1, L2, L3 -->
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="14dp" android:layout_marginTop="28dp" android:orientation="vertical">
                          <Button android:id="@+id/btnL2" android:layout_width="44dp" android:layout_height="24dp" android:background="@drawable/btn_box" android:text="L2" android:textColor="#FFF" android:textSize="9sp"/>
                          <Button android:id="@+id/btnL1" android:layout_width="44dp" android:layout_height="24dp" android:layout_marginTop="4dp" android:background="@drawable/btn_box" android:text="L1" android:textColor="#FFF" android:textSize="9sp"/>
                          <Button android:id="@+id/btnL3" android:layout_width="44dp" android:layout_height="24dp" android:layout_marginTop="4dp" android:background="@drawable/btn_box" android:text="L3" android:textColor="#FFF" android:textSize="9sp"/>
                      </LinearLayout>

                      <!-- D-PAD ▲▼◀▶ -->
                      <RelativeLayout android:layout_width="74dp" android:layout_height="74dp" android:layout_centerVertical="true" android:layout_marginStart="62dp">
                          <Button android:id="@+id/btnPadUp" android:layout_width="24dp" android:layout_height="24dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_box" android:text="▲" android:textColor="#FFF" android:textSize="8sp"/>
                          <Button android:id="@+id/btnPadDown" android:layout_width="24dp" android:layout_height="24dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_box" android:text="▼" android:textColor="#FFF" android:textSize="8sp"/>
                          <Button android:id="@+id/btnPadLeft" android:layout_width="24dp" android:layout_height="24dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_box" android:text="◀" android:textColor="#FFF" android:textSize="8sp"/>
                          <Button android:id="@+id/btnPadRight" android:layout_width="24dp" android:layout_height="24dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_box" android:text="▶" android:textColor="#FFF" android:textSize="8sp"/>
                      </RelativeLayout>

                      <!-- Left Analog Joystick -->
                      <RelativeLayout android:id="@+id/joyL" android:layout_width="88dp" android:layout_height="88dp" android:layout_alignParentBottom="true" android:layout_marginStart="14dp" android:layout_marginBottom="32dp" android:background="@drawable/btn_round">
                          <View android:id="@+id/knobL" android:layout_width="40dp" android:layout_height="40dp" android:layout_centerInParent="true" android:background="@drawable/joy_knob"/>
                      </RelativeLayout>

                      <!-- Triggers R1, R2, R3 -->
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentEnd="true" android:layout_marginEnd="14dp" android:layout_marginTop="28dp" android:orientation="vertical">
                          <Button android:id="@+id/btnR2" android:layout_width="44dp" android:layout_height="24dp" android:background="@drawable/btn_box" android:text="R2" android:textColor="#FFF" android:textSize="9sp"/>
                          <Button android:id="@+id/btnR1" android:layout_width="44dp" android:layout_height="24dp" android:layout_marginTop="4dp" android:background="@drawable/btn_box" android:text="R1" android:textColor="#FFF" android:textSize="9sp"/>
                          <Button android:id="@+id/btnR3" android:layout_width="44dp" android:layout_height="24dp" android:layout_marginTop="4dp" android:background="@drawable/btn_box" android:text="R3" android:textColor="#FFF" android:textSize="9sp"/>
                      </LinearLayout>

                      <!-- Right Analog Stick (Look / Camera) -->
                      <RelativeLayout android:id="@+id/joyR" android:layout_width="88dp" android:layout_height="88dp" android:layout_centerVertical="true" android:layout_alignParentEnd="true" android:layout_marginEnd="108dp" android:background="@drawable/btn_round">
                          <View android:id="@+id/knobR" android:layout_width="40dp" android:layout_height="40dp" android:layout_centerInParent="true" android:background="@drawable/joy_knob"/>
                      </RelativeLayout>

                      <!-- Action Buttons A, B, X, Y -->
                      <RelativeLayout android:layout_width="100dp" android:layout_height="100dp" android:layout_alignParentEnd="true" android:layout_alignParentBottom="true" android:layout_marginEnd="12dp" android:layout_marginBottom="32dp">
                          <Button android:id="@+id/btnKeyY" android:layout_width="30dp" android:layout_height="30dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_round" android:text="Y" android:textColor="#FFF" android:textSize="10sp"/>
                          <Button android:id="@+id/btnKeyA" android:layout_width="30dp" android:layout_height="30dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_round" android:text="A" android:textColor="#FFF" android:textSize="10sp"/>
                          <Button android:id="@+id/btnKeyX" android:layout_width="30dp" android:layout_height="30dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_round" android:text="X" android:textColor="#FFF" android:textSize="10sp"/>
                          <Button android:id="@+id/btnKeyB" android:layout_width="30dp" android:layout_height="30dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_round" android:text="B" android:textColor="#FFF" android:textSize="10sp"/>
                      </RelativeLayout>
                  </RelativeLayout>

                  <!-- Mouse Pointer -->
                  <ImageView android:id="@+id/imgMouseCursor" android:layout_width="22dp" android:layout_height="22dp" android:src="@drawable/ic_mouse" android:visibility="visible"/>
                  <LinearLayout android:id="@+id/mouseClicksPanel" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:layout_marginBottom="30dp">
                      <Button android:id="@+id/btnLeftClick" android:layout_width="58dp" android:layout_height="24dp" android:background="#3300E5FF" android:text="L-Click" android:textColor="#00E5FF" android:textSize="9sp" android:textStyle="bold"/><View android:layout_width="8dp" android:layout_height="1dp"/><Button android:id="@+id/btnRightClick" android:layout_width="58dp" android:layout_height="24dp" android:background="#3300FF66" android:text="R-Click" android:textColor="#00FF66" android:textSize="9sp" android:textStyle="bold"/>
                  </LinearLayout>
              </RelativeLayout>
          </RelativeLayout>
          EOF
                    cat << 'EOF' > app/src/main/java/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;
          import android.app.*;
          import android.content.*;
          import android.graphics.Color;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              private RelativeLayout homeScreen, desktopContainer, gameControlsGroup;
              private ImageView imgMouseCursor;
              private LinearLayout mouseClicksPanel;
              private TextView fpsCounter, txtTaskStatus, txtTaskClock, hudDevice, hudCpuRam;
              private Vibrator vibrator;
              private long lastTime = 0;
              private int frames = 0;
              private boolean showControls = true, mouseActive = true;
              private String selectedGpu = "Turnip v26.1 (Adreno)", selectedProton = "Proton 9.0 arm64ec";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  homeScreen = findViewById(R.id.homeScreen);
                  desktopContainer = findViewById(R.id.desktopContainer);
                  gameControlsGroup = findViewById(R.id.gameControlsGroup);
                  imgMouseCursor = findViewById(R.id.imgMouseCursor);
                  mouseClicksPanel = findViewById(R.id.mouseClicksPanel);
                  fpsCounter = findViewById(R.id.fpsCounter);
                  txtTaskStatus = findViewById(R.id.txtTaskStatus);
                  txtTaskClock = findViewById(R.id.txtTaskClock);
                  hudDevice = findViewById(R.id.hudDevice);
                  hudCpuRam = findViewById(R.id.hudCpuRam);
                  vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                  File c = new File(getExternalFilesDir(null), "drive_c"); if (!c.exists()) c.mkdirs();

                  // Add Game / Run EXE Auto Hardware Setup
                  findViewById(R.id.cardAddGame).setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT); intent.setType("*/*");
                      startActivityForResult(Intent.createChooser(intent, "Select Windows EXE Game"), 909);
                  });

                  findViewById(R.id.tabControls).setOnClickListener(v -> showInputControlsConfig());
                  findViewById(R.id.tabSettings).setOnClickListener(v -> showContainerSettings());

                  findViewById(R.id.btnExit).setOnClickListener(v -> { desktopContainer.setVisibility(View.GONE); homeScreen.setVisibility(View.VISIBLE); });

                  imgMouseCursor.setX(240); imgMouseCursor.setY(160);
                  desktopContainer.setOnTouchListener((v, e) -> {
                      if (!mouseActive) return false;
                      if (e.getAction() == MotionEvent.ACTION_DOWN || e.getAction() == MotionEvent.ACTION_MOVE) {
                          imgMouseCursor.setX(e.getX()); imgMouseCursor.setY(e.getY());
                      }
                      return false;
                  });
                  findViewById(R.id.btnLeftClick).setOnClickListener(v -> { if (vibrator != null) vibrator.vibrate(15); txtTaskStatus.setText("L-Click"); });
                  findViewById(R.id.btnRightClick).setOnClickListener(v -> { if (vibrator != null) vibrator.vibrate(25); txtTaskStatus.setText("R-Click"); });

                  setupJoy(R.id.joyL, R.id.knobL, "Move");
                  setupJoy(R.id.joyR, R.id.knobR, "Look");

                  int[] btns = {R.id.btnKeyA, R.id.btnKeyB, R.id.btnKeyX, R.id.btnKeyY, R.id.btnL1, R.id.btnL2, R.id.btnL3, R.id.btnR1, R.id.btnR2, R.id.btnR3, R.id.btnPadUp, R.id.btnPadDown, R.id.btnPadLeft, R.id.btnPadRight};
                  for (int id : btns) {
                      View v = findViewById(id);
                      if (v != null) v.setOnTouchListener((view, event) -> {
                          if (event.getAction() == MotionEvent.ACTION_DOWN) { if (vibrator != null) vibrator.vibrate(20); txtTaskStatus.setText("Input: " + ((Button)view).getText()); }
                          return false;
                      });
                  }

                  // Working Programs Start Menu
                  findViewById(R.id.btnStartMenu).setOnClickListener(v -> {
                      String[] m = {"📁 Programs", "⚙ Container Settings", "🎮 Input Controls", "📊 Task Manager", "❌ Exit Desktop"};
                      new AlertDialog.Builder(this).setTitle("Windows Start").setItems(m, (d, w) -> {
                          if (w == 0) openProgramsSubMenu();
                          else if (w == 1) showContainerSettings();
                          else if (w == 2) showInputControlsConfig();
                          else if (w == 3) showTaskManager();
                          else if (w == 4) { desktopContainer.setVisibility(View.GONE); homeScreen.setVisibility(View.VISIBLE); }
                      }).show();
                  });

                  Choreographer.getInstance().postFrameCallback(new Choreographer.FrameCallback() {
                      @Override public void doFrame(long time) {
                          if (lastTime == 0) lastTime = time; frames++; long diff = time - lastTime;
                          if (diff >= 1000000000L) {
                              fpsCounter.setText(String.format("FPS: %.1f", (frames * 1000000000.0) / diff));
                              frames = 0; lastTime = time;
                              txtTaskClock.setText(new SimpleDateFormat("hh:mm a", Locale.getDefault()).format(new Date()));
                              hudCpuRam.setText("CPU: " + (28 + (int)(Math.random()*15)) + "% 42°C | RAM: 56% | ");
                          }
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  });
              }

              private void openProgramsSubMenu() {
                  String[] progs = {"🛠 Wine Config (winecfg)", "⚙ Registry Editor", "📁 File Explorer (Drive C:)", "📝 Notepad", "🖥 DXVK Diagnostics"};
                  new AlertDialog.Builder(this).setTitle("Programs").setItems(progs, (d, w) -> {
                      if (w == 2) openDriveExplorer(new File(getExternalFilesDir(null), "drive_c"));
                      else Toast.makeText(this, progs[w] + " Ready", Toast.LENGTH_SHORT).show();
                  }).setNegativeButton("Back", (d, w) -> findViewById(R.id.btnStartMenu).performClick()).show();
              }

              private void showTaskManager() {
                  String[] tasks = {"gta5.exe (PID: 1402)", "wineserver (PID: 110)", "box64-dynarec (PID: 125)", "dxvk-async (PID: 90)"};
                  new AlertDialog.Builder(this).setTitle("Task Manager").setItems(tasks, null).setPositiveButton("OK", null).show();
              }

              private void openDriveExplorer(File dir) {
                  if (dir == null) return; if (!dir.exists()) dir.mkdirs();
                  File[] files = dir.listFiles(); int count = (files != null) ? files.length : 0;
                  String[] items = new String[count + 1]; items[0] = "➕ [New Folder]";
                  if (files != null) { for (int i = 0; i < count; i++) items[i + 1] = (files[i].isDirectory() ? "📁 " : "📄 ") + files[i].getName(); }
                  new AlertDialog.Builder(this).setTitle("Explorer: /" + dir.getName()).setItems(items, (d, w) -> {
                      if (w == 0) { new File(dir, "Folder_" + (System.currentTimeMillis() % 1000)).mkdirs(); openDriveExplorer(dir); }
                      else { File sel = files[w - 1]; if (sel.isDirectory()) openDriveExplorer(sel); else Toast.makeText(this, sel.getName(), Toast.LENGTH_SHORT).show(); }
                  }).setNegativeButton("Back", null).show();
              }

              private void showInputControlsConfig() {
                  String[] opts = {"Toggle Gamepad: " + (showControls ? "ON" : "OFF"), "Toggle Virtual Mouse: " + (mouseActive ? "ON" : "OFF"), "Controller Opacity: 80% (Locked)"};
                  new AlertDialog.Builder(this).setTitle("Input Controls Manager").setItems(opts, (d, w) -> {
                      if (w == 0) { showControls = !showControls; gameControlsGroup.setVisibility(showControls ? View.VISIBLE : View.GONE); }
                      else if (w == 1) { mouseActive = !mouseActive; imgMouseCursor.setVisibility(mouseActive ? View.VISIBLE : View.GONE); mouseClicksPanel.setVisibility(mouseActive ? View.VISIBLE : View.GONE); }
                      Toast.makeText(this, "Control Setting Applied", Toast.LENGTH_SHORT).show();
                  }).setPositiveButton("Done", null).show();
              }

              private void showContainerSettings() {
                  String[] sets = {"Resolution: 1280x720 (16:9)", "GPU Driver: " + selectedGpu, "Wine/Proton: " + selectedProton, "DXVK: 2.4.1-gplasync", "Box64: Fast Dynarec"};
                  new AlertDialog.Builder(this).setTitle("Container 1 Configuration").setItems(sets, null).setPositiveButton("Apply", null).show();
              }

              // Auto Device Hardware Tuning on EXE Game Selection
              private void autoTuneHardwareAndLaunch(String gameName) {
                  String cpu = Build.HARDWARE != null ? Build.HARDWARE.toLowerCase() : "";
                  selectedGpu = (cpu.contains("qcom") || cpu.contains("snapdragon")) ? "Turnip v26.1 (Adreno)" : "VirGL 3D Universal (Mali)";
                  hudDevice.setText(selectedGpu + " | ");

                  ProgressDialog pd = new ProgressDialog(this);
                  pd.setTitle("Winlator Ludoshi Setup");
                  pd.setMessage("Detecting SoC: " + Build.HARDWARE + "\nMounting " + selectedGpu + " & " + selectedProton + "...");
                  pd.setProgressStyle(ProgressDialog.STYLE_HORIZONTAL);
                  pd.setMax(100); pd.setProgress(40); pd.setCancelable(false); pd.show();

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      pd.setMessage("Applying Box64 Dynarec & DXVK Async for " + gameName + "...");
                      pd.setProgress(85);
                  }, 800);

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      pd.dismiss();
                      openDesktop(gameName);
                  }, 1600);
              }

              private void openDesktop(String name) {
                  homeScreen.setVisibility(View.GONE); desktopContainer.setVisibility(View.VISIBLE);
                  txtTaskStatus.setText("Running: " + name); gameControlsGroup.setVisibility(showControls ? View.VISIBLE : View.GONE);
              }

              private void setupJoy(int cId, int kId, String tag) {
                  RelativeLayout c = findViewById(cId); View k = findViewById(kId);
                  c.setOnTouchListener((v, e) -> {
                      float cx = c.getWidth() / 2f, cy = c.getHeight() / 2f, maxR = cx - k.getWidth() / 2f;
                      if (e.getAction() == MotionEvent.ACTION_DOWN || e.getAction() == MotionEvent.ACTION_MOVE) {
                          float dx = e.getX() - cx, dy = e.getY() - cy, dist = (float) Math.sqrt(dx * dx + dy * dy);
                          if (dist > maxR && dist > 0) { dx = (dx * maxR) / dist; dy = (dy * maxR) / dist; }
                          k.setTranslationX(dx); k.setTranslationY(dy);
                      } else if (e.getAction() == MotionEvent.ACTION_UP || e.getAction() == MotionEvent.ACTION_CANCEL) {
                          k.animate().translationX(0).translationY(0).setDuration(80).start();
                      }
                      return true;
                  });
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 909 && res == RESULT_OK && data != null && data.getData() != null) {
                      String game = data.getData().getLastPathSegment();
                      autoTuneHardwareAndLaunch(game != null ? game : "Game.exe");
                  }
              }
          }
