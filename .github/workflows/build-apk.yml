name: Build GameHub Lite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-gamehub:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Apktool & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget zipalign apksigner
        wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
        wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
        chmod +x apktool apktool.jar
        sudo mv apktool apktool.jar /usr/local/bin/

    - name: Run Patching Script
      run: |
        chmod +x patch.sh
        ./patch.sh

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: GameHub-Lite-Patched-APK
        path: "*.apk"
        
