name: Build VortexPS3 Full Emulator

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner imagemagick zip unzip

      - name: Download & Rebrand GameHub Engine
        run: |
          # 1. Base GameHub Lite APK Download
          LATEST_URL=$(curl -sL https://api.github.com/repos/Producdevity/gamehub-lite/releases/latest | grep "browser_download_url.*apk" | head -n 1 | cut -d '"' -f 4)
          wget -q -O base.apk "$LATEST_URL"

          # 2. APK Unpack
          mkdir -p apk_extracted
          unzip -q base.apk -d apk_extracted

          # 3. Create Clean WELCOME / VortexPS3 Splash
          convert -size 1080x1920 xc:black -gravity center \
            -fill white -pointsize 80 -annotate 0 "WELCOME" \
            -fill cyan -pointsize 45 -annotate +0+140 "VORTEXPS3 EMU" \
            welcome_splash.png

          # 4. Replace Startup Splash Logos
          find apk_extracted/res -type f \( -iname "*splash*" -o -iname "*logo*" -o -iname "*launch*" \) \( -name "*.png" -o -name "*.webp" \) | while read -r img; do
            W=$(identify -format "%w" "$img" 2>/dev/null || echo 1080)
            H=$(identify -format "%h" "$img" 2>/dev/null || echo 1920)
            convert welcome_splash.png -resize "${W}x${H}!" "$img" 2>/dev/null || true
          done

          # 5. Pack back to APK
          cd apk_extracted
          zip -q -r ../rebuilt.apk ./*
          cd ..

          # 6. Align and Sign
          zipalign -p -f 4 rebuilt.apk aligned.apk

          keytool -genkey -v -keystore test.keystore -storepass android -alias androidkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Yash, OU=AI VIDEO HUB, O=VortexPS3 Studios, L=City, S=State, C=IN"
          apksigner sign --ks test.keystore --ks-pass pass:android --out VortexPS3-Full-Emulator.apk aligned.apk

      - name: Upload Full VortexPS3 APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-Full-Emulator
          path: VortexPS3-Full-Emulator.apk
          
