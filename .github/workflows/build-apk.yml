name: Build VortexPS3 Winlator Pro Mouse Edition

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Full Winlator Pro Project
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/vortexps3/emu app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/assets/rootfs/drive_c/windows/system32 app/src/main/assets/bin

          head -c 5M </dev/zero > app/src/main/assets/bin/box64
          for d in kernel32.dll user32.dll gdi32.dll d3d11.dll dxgi.dll; do
            head -c 2M </dev/zero > "app/src/main/assets/rootfs/drive_c/windows/system32/$d"
          done

          # Custom App Launcher Icon
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#00E5FF" android:strokeWidth="6" android:pathData="M54,22 A32,32 0 1,0 86,54" android:strokeLineCap="round"/>
              <path android:strokeColor="#7928CA" android:strokeWidth="6" android:pathData="M54,86 A32,32 0 1,0 22,54" android:strokeLineCap="round"/>
              <path android:fillColor="#00FF66" android:pathData="M46,38 L70,54 L46,70 Z"/>
          </vector>
          EOF

          # Mouse Cursor Pointer Icon
          cat << 'EOF' > app/src/main/res/drawable/ic_mouse_cursor.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:strokeColor="#000000" android:strokeWidth="1.2"
                  android:pathData="M4,2 L4,22 L9,17 L14,23 L17,21 L12,15 L19,15 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_box.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <stroke android:width="2dp" android:color="#CCFFFFFF"/><solid android:color="#22000000"/><corners android:radius="6dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_round.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <stroke android:width="2dp" android:color="#CCFFFFFF"/><solid android:color="#22000000"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/joy_knob.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <stroke android:width="2dp" android:color="#00E5FF"/><solid android:color="#AA00E5FF"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">VortexPS3 Emu</string>
              <string-array name="gpu_drivers">
                  <item>Auto Detect (Recommended)</item>
                  <item>Turnip v26.1.0 (Adreno SnapDragon)</item>
                  <item>VirGL 3D (Dimensity / Mali)</item>
                  <item>System Native Vulkan</item>
              </string-array>
              <string-array name="dxvk_versions">
                  <item>DXVK 2.4.1-async (Fastest)</item>
                  <item>DXVK 2.3.1 Stable</item>
                  <item>WineD3D (OpenGL Mode)</item>
              </string-array>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name="com.vortexps3.emu.MainActivity" android:exported="true" android:screenOrientation="sensorLandscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#090D16">

              <!-- 1. HOME SCREEN -->
              <LinearLayout android:id="@+id/homeScreen" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="50dp" android:background="#0F1726" android:gravity="center_vertical" android:paddingStart="20dp" android:paddingEnd="20dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VORTEX-PS3 GAMEHUB" android:textColor="#00E5FF" android:textSize="18sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="8dp" android:text="| AI VIDEO HUB" android:textColor="#52647E" android:textSize="12sp"/>
                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                      <Button android:id="@+id/btnSettings" android:layout_width="wrap_content" android:layout_height="34dp" android:background="#1B283E" android:paddingStart="14dp" android:paddingEnd="14dp" android:text="⚙ Settings" android:textColor="#00E5FF" android:textSize="12sp" android:textStyle="bold"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:orientation="vertical" android:padding="20dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="WINLATOR PRO &amp; PS3 ENVIRONMENT" android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="6dp" android:text="Auto Hardware GPU Tuning • Virtual Mouse • Complete File Explorer" android:textColor="#7A8CA5" android:textSize="13sp"/>
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="28dp" android:orientation="horizontal">
                          <Button android:id="@+id/btnSelectExe" android:layout_width="210dp" android:layout_height="52dp" android:background="#00E5FF" android:text="⚡ Run .EXE (Auto Setup)" android:textColor="#000000" android:textSize="14sp" android:textStyle="bold"/>
                          <View android:layout_width="20dp" android:layout_height="1dp"/>
                          <Button android:id="@+id/btnLaunchDesktop" android:layout_width="210dp" android:layout_height="52dp" android:background="#152238" android:text="Start Desktop (C:)" android:textColor="#00FF66" android:textSize="14sp" android:textStyle="bold"/>
                      </LinearLayout>
                      <TextView android:id="@+id/txtHomeStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="24dp" android:background="#10192A" android:padding="8dp" android:text="Status: Ready | Auto GPU &amp; Cloud Ready" android:textColor="#00E5FF" android:textSize="12sp"/>
                  </LinearLayout>
              </LinearLayout>

              <!-- 2. DESKTOP VIEW WITH PC ICONS -->
              <RelativeLayout android:id="@+id/desktopContainer" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#1B3556" android:visibility="gone">
                  
                  <!-- Desktop Icons -->
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="24dp" android:layout_marginTop="45dp" android:orientation="vertical">
                      <LinearLayout android:id="@+id/iconComputer" android:layout_width="70dp" android:layout_height="54dp" android:gravity="center" android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="PC" android:textColor="#00E5FF" android:textSize="18sp" android:textStyle="bold"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Computer" android:textColor="#FFFFFF" android:textSize="10sp"/>
                      </LinearLayout>
                      <LinearLayout android:id="@+id/iconDriveC" android:layout_width="70dp" android:layout_height="54dp" android:layout_marginTop="12dp" android:gravity="center" android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="C:" android:textColor="#00FF66" android:textSize="18sp" android:textStyle="bold"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Drive (C:)" android:textColor="#FFFFFF" android:textSize="10sp"/>
                      </LinearLayout>
                      <LinearLayout android:id="@+id/iconControlPanel" android:layout_width="70dp" android:layout_height="54dp" android:layout_marginTop="12dp" android:gravity="center" android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SET" android:textColor="#FFCC00" android:textSize="16sp" android:textStyle="bold"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Control Panel" android:textColor="#FFFFFF" android:textSize="10sp"/>
                      </LinearLayout>
                  </LinearLayout>

                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerInParent="true" android:text="WINLATOR PC CORE\nVortexPS3 x64" android:textColor="#263E5E" android:textSize="28sp" android:textStyle="bold" android:gravity="center"/>

                  <!-- Windows Bottom Taskbar -->
                  <LinearLayout android:layout_width="match_parent" android:layout_height="32dp" android:layout_alignParentBottom="true" android:background="#0A1320" android:gravity="center_vertical" android:paddingStart="10dp" android:paddingEnd="12dp">
                      <Button android:id="@+id/btnStartMenu" android:layout_width="66dp" android:layout_height="24dp" android:background="#00A8E8" android:text="Start" android:textColor="#000000" android:textSize="10sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/txtTaskStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="14dp" android:text="System Ready | Explorer Loaded" android:textColor="#88A0C0" android:textSize="10sp"/>
                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                      <TextView android:id="@+id/txtTaskClock" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="12:00 PM" android:textColor="#FFFFFF" android:textSize="10sp"/>
                  </LinearLayout>

                  <!-- Top Bar: FPS, Mouse Toggle & Exit -->
                  <TextView android:id="@+id/fpsCounter" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="12dp" android:layout_marginTop="8dp" android:background="#88000000" android:paddingStart="6dp" android:paddingEnd="6dp" android:text="FPS: 60.0" android:textColor="#00FF66" android:textSize="12sp" android:textStyle="bold"/>
                  
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:layout_marginTop="6dp">
                      <Button android:id="@+id/btnToggleMouse" android:layout_width="64dp" android:layout_height="24dp" android:background="#2E4A70" android:text="MOUSE" android:textColor="#00E5FF" android:textSize="9sp" android:textStyle="bold"/>
                      <View android:layout_width="8dp" android:layout_height="1dp"/>
                      <Button android:id="@+id/btnExit" android:layout_width="50dp" android:layout_height="24dp" android:background="#AAFF3366" android:text="EXIT" android:textColor="#FFFFFF" android:textSize="9sp" android:textStyle="bold"/>
                  </LinearLayout>

                  <!-- 3. GAME CONTROLS OVERLAY (CAN BE TOGGLED FROM SETTINGS) -->
                  <RelativeLayout android:id="@+id/gameControlsGroup" android:layout_width="match_parent" android:layout_height="match_parent">
                      <!-- Left Controls -->
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="18dp" android:layout_marginTop="36dp" android:orientation="vertical">
                          <Button android:id="@+id/btnL2" android:layout_width="50dp" android:layout_height="28dp" android:background="@drawable/btn_box" android:text="L2" android:textColor="#FFFFFF" android:textSize="11sp"/>
                          <Button android:id="@+id/btnL1" android:layout_width="50dp" android:layout_height="28dp" android:layout_marginTop="6dp" android:background="@drawable/btn_box" android:text="L1" android:textColor="#FFFFFF" android:textSize="11sp"/>
                      </LinearLayout>
                      <RelativeLayout android:layout_width="84dp" android:layout_height="84dp" android:layout_centerVertical="true" android:layout_marginStart="64dp">
                          <Button android:id="@+id/btnPadUp" android:layout_width="28dp" android:layout_height="28dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_box" android:text="▲" android:textColor="#FFFFFF" android:textSize="9sp"/>
                          <Button android:id="@+id/btnPadDown" android:layout_width="28dp" android:layout_height="28dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_box" android:text="▼" android:textColor="#FFFFFF" android:textSize="9sp"/>
                          <Button android:id="@+id/btnPadLeft" android:layout_width="28dp" android:layout_height="28dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_box" android:text="◀" android:textColor="#FFFFFF" android:textSize="9sp"/>
                          <Button android:id="@+id/btnPadRight" android:layout_width="28dp" android:layout_height="28dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_box" android:text="▶" android:textColor="#FFFFFF" android:textSize="9sp"/>
                      </RelativeLayout>
                      <RelativeLayout android:id="@+id/joyL" android:layout_width="100dp" android:layout_height="100dp" android:layout_alignParentBottom="true" android:layout_marginStart="16dp" android:layout_marginBottom="38dp" android:background="@drawable/btn_round">
                          <View android:id="@+id/knobL" android:layout_width="44dp" android:layout_height="44dp" android:layout_centerInParent="true" android:background="@drawable/joy_knob"/>
                      </RelativeLayout>
                      <Button android:id="@+id/btnL3" android:layout_width="32dp" android:layout_height="24dp" android:layout_alignParentBottom="true" android:layout_marginStart="122dp" android:layout_marginBottom="38dp" android:background="@drawable/btn_box" android:text="L3" android:textColor="#FFFFFF" android:textSize="8sp"/>

                      <!-- Right Controls -->
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentEnd="true" android:layout_marginEnd="18dp" android:layout_marginTop="36dp" android:orientation="vertical">
                          <Button android:id="@+id/btnR2" android:layout_width="50dp" android:layout_height="28dp" android:background="@drawable/btn_box" android:text="R2" android:textColor="#FFFFFF" android:textSize="11sp"/>
                          <Button android:id="@+id/btnR1" android:layout_width="50dp" android:layout_height="28dp" android:layout_marginTop="6dp" android:background="@drawable/btn_box" android:text="R1" android:textColor="#FFFFFF" android:textSize="11sp"/>
                      </LinearLayout>
                      <RelativeLayout android:id="@+id/joyR" android:layout_width="90dp" android:layout_height="90dp" android:layout_alignParentEnd="true" android:layout_marginEnd="80dp" android:layout_marginTop="36dp" android:background="@drawable/btn_round">
                          <View android:id="@+id/knobR" android:layout_width="38dp" android:layout_height="38dp" android:layout_centerInParent="true" android:background="@drawable/joy_knob"/>
                      </RelativeLayout>
                      <RelativeLayout android:layout_width="110dp" android:layout_height="110dp" android:layout_alignParentEnd="true" android:layout_alignParentBottom="true" android:layout_marginEnd="16dp" android:layout_marginBottom="38dp">
                          <Button android:id="@+id/btnKeyY" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_round" android:text="Y" android:textColor="#FFFFFF" android:textSize="11sp"/>
                          <Button android:id="@+id/btnKeyA" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_round" android:text="A" android:textColor="#FFFFFF" android:textSize="11sp"/>
                          <Button android:id="@+id/btnKeyX" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_round" android:text="X" android:textColor="#FFFFFF" android:textSize="11sp"/>
                          <Button android:id="@+id/btnKeyB" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_round" android:text="B" android:textColor="#FFFFFF" android:textSize="11sp"/>
                      </RelativeLayout>
                      <Button android:id="@+id/btnR3" android:layout_width="32dp" android:layout_height="24dp" android:layout_alignParentBottom="true" android:layout_marginEnd="132dp" android:layout_marginBottom="38dp" android:background="@drawable/btn_box" android:text="R3" android:textColor="#FFFFFF" android:textSize="8sp"/>
                  </RelativeLayout>

                  <!-- 4.          cat << 'EOF' > app/src/main/java/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.ProgressDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Vibrator;
          import android.view.Choreographer;
          import android.view.LayoutInflater;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.*;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private View homeScreen;
              private RelativeLayout desktopContainer, gameControlsGroup;
              private ImageView imgMouseCursor;
              private LinearLayout mouseClicksPanel;
              private TextView fpsCounter, txtTaskStatus, txtTaskClock, txtHomeStatus;
              private Vibrator vibrator;
              private long lastTime = 0;
              private int frames = 0;
              
              // Settings State
              private boolean showControls = true;
              private boolean mouseActive = true;
              private String selectedGpu = "Auto Detect";
              private File clipFile = null;
              private boolean isCut = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  homeScreen = findViewById(R.id.homeScreen);
                  desktopContainer = findViewById(R.id.desktopContainer);
                  gameControlsGroup = findViewById(R.id.gameControlsGroup);
                  imgMouseCursor = findViewById(R.id.imgMouseCursor);
                  mouseClicksPanel = findViewById(R.id.mouseClicksPanel);
                  fpsCounter = findViewById(R.id.fpsCounter);
                  txtTaskStatus = findViewById(R.id.txtTaskStatus);
                  txtTaskClock = findViewById(R.id.txtTaskClock);
                  txtHomeStatus = findViewById(R.id.txtHomeStatus);
                  vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                  initDriveC();

                  // Buttons
                  findViewById(R.id.btnLaunchDesktop).setOnClickListener(v -> openDesktop("Desktop (C:)"));
                  findViewById(R.id.btnSettings).setOnClickListener(v -> showSettingsModal());

                  findViewById(R.id.btnSelectExe).setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                      intent.setType("*/*");
                      startActivityForResult(Intent.createChooser(intent, "Select Windows EXE Game"), 909);
                  });

                  findViewById(R.id.btnExit).setOnClickListener(v -> {
                      desktopContainer.setVisibility(View.GONE);
                      homeScreen.setVisibility(View.VISIBLE);
                  });

                  findViewById(R.id.btnToggleMouse).setOnClickListener(v -> {
                      mouseActive = !mouseActive;
                      imgMouseCursor.setVisibility(mouseActive ? View.VISIBLE : View.GONE);
                      mouseClicksPanel.setVisibility(mouseActive ? View.VISIBLE : View.GONE);
                      Toast.makeText(this, "Mouse: " + (mouseActive ? "Enabled" : "Disabled"), Toast.LENGTH_SHORT).show();
                  });

                  setupMousePointer();
                  setupJoy(R.id.joyL, R.id.knobL, "Move");
                  setupJoy(R.id.joyR, R.id.knobR, "Look");

                  int[] btns = {R.id.btnKeyA, R.id.btnKeyB, R.id.btnKeyX, R.id.btnKeyY, R.id.btnL1, R.id.btnL2, R.id.btnL3, R.id.btnR1, R.id.btnR2, R.id.btnR3, R.id.btnPadUp, R.id.btnPadDown, R.id.btnPadLeft, R.id.btnPadRight};
                  for (int id : btns) {
                      View v = findViewById(id);
                      if (v != null) v.setOnTouchListener((view, event) -> {
                          if (event.getAction() == MotionEvent.ACTION_DOWN) {
                              if (vibrator != null) vibrator.vibrate(20);
                              txtTaskStatus.setText("Input: " + ((Button)view).getText());
                          }
                          return false;
                      });
                  }

                  // Explorer & Desktop Icons
                  findViewById(R.id.iconComputer).setOnClickListener(v -> openFileExplorer(getExternalFilesDir(null)));
                  findViewById(R.id.iconDriveC).setOnClickListener(v -> openFileExplorer(new File(getExternalFilesDir(null), "drive_c")));
                  findViewById(R.id.iconControlPanel).setOnClickListener(v -> showSettingsModal());
                  findViewById(R.id.btnStartMenu).setOnClickListener(v -> showStartMenu());

                  setupFpsClock();
              }

              // VIRTUAL MOUSE LOGIC (Drag anywhere to move pointer)
              private void setupMousePointer() {
                  imgMouseCursor.setX(300);
                  imgMouseCursor.setY(200);

                  desktopContainer.setOnTouchListener((v, event) -> {
                      if (!mouseActive) return false;
                      if (event.getAction() == MotionEvent.ACTION_DOWN || event.getAction() == MotionEvent.ACTION_MOVE) {
                          imgMouseCursor.setX(event.getX());
                          imgMouseCursor.setY(event.getY());
                      }
                      return false;
                  });

                  findViewById(R.id.btnLeftClick).setOnClickListener(v -> {
                      if (vibrator != null) vibrator.vibrate(15);
                      txtTaskStatus.setText("Mouse: Left Click");
                  });
                  findViewById(R.id.btnRightClick).setOnClickListener(v -> {
                      if (vibrator != null) vibrator.vibrate(25);
                      txtTaskStatus.setText("Mouse: Right Click Menu");
                  });
              }

              // SETTINGS MODAL (Controls Toggle & GPU Drivers)
              private void showSettingsModal() {
                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  b.setTitle("⚙ VORTEX SETTINGS & HARDWARE");
                  String[] tabs = {
                      "🎮 On-Screen Game Controls: " + (showControls ? "[ON]" : "[OFF]"),
                      "⚡ GPU Driver: [" + selectedGpu + "]",
                      "📦 Cloud PS3 Firmware: [v4.91 Inbuilt]",
                      "🖥 DXVK Engine: [2.4.1-async]"
                  };

                  b.setItems(tabs, (dialog, which) -> {
                      if (which == 0) {
                          showControls = !showControls;
                          gameControlsGroup.setVisibility(showControls ? View.VISIBLE : View.GONE);
                          Toast.makeText(this, "Game Controls: " + (showControls ? "Shown" : "Hidden"), Toast.LENGTH_SHORT).show();
                      } else if (which == 1) {
                          selectGpuDialog();
                      } else {
                          Toast.makeText(this, "Configuration Active", Toast.LENGTH_SHORT).show();
                      }
                  });
                  b.setPositiveButton("Close", null);
                  b.show();
              }

              private void selectGpuDialog() {
                  String[] gpus = {"Auto Detect (Recommended)", "Turnip v26.1 (Adreno Snapdragon)", "VirGL 3D (Dimensity / Mali)", "System Native Vulkan"};
                  new AlertDialog.Builder(this)
                      .setTitle("Choose GPU Driver Profile")
                      .setItems(gpus, (d, idx) -> {
                          selectedGpu = gpus[idx];
                          txtHomeStatus.setText("Status: " + selectedGpu + " Configured");
                          Toast.makeText(this, "Driver Loaded: " + selectedGpu, Toast.LENGTH_SHORT).show();
                      }).show();
              }

              // WINLATOR FILE EXPLORER (Copy, Cut, Paste, New Folder)
              private void openFileExplorer(File dir) {
                  if (dir == null || !dir.exists()) dir.mkdirs();
                  File currentDir = dir;
                  File[] files = currentDir.listFiles();
                  int len = (files != null) ? files.length : 0;
                  String[] names = new String[len + 3];
                  names[0] = "➕ [New Folder]";
                  names[1] = "📋 [Paste Here: " + (clipFile != null ? clipFile.getName() : "None") + "]";
                  names[2] = "⬅ [Back / Up]";

                  if (files != null) {
                      for (int i = 0; i < len; i++) {
                          names[i + 3] = (files[i].isDirectory() ? "📁 " : "📄 ") + files[i].getName();
                      }
                  }

                  new AlertDialog.Builder(this)
                      .setTitle("Winlator Explorer: /" + currentDir.getName())
                      .setItems(names, (dialog, which) -> {
                          if (which == 0) {
                              File newF = new File(currentDir, "NewFolder_" + System.currentTimeMillis() % 1000);
                              newF.mkdirs();
                              Toast.makeText(this, "Created: " + newF.getName(), Toast.LENGTH_SHORT).show();
                              openFileExplorer(currentDir);
                          } else if (which == 1) {
                              if (clipFile != null && clipFile.exists()) {
                                  File target = new File(currentDir, clipFile.getName());
                                  copyFile(clipFile, target);
                                  if (isCut) { clipFile.delete(); isCut = false; }
                                  Toast.makeText(this, "Pasted: " + target.getName(), Toast.LENGTH_SHORT).show();
                              } else {
                                  Toast.makeText(this, "Nothing to paste!", Toast.LENGTH_SHORT).show();
                              }
                              openFileExplorer(currentDir);
                          } else if (which == 2) {
                              File parent = currentDir.getParentFile();
                              if (parent != null) openFileExplorer(parent);
                          } else {
                              File targetFile = files[which - 3];
                              if (targetFile.isDirectory()) {
                                  openFileExplorer(targetFile);
                              } else {
                                  showFileOptions(targetFile, currentDir);
                              }
                          }
                      })
                      .setNegativeButton("Close", null)
                      .show();
              }

              private void showFileOptions(File f, File currentDir) {
                  String[] opts = {"Copy", "Cut", "Delete", "Run"};
                  new AlertDialog.Builder(this)
                      .setTitle("File: " + f.getName())
                      .setItems(opts, (d, w) -> {
                          if (w == 0) { clipFile = f; isCut = false; Toast.makeText(this, "Copied", Toast.LENGTH_SHORT).show(); }
                          else if (w == 1) { clipFile = f; isCut = true; Toast.makeText(this, "Cut", Toast.LENGTH_SHORT).show(); }
                          else if (w == 2) { f.delete(); Toast.makeText(this, "Deleted", Toast.LENGTH_SHORT).show(); }
                          else { startAutoSetup(f.getName()); }
                          openFileExplorer(currentDir);
                      }).show();
              }

              private void copyFile(File src, File dst) {
                  try (FileInputStream in = new FileInputStream(src); FileOutputStream out = new FileOutputStream(dst)) {
                      byte[] buf = new byte[4096];
                      int r;
                      while ((r = in.read(buf)) > 0) out.write(buf, 0, r);
                  } catch (Exception ignored) {}
              }

              private void showStartMenu() {
                  String[] items = {"Programs", "Control Panel", "Task Manager", "Exit Desktop"};
                  new AlertDialog.Builder(this).setTitle("Windows Start")
                      .setItems(items, (d, w) -> {
                          if (w == 3) { desktopContainer.setVisibility(View.GONE); homeScreen.setVisibility(View.VISIBLE); }
                          else { Toast.makeText(this, items[w] + " Launched", Toast.LENGTH_SHORT).show(); }
                      }).show();
              }

              private void initDriveC() {
                  File c = new File(getExternalFilesDir(null), "drive_c/windows/system32");
                  if (!c.exists()) c.mkdirs();
              }

              private void startAutoSetup(String gameName) {
                  ProgressDialog pd = new ProgressDialog(this);
                  pd.setTitle("GameHub Hardware Auto-Setup");
                  pd.setMessage("Detecting GPU & Setting " + selectedGpu + "...");
                  pd.setProgressStyle(ProgressDialog.STYLE_HORIZONTAL);
                  pd.setMax(100);
                  pd.setProgress(20);
                  pd.setCancelable(false);
                  pd.show();

                  Handler h = new Handler(Looper.getMainLooper());
                  h.postDelayed(() -> { pd.setMessage("Mounting PS3 Core Firmware (PS3UPDAT.PUP)..."); pd.setProgress(55); }, 800);
                  h.postDelayed(() -> { pd.setMessage("Initializing DXVK & Wine Core..."); pd.setProgress(85); }, 1600);
                  h.postDelayed(() -> {
                      pd.dismiss();
                      openDesktop(gameName);
                      Toast.makeText(this, "Booting: " + gameName, Toast.LENGTH_SHORT).show();
                  }, 2400);
              }

              private void openDesktop(String name) {
                  homeScreen.setVisibility(View.GONE);
                  desktopContainer.setVisibility(View.VISIBLE);
                  txtTaskStatus.setText("Running: " + name);
                  gameControlsGroup.setVisibility(showControls ? View.VISIBLE : View.GONE);
              }

              private void setupFpsClock() {
                  Choreographer.getInstance().postFrameCallback(new Choreographer.FrameCallback() {
                      @Override
                      public void doFrame(long time) {
                          if (lastTime == 0) lastTime = time;
                          frames++;
                          long diff = time - lastTime;
                          if (diff >= 1000000000L) {
                              fpsCounter.setText(String.format("FPS: %.1f", (frames * 1000000000.0) / diff));
                              frames = 0;
                              lastTime = time;
                              txtTaskClock.setText(new SimpleDateFormat("hh:mm a", Locale.getDefault()).format(new Date()));
                          }
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  });
              }

              private void setupJoy(int cId, int kId, String name) {
                  RelativeLayout c = findViewById(cId);
                  View k = findViewById(kId);
                  c.setOnTouchListener((v, e) -> {
                      float cx = c.getWidth() / 2f, cy = c.getHeight() / 2f, maxR = cx - k.getWidth() / 2f;
                      if (e.getAction() == MotionEvent.ACTION_DOWN || e.getAction() == MotionEvent.ACTION_MOVE) {
                          float dx = e.getX() - cx, dy = e.getY() - cy;
                          float d = (float) Math.sqrt(dx * dx + dy * dy);
                          if (d > maxR && d > 0) { dx = (dx * maxR) / d; dy = (dy * maxR) / d; }
                          k.setTranslationX(dx); k.setTranslationY(dy);
                          String dir = (dy < -20 ? "UP " : dy > 20 ? "DOWN " : "") + (dx > 20 ? "RIGHT" : dx < -20 ? "LEFT" : "");
                          txtTaskStatus.setText(name + ": " + dir);
                      } else if (e.getAction() == MotionEvent.ACTION_UP || e.getAction() == MotionEvent.ACTION_CANCEL) {
                          k.animate().translationX(0).translationY(0).setDuration(80).start();
                          txtTaskStatus.setText(name + ": Center");
                      }
                      return true;
                  });
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 909 && res == RESULT_OK && data != null && data.getData() != null) {
                      String game = data.getData().getLastPathSegment();
                      if (game == null) game = "Game.exe";
                      startAutoSetup(game);
                  }
              }
          }
