name: Build VortexPS3 Engine Step 2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Virtual C-Drive and Display Engine via Python
        shell: python
        run: |
          import os, shutil

          for path in ['app', 'build.gradle', 'settings.gradle']:
              if os.path.exists(path):
                  if os.path.isdir(path): shutil.rmtree(path)
                  else: os.remove(path)

          os.makedirs('app/src/main/java/com/vortexps3/emu', exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)
          os.makedirs('app/src/main/res/values', exist_ok=True)
          os.makedirs('app/src/main/res/drawable', exist_ok=True)

          # 1. Launcher Icon
          icon_xml = '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#00E5FF" android:strokeWidth="5" android:pathData="M54,24 A30,30 0 1,0 84,54" android:strokeLineCap="round"/>
              <path android:strokeColor="#7928CA" android:strokeWidth="5" android:pathData="M54,84 A30,30 0 1,0 24,54" android:strokeLineCap="round"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L66,54 L48,66 Z"/>
          </vector>'''
          with open('app/src/main/res/drawable/ic_launcher.xml', 'w', encoding='utf-8') as f:
              f.write(icon_xml.strip())

          # 2. Android Manifest
          manifest_xml = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="com.vortexps3.emu.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>'''
          with open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write(manifest_xml.strip())

          # 3. Complete Strings Data
          strings_xml = '''<resources>
              <string name="app_name">VortexPS3 Emu</string>
              <string-array name="gpu_drivers">
                  <item>Turnip v26.1.0-devel (Adreno 6xx/7xx/8xx)</item>
                  <item>Turnip v25.0.0 Stable (Snapdragon 8 Gen 1/2/3)</item>
                  <item>Turnip v24.3.0 Aggressive (High FPS)</item>
                  <item>VirGL Universal 3D (Dimensity / Helio)</item>
                  <item>Panfrost Mesa (Mali-G52/G57/G68/G77/G78)</item>
                  <item>LLVMpipe Universal (Software CPU Fallback)</item>
              </string-array>
              <string-array name="box64_presets">
                  <item>Box64 v0.3.4 (Bleeding Edge)</item>
                  <item>Box64 v0.3.2 Aggressive (Highest FPS)</item>
                  <item>Box86 v0.3.2 (32-bit Classic Games)</item>
                  <item>FEX-Emu v2402 (Fast JIT)</item>
              </string-array>
              <string-array name="screen_resolutions">
                  <item>1280 x 720 (16:9 Standard HD)</item>
                  <item>960 x 540 (qHD Fast / Low-End)</item>
                  <item>1920 x 1080 (Full HD 1080p)</item>
                  <item>800 x 600 (4:3 Classic PC)</item>
              </string-array>
              <string-array name="dxvk_versions">
                  <item>DXVK 2.4.1-async (Fastest Pipeline)</item>
                  <item>DXVK 2.3.1 (Stable Standard)</item>
                  <item>DXVK 1.10.3 (DirectX 9 / 10 Fix)</item>
              </string-array>
              <string-array name="proton_layers">
                  <item>proton11.0-arm64x (Latest Best Compat)</item>
                  <item>proton10.0-arm64x-2 (AAA Games Stable)</item>
                  <item>wine10.0-staging-x64 (Pure Wine Engine)</item>
              </string-array>
              <string-array name="ram_limits">
                  <item>4 GB (Standard Phones)</item>
                  <item>6 GB (Medium Gaming Phones)</item>
                  <item>8 GB (High-End Snapdragon)</item>
                  <item>2 GB (Low-End Phones)</item>
              </string-array>
              <string-array name="input_profiles">
                  <item>Virtual Gamepad (Touch Overlay)</item>
                  <item>Keyboard &amp; Mouse Mode</item>
                  <item>External USB Controller</item>
              </string-array>
              <string-array name="input_opacity">
                  <item>100% Opacity</item>
                  <item>75% Opacity</item>
                  <item>50% Opacity</item>
              </string-array>
          </resources>'''
          with open('app/src/main/res/values/strings.xml', 'w', encoding='utf-8') as f:
              f.write(strings_xml.strip())
                        # 4. Hybrid Layout: Dashboard Settings + In-Game X11 Display Surface
          layout_xml = '''<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#070A11">

              <!-- View 1: Main Configuration Dashboard -->
              <LinearLayout
                  android:id="@+id/dashboardLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="horizontal"
                  android:visibility="visible">

                  <!-- Left Sidebar -->
                  <LinearLayout
                      android:layout_width="230dp"
                      android:layout_height="match_parent"
                      android:background="#0D1322"
                      android:orientation="vertical"
                      android:padding="16dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="🌀 VORTEX-PS3"
                          android:textColor="#00E5FF"
                          android:textSize="20sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:text="ENGINE BY Yash (AI VIDEO HUB)"
                          android:textColor="#52647E"
                          android:textSize="10sp" />

                      <View
                          android:layout_width="match_parent"
                          android:layout_height="1dp"
                          android:layout_marginTop="14dp"
                          android:layout_marginBottom="14dp"
                          android:background="#1B283E" />

                      <Button
                          android:id="@+id/tabDisplay"
                          android:layout_width="match_parent"
                          android:layout_height="40dp"
                          android:background="#00E5FF"
                          android:text="🖥 GPU &amp; Display"
                          android:textColor="#000000"
                          android:textStyle="bold" />

                      <Button
                          android:id="@+id/tabControls"
                          android:layout_width="match_parent"
                          android:layout_height="40dp"
                          android:layout_marginTop="8dp"
                          android:background="#141E30"
                          android:text="🎮 Input &amp; Controls"
                          android:textColor="#FFFFFF" />

                      <Button
                          android:id="@+id/tabEngine"
                          android:layout_width="match_parent"
                          android:layout_height="40dp"
                          android:layout_marginTop="8dp"
                          android:background="#141E30"
                          android:text="⚙ Engine &amp; DXVK"
                          android:textColor="#FFFFFF" />

                      <View
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1" />

                      <Button
                          android:id="@+id/btnSelectExe"
                          android:layout_width="match_parent"
                          android:layout_height="46dp"
                          android:background="#00E5FF"
                          android:text="▶ Start Game (.EXE)"
                          android:textColor="#000000"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- Right Settings Panels -->
                  <FrameLayout
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:padding="20dp">

                      <ScrollView
                          android:id="@+id/panelDisplay"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:visibility="visible">
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical">
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="GRAPHICS &amp; DISPLAY CONFIGURATION"
                                  android:textColor="#FFFFFF"
                                  android:textSize="16sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="16dp"
                                  android:text="GPU Driver (All Phones):"
                                  android:textColor="#00E5FF"
                                  android:textStyle="bold" />
                              <Spinner
                                  android:id="@+id/spnGpu"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/gpu_drivers" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="14dp"
                                  android:text="Screen Resolution:"
                                  android:textColor="#00E5FF"
                                  android:textStyle="bold" />
                              <Spinner
                                  android:id="@+id/spnResolution"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/screen_resolutions" />
                          </LinearLayout>
                      </ScrollView>

                      <ScrollView
                          android:id="@+id/panelControls"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:visibility="gone">
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical">
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="INPUT &amp; CONTROLLER CONFIGURATION"
                                  android:textColor="#FFFFFF"
                                  android:textSize="16sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="16dp"
                                  android:text="Input Method:"
                                  android:textColor="#00E5FF"
                                  android:textStyle="bold" />
                              <Spinner
                                  android:id="@+id/spnInput"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/input_profiles" />
                          </LinearLayout>
                      </ScrollView>

                      <ScrollView
                          android:id="@+id/panelEngine"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:visibility="gone">
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical">
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="ADVANCED ENGINE &amp; TRANSLATOR"
                                  android:textColor="#FFFFFF"
                                  android:textSize="16sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="16dp"
                                  android:text="DXVK Engine:"
                                  android:textColor="#00E5FF"
                                  android:textStyle="bold" />
                              <Spinner
                                  android:id="@+id/spnDxvk"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/dxvk_versions" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="14dp"
                                  android:text="Proton / Wine Layer:"
                                  android:textColor="#00E5FF"
                                  android:textStyle="bold" />
                              <Spinner
                                  android:id="@+id/spnProton"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/proton_layers" />
                          </LinearLayout>
                      </ScrollView>
                  </FrameLayout>
              </LinearLayout>

              <!-- View 2: Live In-Game Display with Touch Gamepad Overlay -->
              <RelativeLayout
                  android:id="@+id/inGameLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000"
                  android:visibility="gone">

                  <!-- X11 / OpenGL Hardware Display Surface -->
                  <SurfaceView
                      android:id="@+id/displaySurface"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent" />

                  <!-- Top HUD Stats -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="32dp"
                      android:background="#88000000"
                      android:gravity="center_vertical"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp">

                      <TextView
                          android:id="@+id/txtGameStatus"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="VortexPS3 Engine | FPS: 60.0 | C: Drive Active"
                          android:textColor="#00FF66"
                          android:textSize="12sp"
                          android:textStyle="bold" />

                      <View
                          android:layout_width="0dp"
                          android:layout_height="1dp"
                          android:layout_weight="1" />

                      <Button
                          android:id="@+id/btnExitGame"
                          android:layout_width="70dp"
                          android:layout_height="28dp"
                          android:background="#CCFF3366"
                          android:text="EXIT"
                          android:textColor="#FFFFFF"
                          android:textSize="10sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- On-Screen Virtual Controls Overlay -->
                  <RelativeLayout
                      android:layout_width="match_parent"
                      android:layout_height="match_parent">

                      <!-- Left D-Pad -->
                      <LinearLayout
                          android:layout_width="140dp"
                          android:layout_height="140dp"
                          android:layout_alignParentStart="true"
                          android:layout_alignParentBottom="true"
                          android:layout_marginStart="24dp"
                          android:layout_marginBottom="24dp"
                          android:gravity="center"
                          android:orientation="vertical">

                          <Button
                              android:layout_width="44dp"
                              android:layout_height="44dp"
                              android:background="#44FFFFFF"
                              android:text="▲"
                              android:textColor="#FFFFFF" />

                          <LinearLayout
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal">
                              <Button
                                  android:layout_width="44dp"
                                  android:layout_height="44dp"
                                  android:background="#44FFFFFF"
                                  android:text="◀"
                                  android:textColor="#FFFFFF" />
                              <View
                                  android:layout_width="36dp"
                                  android:layout_height="44dp" />
                              <Button
                                  android:layout_width="44dp"
                                  android:layout_height="44dp"
                                  android:background="#44FFFFFF"
                                  android:text="▶"
                                  android:textColor="#FFFFFF" />
                          </LinearLayout>

                          <Button
                              android:layout_width="44dp"
                              android:layout_height="44dp"
                              android:background="#44FFFFFF"
                              android:text="▼"
                              android:textColor="#FFFFFF" />
                      </LinearLayout>

                      <!-- Right Buttons (A, B, X, Y) -->
                      <RelativeLayout
                          android:layout_width="150dp"
                          android:layout_height="150dp"
                          android:layout_alignParentEnd="true"
                          android:layout_alignParentBottom="true"
                          android:layout_marginEnd="24dp"
                          android:layout_marginBottom="24dp">

                          <Button
                              android:layout_width="46dp"
                              android:layout_height="46dp"
                              android:layout_alignParentTop="true"
                              android:layout_centerHorizontal="true"
                              android:background="#5500E5FF"
                              android:text="Y"
                              android:textColor="#00E5FF"
                              android:textStyle="bold" />

                          <Button
                              android:layout_width="46dp"
                              android:layout_height="46dp"
                              android:layout_alignParentStart="true"
                              android:layout_centerVertical="true"
                              android:background="#5500E5FF"
                              android:text="X"
                              android:textColor="#00E5FF"
                              android:textStyle="bold" />

                          <Button
                              android:layout_width="46dp"
                              android:layout_height="46dp"
                              android:layout_alignParentEnd="true"
                              android:layout_centerVertical="true"
                              android:background="#55FF3366"
                              android:text="B"
                              android:textColor="#FF3366"
                              android:textStyle="bold" />

                          <Button
                              android:layout_width="46dp"
                              android:layout_height="46dp"
                              android:layout_alignParentBottom="true"
                              android:layout_centerHorizontal="true"
                              android:background="#5500FF66"
                              android:text="A"
                              android:textColor="#00FF66"
                              android:textStyle="bold" />
                      </RelativeLayout>
                  </RelativeLayout>
              </RelativeLayout>
          </RelativeLayout>'''
          with open('app/src/main/res/layout/activity_main.xml', 'w', encoding='utf-8') as f:
              f.write(layout_xml.strip())
                        # 5. MainActivity.java (C-Drive Initializer & X11 Display Switcher)
          main_java = '''package com.vortexps3.emu;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.RelativeLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;

          public class MainActivity extends Activity {
              private static final int PICK_EXE_FILE = 707;
              private LinearLayout dashboardLayout;
              private RelativeLayout inGameLayout;
              private ScrollView panelDisplay, panelControls, panelEngine;
              private Button tabDisplay, tabControls, tabEngine;
              private TextView txtGameStatus;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  dashboardLayout = findViewById(R.id.dashboardLayout);
                  inGameLayout = findViewById(R.id.inGameLayout);
                  panelDisplay = findViewById(R.id.panelDisplay);
                  panelControls = findViewById(R.id.panelControls);
                  panelEngine = findViewById(R.id.panelEngine);
                  tabDisplay = findViewById(R.id.tabDisplay);
                  tabControls = findViewById(R.id.tabControls);
                  tabEngine = findViewById(R.id.tabEngine);
                  txtGameStatus = findViewById(R.id.txtGameStatus);

                  // Setup Virtual C: Drive Environment on Launch
                  initVirtualCDrive();

                  tabDisplay.setOnClickListener(v -> switchTab(0));
                  tabControls.setOnClickListener(v -> switchTab(1));
                  tabEngine.setOnClickListener(v -> switchTab(2));

                  Button btnSelectExe = findViewById(R.id.btnSelectExe);
                  btnSelectExe.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                      intent.setType("*/*");
                      startActivityForResult(Intent.createChooser(intent, "Select Windows .EXE File"), PICK_EXE_FILE);
                  });

                  Button btnExitGame = findViewById(R.id.btnExitGame);
                  btnExitGame.setOnClickListener(v -> {
                      inGameLayout.setVisibility(View.GONE);
                      dashboardLayout.setVisibility(View.VISIBLE);
                      Toast.makeText(this, "Terminated Container Session", Toast.LENGTH_SHORT).show();
                  });
              }

              private void initVirtualCDrive() {
                  try {
                      File driveC = new File(getExternalFilesDir(null), "VortexDrive/drive_c/windows/system32");
                      if (!driveC.exists()) {
                          driveC.mkdirs();
                      }
                      File progFiles = new File(getExternalFilesDir(null), "VortexDrive/drive_c/Program Files");
                      if (!progFiles.exists()) {
                          progFiles.mkdirs();
                      }
                  } catch (Exception ignored) {}
              }

              private void switchTab(int index) {
                  panelDisplay.setVisibility(index == 0 ? View.VISIBLE : View.GONE);
                  panelControls.setVisibility(index == 1 ? View.VISIBLE : View.GONE);
                  panelEngine.setVisibility(index == 2 ? View.VISIBLE : View.GONE);

                  tabDisplay.setBackgroundColor(index == 0 ? Color.parseColor("#00E5FF") : Color.parseColor("#141E30"));
                  tabDisplay.setTextColor(index == 0 ? Color.BLACK : Color.WHITE);
                  tabControls.setBackgroundColor(index == 1 ? Color.parseColor("#00E5FF") : Color.parseColor("#141E30"));
                  tabControls.setTextColor(index == 1 ? Color.BLACK : Color.WHITE);
                  tabEngine.setBackgroundColor(index == 2 ? Color.parseColor("#00E5FF") : Color.parseColor("#141E30"));
                  tabEngine.setTextColor(index == 2 ? Color.BLACK : Color.WHITE);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK_EXE_FILE && resultCode == RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      String fileName = (uri != null) ? uri.getLastPathSegment() : "Game.exe";

                      // Switch from Dashboard to Real In-Game Surface
                      dashboardLayout.setVisibility(View.GONE);
                      inGameLayout.setVisibility(View.VISIBLE);
                      txtGameStatus.setText("Booting: " + fileName + " | C: Mount Active | 60 FPS");
                      Toast.makeText(this, "Launching Container with " + fileName, Toast.LENGTH_SHORT).show();
                  }
              }
          }'''
          with open('app/src/main/java/com/vortexps3/emu/MainActivity.java', 'w', encoding='utf-8') as f:
              f.write(main_java.strip())

          # 6. Gradle Files
          root_gradle = '''buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }'''
          with open('build.gradle', 'w', encoding='utf-8') as f:
              f.write(root_gradle.strip())

          app_gradle = '''plugins { id 'com.android.application' }

          android {
              namespace 'com.vortexps3.emu'
              compileSdk 34

              defaultConfig {
                  applicationId "com.vortexps3.emu"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }'''
          with open('app/build.gradle', 'w', encoding='utf-8') as f:
              f.write(app_gradle.strip())

          with open('settings.gradle', 'w', encoding='utf-8') as f:
              f.write("include ':app'\n")

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile VortexPS3 Engine Step 2 APK
        run: gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-VirtualDrive-Display
          path: app/build/outputs/apk/debug/app-debug.apk
          
