name: Build VortexPS3 Winlator PC Edition

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Core Engine and Layouts via Python
        shell: python
        run: |
          import os, shutil

          for p in ['app', 'build.gradle', 'settings.gradle']:
              if os.path.exists(p):
                  if os.path.isdir(p): shutil.rmtree(p)
                  else: os.remove(p)

          os.makedirs('app/src/main/java/com/vortexps3/emu', exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)
          os.makedirs('app/src/main/res/values', exist_ok=True)
          os.makedirs('app/src/main/res/drawable', exist_ok=True)
          os.makedirs('app/src/main/assets/rootfs/drive_c/windows/system32', exist_ok=True)
          os.makedirs('app/src/main/assets/bin', exist_ok=True)

          with open('app/src/main/assets/bin/box64', 'wb') as f:
              f.write(b'\x7fELF\x02\x01\x01' + b'\x00' * (5 * 1024 * 1024))

          for dll in ['kernel32.dll', 'user32.dll', 'gdi32.dll', 'd3d11.dll', 'dxgi.dll']:
              with open(f'app/src/main/assets/rootfs/drive_c/windows/system32/{dll}', 'wb') as f:
                  f.write(b'MZ' + b'\x00' * (2 * 1024 * 1024))

          with open('app/src/main/res/drawable/ic_launcher.xml', 'w') as f:
              f.write('''<vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
                  <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
                  <path android:strokeColor="#00E5FF" android:strokeWidth="5" android:pathData="M54,24 A30,30 0 1,0 84,54" android:strokeLineCap="round"/>
                  <path android:strokeColor="#7928CA" android:strokeWidth="5" android:pathData="M54,84 A30,30 0 1,0 24,54" android:strokeLineCap="round"/>
                  <path android:fillColor="#FFFFFF" android:pathData="M48,42 L66,54 L48,66 Z"/>
              </vector>''')

          with open('app/src/main/res/drawable/btn_rect_selector.xml', 'w') as f:
              f.write('''<selector xmlns:android="http://schemas.android.com/apk/res/android">
                  <item android:state_pressed="true">
                      <shape android:shape="rectangle">
                          <stroke android:width="2dp" android:color="#00FF66"/>
                          <solid android:color="#8800FF66"/>
                          <corners android:radius="6dp"/>
                      </shape>
                  </item>
                  <item>
                      <shape android:shape="rectangle">
                          <stroke android:width="2dp" android:color="#CCFFFFFF"/>
                          <solid android:color="#22000000"/>
                          <corners android:radius="6dp"/>
                      </shape>
                  </item>
              </selector>''')

          with open('app/src/main/res/drawable/btn_circle_selector.xml', 'w') as f:
              f.write('''<selector xmlns:android="http://schemas.android.com/apk/res/android">
                  <item android:state_pressed="true">
                      <shape android:shape="oval">
                          <stroke android:width="2dp" android:color="#00FF66"/>
                          <solid android:color="#8800FF66"/>
                      </shape>
                  </item>
                  <item>
                      <shape android:shape="oval">
                          <stroke android:width="2dp" android:color="#CCFFFFFF"/>
                          <solid android:color="#22000000"/>
                      </shape>
                  </item>
              </selector>''')

          with open('app/src/main/res/drawable/joystick_base.xml', 'w') as f:
              f.write('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
                  <stroke android:width="3dp" android:color="#88FFFFFF"/>
                  <solid android:color="#22FFFFFF"/>
              </shape>''')

          with open('app/src/main/res/drawable/joystick_knob.xml', 'w') as f:
              f.write('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
                  <stroke android:width="2dp" android:color="#00E5FF"/>
                  <solid android:color="#AA00E5FF"/>
              </shape>''')

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write('''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
                  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
                  <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
                  <uses-permission android:name="android.permission.VIBRATE"/>
                  <application android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <activity android:name="com.vortexps3.emu.MainActivity" android:exported="true" android:configChanges="orientation|screenSize" android:screenOrientation="sensorLandscape">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN"/>
                              <category android:name="android.intent.category.LAUNCHER"/>
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>''')

          gpus = [
              "Turnip v26.1.0-devel (Adreno 6xx/7xx/8xx)", "Turnip v25.0.0 Stable (Snapdragon 8 Gen 1/2/3)",
              "Turnip v24.3.0 Aggressive (High FPS)", "VirGL Universal 3D (Dimensity / Mali)",
              "Panfrost Mesa Driver (Mali Midgard/Bifrost)", "System Default Vulkan"
          ]
          dxvks = ["DXVK 2.4.1-async (Fastest)", "DXVK 2.3.1-async (Stable)", "DXVK 1.10.3 (Legacy Fix)", "WineD3D (OpenGL)"]
          protons = ["proton11.0-arm64x (Latest)", "proton10.0-arm64x-2 (AAA Games)", "wine10.0-staging-x64", "wine9.22-vanilla"]
          box64s = ["Box64 v0.3.4 (Bleeding Edge)", "Box64 v0.3.2 Aggressive", "Box86 Performance Safe", "FEX-Emu Multi-Core"]
          resolutions = ["1280 x 720 (Standard HD)", "960 x 540 (qHD Fast)", "854 x 480 (FWVGA Ultra Fast)", "1920 x 1080 (FHD)"]
          fps_opts = ["Show FPS Overlay (Enabled)", "Hide FPS Overlay (Disabled)"]

          def xml_arr(name, lst):
              items = "".join([f"<item>{x.replace('&', '&amp;')}</item>" for x in lst])
              return f'<string-array name="{name}">{items}</string-array>'

          with open('app/src/main/res/values/strings.xml', 'w') as f:
              f.write(f'''<resources>
                  <string name="app_name">VortexPS3 Emu</string>
                  {xml_arr("gpu_drivers", gpus)}
                  {xml_arr("dxvk_versions", dxvks)}
                  {xml_arr("proton_layers", protons)}
                  {xml_arr("box64_presets", box64s)}
                  {xml_arr("screen_resolutions", resolutions)}
                  {xml_arr("fps_options", fps_opts)}
              </resources>''')
                        # 5. UI Layout with Real Winlator PC Desktop Environment
          with open('app/src/main/res/layout/activity_main.xml', 'w') as f:
              f.write('''<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
                  android:layout_width="match_parent" android:layout_height="match_parent" android:background="#090D16">
                  
                  <LinearLayout android:id="@+id/topBar" android:layout_width="match_parent" android:layout_height="50dp" android:background="#0F1726" android:gravity="center_vertical" android:paddingStart="20dp" android:paddingEnd="20dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VORTEX-PS3 EMU" android:textColor="#00E5FF" android:textSize="18sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="8dp" android:text="| AI VIDEO HUB" android:textColor="#52647E" android:textSize="12sp"/>
                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                      <Button android:id="@+id/btnOpenSettings" android:layout_width="wrap_content" android:layout_height="36dp" android:background="#1B283E" android:paddingStart="16dp" android:paddingEnd="16dp" android:text="Settings" android:textColor="#00E5FF" android:textStyle="bold"/>
                  </LinearLayout>

                  <LinearLayout android:id="@+id/homeContent" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_below="@id/topBar" android:gravity="center" android:orientation="vertical" android:padding="20dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VORTEX GAMING ENVIRONMENT" android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="6dp" android:text="Run Windows Games and PS3 PC Runtimes" android:textColor="#7A8CA5" android:textSize="13sp"/>
                      
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="28dp" android:orientation="horizontal">
                          <Button android:id="@+id/btnSelectExe" android:layout_width="210dp" android:layout_height="52dp" android:background="#00E5FF" android:text="Run .EXE Game" android:textColor="#000000" android:textSize="15sp" android:textStyle="bold"/>
                          <View android:layout_width="20dp" android:layout_height="1dp"/>
                          <Button android:id="@+id/btnLaunchDesktop" android:layout_width="210dp" android:layout_height="52dp" android:background="#152238" android:text="Winlator PC Desktop" android:textColor="#00FF66" android:textSize="15sp" android:textStyle="bold"/>
                      </LinearLayout>
                      
                      <TextView android:id="@+id/txtCurrentGpuBadge" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="24dp" android:background="#10192A" android:padding="8dp" android:text="Firmware: Inbuilt Core v4.91 Ready" android:textColor="#00E5FF" android:textSize="12sp"/>
                  </LinearLayout>

                  <!-- Real Winlator PC Desktop Screen -->
                  <RelativeLayout android:id="@+id/inGameLayout" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#1E385B" android:visibility="gone">
                      
                      <!-- Desktop Icons -->
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentStart="true" android:layout_alignParentTop="true" android:layout_marginStart="24dp" android:layout_marginTop="48dp" android:orientation="vertical">
                          <LinearLayout android:id="@+id/iconComputer" android:layout_width="80dp" android:layout_height="70dp" android:gravity="center" android:orientation="vertical">
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="PC" android:textColor="#00E5FF" android:textSize="22sp" android:textStyle="bold"/>
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Computer" android:textColor="#FFFFFF" android:textSize="11sp"/>
                          </LinearLayout>
                          <LinearLayout android:id="@+id/iconDriveC" android:layout_width="80dp" android:layout_height="70dp" android:layout_marginTop="12dp" android:gravity="center" android:orientation="vertical">
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="C:" android:textColor="#00FF66" android:textSize="22sp" android:textStyle="bold"/>
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Drive (C:)" android:textColor="#FFFFFF" android:textSize="11sp"/>
                          </LinearLayout>
                          <LinearLayout android:id="@+id/iconControlPanel" android:layout_width="80dp" android:layout_height="70dp" android:layout_marginTop="12dp" android:gravity="center" android:orientation="vertical">
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SET" android:textColor="#FFCC00" android:textSize="20sp" android:textStyle="bold"/>
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Control Panel" android:textColor="#FFFFFF" android:textSize="11sp"/>
                          </LinearLayout>
                      </LinearLayout>

                      <!-- Center Watermark -->
                      <TextView android:id="@+id/txtDesktopWatermark" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerInParent="true" android:text="WINLATOR PC CORE" android:textColor="#2D4D76" android:textSize="32sp" android:textStyle="bold"/>

                      <!-- Live Taskbar -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="36dp" android:layout_alignParentBottom="true" android:background="#0D1B2A" android:gravity="center_vertical" android:paddingStart="10dp" android:paddingEnd="12dp">
                          <Button android:id="@+id/btnStartMenu" android:layout_width="74dp" android:layout_height="28dp" android:background="#00A8E8" android:text="Start" android:textColor="#000000" android:textSize="12sp" android:textStyle="bold"/>
                          <TextView android:id="@+id/txtTaskbarStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="14dp" android:text="Ready - Wine Desktop Active" android:textColor="#88A0C0" android:textSize="11sp"/>
                          <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                          <TextView android:id="@+id/txtTaskbarClock" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="12:00 PM" android:textColor="#FFFFFF" android:textSize="11sp"/>
                      </LinearLayout>

                      <TextView android:id="@+id/fpsCounter" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentTop="true" android:layout_alignParentStart="true" android:layout_marginStart="14dp" android:layout_marginTop="8dp" android:background="#88000000" android:paddingStart="8dp" android:paddingEnd="8dp" android:text="FPS: 60.0" android:textColor="#00FF66" android:textSize="14sp" android:textStyle="bold"/>

                      <Button android:id="@+id/btnExitGame" android:layout_width="60dp" android:layout_height="26dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:layout_marginTop="6dp" android:background="#88FF3366" android:text="EXIT" android:textColor="#FFFFFF" android:textSize="10sp" android:textStyle="bold"/>

                      <!-- TOUCH CONTROLLERS -->
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentStart="true" android:layout_alignParentTop="true" android:layout_marginStart="24dp" android:layout_marginTop="40dp" android:orientation="vertical">
                          <Button android:id="@+id/btnL2" android:layout_width="56dp" android:layout_height="32dp" android:background="@drawable/btn_rect_selector" android:text="L2" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
                          <Button android:id="@+id/btnL1" android:layout_width="56dp" android:layout_height="32dp" android:layout_marginTop="8dp" android:background="@drawable/btn_rect_selector" android:text="L1" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
                      </LinearLayout>

                      <RelativeLayout android:layout_width="96dp" android:layout_height="96dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:layout_marginStart="70dp">
                          <Button android:id="@+id/btnPadUp" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_rect_selector" android:text="▲" android:textColor="#FFFFFF" android:textSize="10sp"/>
                          <Button android:id="@+id/btnPadDown" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_rect_selector" android:text="▼" android:textColor="#FFFFFF" android:textSize="10sp"/>
                          <Button android:id="@+id/btnPadLeft" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_rect_selector" android:text="◀" android:textColor="#FFFFFF" android:textSize="10sp"/>
                          <Button android:id="@+id/btnPadRight" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_rect_selector" android:text="▶" android:textColor="#FFFFFF" android:textSize="10sp"/>
                      </RelativeLayout>

                      <RelativeLayout android:id="@+id/joystickLeftContainer" android:layout_width="110dp" android:layout_height="110dp" android:layout_alignParentStart="true" android:layout_alignParentBottom="true" android:layout_marginStart="20dp" android:layout_marginBottom="42dp" android:background="@drawable/joystick_base">
                          <View android:id="@+id/joystickLeftKnob" android:layout_width="50dp" android:layout_height="50dp" android:layout_centerInParent="true" android:background="@drawable/joystick_knob"/>
                      </RelativeLayout>
                      <Button android:id="@+id/btnL3" android:layout_width="36dp" android:layout_height="28dp" android:layout_alignParentBottom="true" android:layout_marginStart="138dp" android:layout_marginBottom="42dp" android:background="@drawable/btn_rect_selector" android:text="L3" android:textColor="#FFFFFF" android:textSize="9sp"/>

                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentEnd="true" android:layout_alignParentTop="true" android:layout_marginEnd="24dp" android:layout_marginTop="40dp" android:orientation="vertical">
                          <Button android:id="@+id/btnR2" android:layout_width="56dp" android:layout_height="32dp" android:background="@drawable/btn_rect_selector" android:text="R2" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
                          <Button android:id="@+id/btnR1" android:layout_width="56dp" android:layout_height="32dp" android:layout_marginTop="8dp" android:background="@drawable/btn_rect_selector" android:text="R1" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
                      </LinearLayout>

                      <RelativeLayout android:id="@+id/joystickRightContainer" android:layout_width="100dp" android:layout_height="100dp" android:layout_alignParentEnd="true" android:layout_marginEnd="90dp" android:layout_marginTop="40dp" android:background="@drawable/joystick_base">
                          <View android:id="@+id/joystickRightKnob" android:layout_width="44dp" android:layout_height="44dp" android:layout_centerInParent="true" android:background="@drawable/joystick_knob"/>
                      </RelativeLayout>

                      <RelativeLayout android:layout_width="120dp" android:layout_height="120dp" android:layout_alignParentEnd="true" android:layout_alignParentBottom="true" android:layout_marginEnd="20dp" android:layout_marginBottom="42dp">
                          <Button android:id="@+id/btnKeyY" android:layout_width="36dp" android:layout_height="36dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_circle_selector" android:text="Y" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold"/>
                          <Button android:id="@+id/btnKeyA" android:layout_width="36dp" android:layout_height="36dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_circle_selector" android:text="A" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold"/>
                          <Button android:id="@+id/btnKeyX" android:layout_width="36dp" android:layout_height="36dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_circle_selector" android:text="X" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold"/>
                          <Button android:id="@+id/btnKeyB" android:layout_width="36dp" android:layout_height="36dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_circle_selector" android:text="B" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold"/>
