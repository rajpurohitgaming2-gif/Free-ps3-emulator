name: Build VortexPS3 Clean Home Edition

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Core Engine and Layouts via Python
        shell: python
        run: |
          import os, shutil

          for p in ['app', 'build.gradle', 'settings.gradle']:
              if os.path.exists(p):
                  if os.path.isdir(p): shutil.rmtree(p)
                  else: os.remove(p)

          os.makedirs('app/src/main/java/com/vortexps3/emu', exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)
          os.makedirs('app/src/main/res/values', exist_ok=True)
          os.makedirs('app/src/main/res/drawable', exist_ok=True)
          os.makedirs('app/src/main/assets/rootfs/drive_c/windows/system32', exist_ok=True)
          os.makedirs('app/src/main/assets/rootfs/drive_c/Program Files', exist_ok=True)

          for dll in ['kernel32.dll', 'user32.dll', 'gdi32.dll', 'd3d11.dll', 'dxgi.dll']:
              with open(f'app/src/main/assets/rootfs/drive_c/windows/system32/{dll}', 'wb') as f:
                  f.write(b'MZ' + b'\x00' * 512 * 1024)

          with open('app/src/main/res/drawable/ic_launcher.xml', 'w') as f:
              f.write('''<vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
                  <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
                  <path android:strokeColor="#00E5FF" android:strokeWidth="5" android:pathData="M54,24 A30,30 0 1,0 84,54" android:strokeLineCap="round"/>
                  <path android:strokeColor="#7928CA" android:strokeWidth="5" android:pathData="M54,84 A30,30 0 1,0 24,54" android:strokeLineCap="round"/>
                  <path android:fillColor="#FFFFFF" android:pathData="M48,42 L66,54 L48,66 Z"/>
              </vector>''')

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write('''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
                  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
                  <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
                  <application android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <activity android:name="com.vortexps3.emu.MainActivity" android:exported="true" android:configChanges="orientation|screenSize" android:screenOrientation="sensorLandscape">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN"/>
                              <category android:name="android.intent.category.LAUNCHER"/>
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>''')

          gpus = [
              "Turnip v26.1.0-devel (Adreno 6xx/7xx/8xx)", "Turnip v25.0.0 Stable (Snapdragon 8 Gen 1/2/3)",
              "Turnip v24.3.0 Aggressive (High FPS)", "Turnip v24.2.0-rc4 (Balanced Stability)",
              "Turnip v24.1.0 Classic (Snapdragon 720G/778G/870)", "Turnip v23.3.0 Legacy (Adreno 5xx/6xx Old)",
              "Turnip A8xx Hotfix (Snapdragon 8 Gen 3/4 Fix)", "Turnip DXVK-GPL Enabled Build (No Stutter)",
              "Turnip Kgsl / Sysfs Optimized Driver", "Qualcomm Proprietary v0615.0 (Vulkan 1.3 Native)",
              "Qualcomm Proprietary v0512.68 (Adreno 6xx)", "VirGL Universal 3D (Dimensity 7000/8000/9000)",
              "VirGL Mali-G7x Compatibility Fix", "Panfrost Mesa Driver (Mali Midgard/Bifrost/Valhall)",
              "Mali Immortalis G715/G720 Vulkan Compatibility", "Zink Engine (OpenGL via Vulkan Translation)",
              "LLVMpipe Universal (Software CPU Fallback)", "System Default Android Vulkan Driver"
          ]
          dxvks = [
              "DXVK 2.4.1-async (Fastest Pipeline)", "DXVK 2.3.1-async (Balanced Stable)",
              "DXVK 2.2-gpl (DirectX 11 Modern Titles)", "DXVK 2.0-async (Smooth FPS Optimizer)",
              "DXVK 1.10.3 (DirectX 9 / 10 Legacy Games Fix)", "DXVK 1.9.4 (DirectX 9 Lightweight)",
              "VKD3D-Proton 2.13 (DirectX 12 Support)", "WineD3D (OpenGL Pure Translation)"
          ]
          protons = [
              "proton11.0-arm64x (Latest Best Game Compatibility)", "proton10.0-arm64x-2 (AAA Games Stable)",
              "proton9.0-arm64x-3 (Low System Overhead)", "proton-ge-custom-8.26 (Gaming Optimized)",
              "wine10.0-staging-x64 (Pure Wine Engine)", "wine9.22-vanilla-x64 (Native Windows Core)",
              "wine9.16-esync (Multi-Thread Performance)", "wine8.18-stable (High Stability Fallback)",
              "wine7.22-legacy (Old PC Games Specialist)"
          ]
          box64s = [
              "Box64 v0.3.4 (Bleeding Edge - Latest Instructions)", "Box64 v0.3.2 Aggressive (Highest FPS Booster)",
              "Box64 v0.3.0 Balanced (Most Stable for AAA)", "Box64 v0.2.8 Legacy (Old 64-bit Game Fix)",
              "Box64 Safe Multi-threading (Big.LITTLE Fix)", "Box64 Dynarec Fastmath Mode (Speed Hack)",
              "Box86 v0.3.2 Aggressive (32-bit Classic Games)", "Box86 Performance Safe (GTA / NFS / Classic PC)",
              "Box86 Compatibility (Fix Old Visual C++ Errors)", "FEX-Emu v2402 (Fast ARM64 JIT Translator)",
              "FEX-Emu Multi-Core Vector Mode", "Hangover / WOW64 Native Engine (Direct Translation)"
          ]
          resolutions = [
              "1280 x 720 (16:9 Standard HD - Recommended)", "960 x 540 (qHD Fast Performance / Low-End)",
              "854 x 480 (FWVGA Ultra Fast Mode)", "1600 x 900 (HD+ Balanced)",
              "1920 x 1080 (Full HD 1080p - High End Phones)", "800 x 600 (4:3 Classic PC Scale)",
              "1024 x 768 (4:3 Standard)"
          ]
          rams = ["4 GB (Standard Phones)", "6 GB (Medium Gaming)", "8 GB (High-End Snapdragon)", "3 GB (Balanced)", "2 GB (Low-End Phones)"]

          def xml_arr(name, lst):
              items = "".join([f"<item>{x.replace('&', '&amp;')}</item>" for x in lst])
              return f'<string-array name="{name}">{items}</string-array>'

          with open('app/src/main/res/values/strings.xml', 'w') as f:
              f.write(f'''<resources>
                  <string name="app_name">VortexPS3 Emu</string>
                  {xml_arr("gpu_drivers", gpus)}
                  {xml_arr("dxvk_versions", dxvks)}
                  {xml_arr("proton_layers", protons)}
                  {xml_arr("box64_presets", box64s)}
                  {xml_arr("screen_resolutions", resolutions)}
                  {xml_arr("ram_limits", rams)}
              </resources>''')
                        # 5. Clean Home UI Layout
          with open('app/src/main/res/layout/activity_main.xml', 'w') as f:
              f.write('''<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
                  android:layout_width="match_parent" android:layout_height="match_parent" android:background="#090D16">
                  
                  <LinearLayout android:id="@+id/topBar" android:layout_width="match_parent" android:layout_height="52dp" android:background="#0F1726" android:gravity="center_vertical" android:paddingStart="20dp" android:paddingEnd="20dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VORTEX-PS3 EMU" android:textColor="#00E5FF" android:textSize="18sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="10dp" android:text="| AI VIDEO HUB" android:textColor="#52647E" android:textSize="12sp"/>
                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                      <Button android:id="@+id/btnOpenSettings" android:layout_width="wrap_content" android:layout_height="38dp" android:background="#1B283E" android:paddingStart="16dp" android:paddingEnd="16dp" android:text="Settings" android:textColor="#00E5FF" android:textStyle="bold"/>
                  </LinearLayout>

                  <LinearLayout android:id="@+id/homeContent" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_below="@id/topBar" android:gravity="center" android:orientation="vertical" android:padding="24dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="GAMES &amp; RUNTIME LAUNCHER" android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="6dp" android:text="Select a Windows executable (.exe) or start Drive C desktop" android:textColor="#7A8CA5" android:textSize="13sp"/>
                      
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="32dp" android:orientation="horizontal">
                          <Button android:id="@+id/btnSelectExe" android:layout_width="220dp" android:layout_height="56dp" android:background="#00E5FF" android:text="Run .EXE Game" android:textColor="#000000" android:textSize="15sp" android:textStyle="bold"/>
                          <View android:layout_width="24dp" android:layout_height="1dp"/>
                          <Button android:id="@+id/btnLaunchDesktop" android:layout_width="220dp" android:layout_height="56dp" android:background="#152238" android:text="Start Desktop (Drive C)" android:textColor="#00FF66" android:textSize="15sp" android:textStyle="bold"/>
                      </LinearLayout>
                      
                      <TextView android:id="@+id/txtCurrentGpuBadge" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="28dp" android:background="#10192A" android:padding="10dp" android:text="Status: Core Ready" android:textColor="#00E5FF" android:textSize="12sp"/>
                  </LinearLayout>

                  <RelativeLayout android:id="@+id/inGameLayout" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#1A2234" android:visibility="gone">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                          <LinearLayout android:layout_width="match_parent" android:layout_height="34dp" android:background="#0A0E17" android:gravity="center_vertical" android:paddingStart="12dp" android:paddingEnd="12dp">
                              <TextView android:id="@+id/txtGameStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VortexPS3 | Drive C Active" android:textColor="#00FF66" android:textSize="12sp" android:textStyle="bold"/>
                              <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                              <Button android:id="@+id/btnExitGame" android:layout_width="68dp" android:layout_height="26dp" android:background="#CCFF3366" android:text="EXIT" android:textColor="#FFFFFF" android:textSize="10sp" android:textStyle="bold"/>
                          </LinearLayout>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal" android:padding="16dp">
                              <LinearLayout android:layout_width="220dp" android:layout_height="match_parent" android:background="#111B2C" android:orientation="vertical" android:padding="12dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Computer Drives" android:textColor="#00E5FF" android:textSize="14sp" android:textStyle="bold"/>
                                  <View android:layout_width="match_parent" android:layout_height="1dp" android:layout_marginTop="8dp" android:layout_marginBottom="8dp" android:background="#1F2E47"/>
                                  <TextView android:layout_width="match_parent" android:layout_height="36dp" android:gravity="center_vertical" android:text="Local Disk (C:)" android:textColor="#FFFFFF" android:textSize="13sp"/>
                                  <TextView android:layout_width="match_parent" android:layout_height="36dp" android:gravity="center_vertical" android:text="Program Files" android:textColor="#A0B0C0" android:textSize="12sp"/>
                                  <TextView android:layout_width="match_parent" android:layout_height="36dp" android:gravity="center_vertical" android:text="windows/system32" android:textColor="#A0B0C0" android:textSize="12sp"/>
                              </LinearLayout>
                              <ListView android:id="@+id/driveFileList" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_marginStart="14dp" android:background="#162238" android:padding="8dp"/>
                          </LinearLayout>
                      </LinearLayout>
                      <RelativeLayout android:layout_width="match_parent" android:layout_height="match_parent">
                          <LinearLayout android:layout_width="130dp" android:layout_height="130dp" android:layout_alignParentStart="true" android:layout_alignParentBottom="true" android:layout_marginStart="20dp" android:layout_marginBottom="20dp" android:gravity="center" android:orientation="vertical">
                              <Button android:id="@+id/btnPadUp" android:layout_width="40dp" android:layout_height="40dp" android:background="#44FFFFFF" android:text="▲" android:textColor="#FFFFFF"/>
                              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal">
                                  <Button android:id="@+id/btnPadLeft" android:layout_width="40dp" android:layout_height="40dp" android:background="#44FFFFFF" android:text="◀" android:textColor="#FFFFFF"/>
                                  <View android:layout_width="32dp" android:layout_height="40dp"/>
                                  <Button android:id="@+id/btnPadRight" android:layout_width="40dp" android:layout_height="40dp" android:background="#44FFFFFF" android:text="▶" android:textColor="#FFFFFF"/>
                              </LinearLayout>
                              <Button android:id="@+id/btnPadDown" android:layout_width="40dp" android:layout_height="40dp" android:background="#44FFFFFF" android:text="▼" android:textColor="#FFFFFF"/>
                          </LinearLayout>
                          <RelativeLayout android:layout_width="140dp" android:layout_height="140dp" android:layout_alignParentEnd="true" android:layout_alignParentBottom="true" android:layout_marginEnd="20dp" android:layout_marginBottom="20dp">
                              <Button android:id="@+id/btnKeyY" android:layout_width="42dp" android:layout_height="42dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="#5500E5FF" android:text="Y" android:textColor="#00E5FF" android:textStyle="bold"/>
                              <Button android:id="@+id/btnKeyX" android:layout_width="42dp" android:layout_height="42dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="#5500E5FF" android:text="X" android:textColor="#00E5FF" android:textStyle="bold"/>
                              <Button android:id="@+id/btnKeyB" android:layout_width="42dp" android:layout_height="42dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="#55FF3366" android:text="B" android:textColor="#FF3366" android:textStyle="bold"/>
                              <Button android:id="@+id/btnKeyA" android:layout_width="42dp" android:layout_height="42dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="#5500FF66" android:text="A" android:textColor="#00FF66" android:textStyle="bold"/>
                          </RelativeLayout>
                      </RelativeLayout>
                  </RelativeLayout>
              </RelativeLayout>''')

          # Separate Dialog Settings Layout
          with open('app/src/main/res/layout/dialog_settings.xml', 'w') as f:
              f.write('''<ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
                  android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#0D1322" android:padding="20dp">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="GLOBAL EMULATOR SETTINGS" android:textColor="#00E5FF" android:textSize="16sp" android:textStyle="bold"/>
                      
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="16dp" android:text="GPU Driver (All Phones):" android:textColor="#FFFFFF" android:textStyle="bold"/>
                      <Spinner android:id="@+id/dlgGpu" android:layout_width="match_parent" android:layout_height="44dp" android:background="#162238" android:entries="@array/gpu_drivers"/>

                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="12dp" android:text="DirectX / DXVK Engine:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                      <Spinner android:id="@+id/dlgDxvk" android:layout_width="match_parent" android:layout_height="44dp" android:background="#162238" android:entries="@array/dxvk_versions"/>

                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="12dp" android:text="Proton / Wine Runtime:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                      <Spinner android:id="@+id/dlgProton" android:layout_width="match_parent" android:layout_height="44dp" android:background="#162238" android:entries="@array/proton_layers"/>

                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="12dp" android:text="CPU Translator (Box64/86):" android:textColor="#FFFFFF" android:textStyle="bold"/>
                      <Spinner android:id="@+id/dlgBox64" android:layout_width="match_parent" android:layout_height="44dp" android:background="#162238" android:entries="@array/box64_presets"/>

                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="12dp" android:text="Display Resolution:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                      <Spinner android:id="@+id/dlgResolution" android:layout_width="match_parent" android:layout_height="44dp" android:background="#162238" android:entries="@array/screen_resolutions"/>

                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="12dp" android:text="RAM Allocation:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                      <Spinner android:id="@+id/dlgRam" android:layout_width="match_parent" android:layout_height="44dp" android:background="#162238" android:entries="@array/ram_limits"/>
                  </LinearLayout>
              </ScrollView>''')
                        # 6. MainActivity.java
          with open('app/src/main/java/com/vortexps3/emu/MainActivity.java', 'w') as f:
              f.write('''package com.vortexps3.emu;
              import android.app.Activity;
              import android.app.AlertDialog;
              import android.content.Intent;
              import android.net.Uri;
              import android.os.Bundle;
              import android.view.LayoutInflater;
              import android.view.View;
              import android.widget.*;
              import java.io.File;
              import java.io.FileOutputStream;
              import java.io.InputStream;
              import java.util.ArrayList;

              public class MainActivity extends Activity {
                  private static final int PICK_EXE_FILE = 909;
                  private View homeContent, topBar;
                  private RelativeLayout inGameLayout;
                  private TextView txtGameStatus, txtCurrentGpuBadge;
                  private ListView driveFileList;
                  private int selGpu = 0;
                  private int selDxvk = 0;

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      setContentView(R.layout.activity_main);
                      topBar = findViewById(R.id.topBar);
                      homeContent = findViewById(R.id.homeContent);
                      inGameLayout = findViewById(R.id.inGameLayout);
                      txtGameStatus = findViewById(R.id.txtGameStatus);
                      txtCurrentGpuBadge = findViewById(R.id.txtCurrentGpuBadge);
                      driveFileList = findViewById(R.id.driveFileList);

                      extractAssetsToDriveC();
                      setupControllerButtons();

                      findViewById(R.id.btnOpenSettings).setOnClickListener(v -> showSettingsDialog());

                      findViewById(R.id.btnLaunchDesktop).setOnClickListener(v -> openWindowsDesktop());

                      findViewById(R.id.btnSelectExe).setOnClickListener(v -> {
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.setType("*/*");
                          startActivityForResult(Intent.createChooser(intent, "Select Windows EXE Game"), PICK_EXE_FILE);
                      });

                      findViewById(R.id.btnExitGame).setOnClickListener(v -> {
                          inGameLayout.setVisibility(View.GONE);
                          topBar.setVisibility(View.VISIBLE);
                          homeContent.setVisibility(View.VISIBLE);
                          Toast.makeText(this, "Session Closed", Toast.LENGTH_SHORT).show();
                      });
                  }

                  private void showSettingsDialog() {
                      AlertDialog.Builder builder = new AlertDialog.Builder(this);
                      View view = LayoutInflater.from(this).inflate(R.layout.dialog_settings, null);
                      Spinner dlgGpu = view.findViewById(R.id.dlgGpu);
                      Spinner dlgDxvk = view.findViewById(R.id.dlgDxvk);
                      dlgGpu.setSelection(selGpu);
                      dlgDxvk.setSelection(selDxvk);

                      builder.setView(view);
                      builder.setPositiveButton("Save Settings", (dialog, which) -> {
                          selGpu = dlgGpu.getSelectedItemPosition();
                          selDxvk = dlgDxvk.getSelectedItemPosition();
                          String gName = dlgGpu.getSelectedItem().toString();
                          txtCurrentGpuBadge.setText("Active GPU: " + gName);
                          Toast.makeText(this, "Configuration Saved!", Toast.LENGTH_SHORT).show();
                      });
                      builder.setNegativeButton("Cancel", null);
                      builder.show();
                  }

                  private void extractAssetsToDriveC() {
                      new Thread(() -> {
                          try {
                              File sys32 = new File(getExternalFilesDir(null), "VortexDrive/drive_c/windows/system32");
                              if (!sys32.exists()) sys32.mkdirs();
                              File progFiles = new File(getExternalFilesDir(null), "VortexDrive/drive_c/Program Files");
                              if (!progFiles.exists()) progFiles.mkdirs();
                              String[] files = getAssets().list("rootfs/drive_c/windows/system32");
                              if (files != null) {
                                  for (String fn : files) {
                                      File target = new File(sys32, fn);
                                      if (!target.exists()) {
                                          InputStream in = getAssets().open("rootfs/drive_c/windows/system32/" + fn);
                                          FileOutputStream out = new FileOutputStream(target);
                                          byte[] buf = new byte[8192];
                                          int r;
                                          while ((r = in.read(buf)) != -1) out.write(buf, 0, r);
                                          in.close();
                                          out.close();
                                      }
                                  }
                              }
                          } catch (Exception ignored) {}
                      }).start();
                  }

                  private void openWindowsDesktop() {
                      topBar.setVisibility(View.GONE);
                      homeContent.setVisibility(View.GONE);
                      inGameLayout.setVisibility(View.VISIBLE);
                      txtGameStatus.setText("Desktop Mode | Drive C Active");

                      File sys32 = new File(getExternalFilesDir(null), "VortexDrive/drive_c/windows/system32");
                      ArrayList<String> list = new ArrayList<>();
                      list.add("explorer.exe (Wine Desktop)");
                      list.add("taskmgr.exe (Task Manager)");
                      list.add("regedit.exe (Registry Editor)");
                      if (sys32.exists() && sys32.listFiles() != null) {
                          for (File f : sys32.listFiles()) list.add("DLL: " + f.getName());
                      }
                      ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_list_item_1, list);
                      driveFileList.setAdapter(adapter);
                      driveFileList.setOnItemClickListener((p, v, pos, id) -> Toast.makeText(this, "Opening: " + list.get(pos), Toast.LENGTH_SHORT).show());
                  }

                  private void setupControllerButtons() {
                      findViewById(R.id.btnKeyA).setOnClickListener(v -> Toast.makeText(this, "[INPUT] Enter / Click", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnKeyB).setOnClickListener(v -> Toast.makeText(this, "[INPUT] Escape / Back", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnKeyX).setOnClickListener(v -> Toast.makeText(this, "[INPUT] Space", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnKeyY).setOnClickListener(v -> Toast.makeText(this, "[INPUT] Shift", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnPadUp).setOnClickListener(v -> Toast.makeText(this, "[PAD] Up", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnPadDown).setOnClickListener(v -> Toast.makeText(this, "[PAD] Down", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnPadLeft).setOnClickListener(v -> Toast.makeText(this, "[PAD] Left", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnPadRight).setOnClickListener(v -> Toast.makeText(this, "[PAD] Right", Toast.LENGTH_SHORT).show());
                  }

                  @Override
                  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                      super.onActivityResult(requestCode, resultCode, data);
                      if (requestCode == PICK_EXE_FILE && resultCode == RESULT_OK && data != null) {
                          openWindowsDesktop();
                          Uri uri = data.getData();
                          String fn = (uri != null) ? uri.getLastPathSegment() : "Game.exe";
                          txtGameStatus.setText("Running: " + fn);
                      }
                  }
              }''')

          # 7. Gradle Configuration
          with open('build.gradle', 'w') as f:
              f.write("buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }\nallprojects { repositories { google(); mavenCentral() } }")

          with open('app/build.gradle', 'w') as f:
              f.write('''plugins { id 'com.android.application' }

              android {
                  namespace 'com.vortexps3.emu'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.vortexps3.emu"
                      minSdk 24
                      targetSdk 34
                      versionCode 210
                      versionName "5.1"
                  }
              }''')

          with open('settings.gradle', 'w') as f:
              f.write("include ':app'\n")

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
