name: Step 1 - Base Engine Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Sign Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner zip unzip wget curl

      - name: Download & Resign Original Engine
        run: |
          # 1. Base GameHub Lite APK Download
          LATEST_URL=$(curl -sL https://api.github.com/repos/Producdevity/gamehub-lite/releases/latest | grep "browser_download_url.*apk" | head -n 1 | cut -d '"' -f 4)
          wget -q -O base.apk "$LATEST_URL"

          # 2. Extract APK
          mkdir -p raw_apk
          unzip -q base.apk -d raw_apk

          # 3. Remove old signature only
          rm -rf raw_apk/META-INF

          # 4. Pack back properly
          cd raw_apk
          zip -q -r -0 ../clean_unaligned.apk resources.arsc AndroidManifest.xml lib/
          zip -q -r -9 ../clean_unaligned.apk . -x "resources.arsc" -x "AndroidManifest.xml" -x "lib/*"
          cd ..

          # 5. Page Align (4-byte)
          zipalign -v -p 4 clean_unaligned.apk clean_aligned.apk

          # 6. Generate Clean Keystore
          keytool -genkey -v -keystore test.keystore -storepass android123 -alias vortexkey -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VortexPS3, OU=Mobile, O=Emulator, L=City, S=State, C=IN"

          # 7. Sign APK
          apksigner sign --ks test.keystore --ks-pass pass:android123 --key-pass pass:android123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out VortexPS3-Base-Test.apk clean_aligned.apk

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-Base-Test
          path: VortexPS3-Base-Test.apk
          
