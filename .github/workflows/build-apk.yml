name: Build VortexPS3 Full Emulator

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner imagemagick zip unzip

      - name: Rebrand & Perfectly Sign APK
        run: |
          # 1. Base GameHub Lite APK Download (Full Engine)
          LATEST_URL=$(curl -sL https://api.github.com/repos/Producdevity/gamehub-lite/releases/latest | grep "browser_download_url.*apk" | head -n 1 | cut -d '"' -f 4)
          wget -q -O base.apk "$LATEST_URL"

          # 2. APK Unpack
          mkdir -p apk_dir
          unzip -q base.apk -d apk_dir

          # 3. Purana Signature (META-INF) Puri Tarah Delete Karein (Crucial for Install Fix)
          rm -rf apk_dir/META-INF

          # 4. Create Clean Welcome Screen Image
          convert -size 1080x1920 xc:black -gravity center \
            -fill white -pointsize 80 -annotate 0 "WELCOME" \
            -fill cyan -pointsize 45 -annotate +0+140 "VORTEXPS3 EMU" \
            welcome_splash.png

          # 5. Startup Logo / Splash Replace
          find apk_dir/res -type f \( -iname "*splash*" -o -iname "*logo*" -o -iname "*launch*" \) \( -name "*.png" -o -name "*.webp" \) | while read -r img; do
            W=$(identify -format "%w" "$img" 2>/dev/null || echo 1080)
            H=$(identify -format "%h" "$img" 2>/dev/null || echo 1920)
            convert welcome_splash.png -resize "${W}x${H}!" "$img" 2>/dev/null || true
          done

          # 6. Rebuild APK without Compression on Resources
          cd apk_dir
          zip -q -r -0 ../rebuilt_unaligned.apk ./*
          cd ..

          # 7. 4-Byte ZipAlign
          zipalign -v -p 4 rebuilt_unaligned.apk aligned.apk

          # 8. Standard Keystore Generation
          keytool -genkey -v -keystore release.keystore -storepass android -alias androidkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VortexPS3, OU=Mobile, O=Emulator, L=City, S=State, C=IN"

          # 9. Sign with v1, v2 and v3 (Guarantees Installation on Android 8 to 15)
          apksigner sign --ks release.keystore --ks-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out VortexPS3-Installable.apk aligned.apk

          # 10. Verify Signature
          apksigner verify --verbose VortexPS3-Installable.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-Working-App
          path: VortexPS3-Installable.apk
          
