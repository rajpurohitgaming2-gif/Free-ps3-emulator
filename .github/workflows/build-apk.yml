name: Build VortexPS3 GameHub Engine

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl wget

      - name: Clone Official GameHub-Lite Engine & Patch
        run: |
          # 1. Official GameHub Lite source repo clone
          git clone --depth=1 https://github.com/Producdevity/gamehub-lite.git ghl_source
          cd ghl_source

          # 2. Patch file executable permission
          chmod +x patch.sh tools/* 2>/dev/null || true

          # 3. Rename app to VortexPS3 Emu safely in strings
          find patches -type f -name "*.patch" -exec sed -i 's/GameHub Lite/VortexPS3 Emu/g' {} + 2>/dev/null || true
          find patches -type f -name "*.xml" -exec sed -i 's/GameHub Lite/VortexPS3 Emu/g' {} + 2>/dev/null || true

          # 4. Run official clean patch build
          ./patch.sh

          # 5. Copy built APK
          cp output/*.apk ../VortexPS3-Working-Engine.apk

      - name: Upload Clean Working APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-Working-Engine
          path: VortexPS3-Working-Engine.apk
          
