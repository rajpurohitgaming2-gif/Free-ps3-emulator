          cat << 'EOF' > app/src/main/res/layout/dialog_settings.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#0D1322" android:orientation="vertical" android:padding="16dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="12dp" android:text="SETTINGS &amp; FIRMWARE" android:textColor="#00E5FF" android:textSize="16sp" android:textStyle="bold"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="GPU Driver:" android:textColor="#FFFFFF"/>
              <Spinner android:id="@+id/dlgGpu" android:layout_width="match_parent" android:layout_height="36dp" android:background="#162238" android:entries="@array/gpu_drivers"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:text="DXVK Engine:" android:textColor="#FFFFFF"/>
              <Spinner android:id="@+id/dlgDxvk" android:layout_width="match_parent" android:layout_height="36dp" android:background="#162238" android:entries="@array/dxvk_versions"/>
              <Button android:id="@+id/btnInstallPUP" android:layout_width="match_parent" android:layout_height="38dp" android:layout_marginTop="14dp" android:background="#1E385B" android:text="Install Firmware (.PUP / .BIN)" android:textColor="#00FF66" android:textSize="12sp" android:textStyle="bold"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          i
          import android.os.Bundle;
import android.os.Vibrator;
import android.view.Choreographer;
import android.view.LayoutInflater;
import android.view.MotionEvent;
import android.view.View;
import android.widget.*;
import java.text.SimpleDateFormat;
import java.util.Date;
import java.util.Locale;

public class MainActivity extends Activity {
    private static final int PICK_EXE_FILE = 909;
    private static final int PICK_PUP_FILE = 910;
    private TextView fpsCounter, txtTaskStatus, txtTaskClock;
    private Vibrator vibrator;
    private long lastFrameTimeNanos = 0;
    private int frameCount = 0;
    private Choreographer.FrameCallback frameCallback;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        fpsCounter = findViewById(R.id.fpsCounter);
        txtTaskStatus = findViewById(R.id.txtTaskStatus);
        txtTaskClock = findViewById(R.id.txtTaskClock);
        vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

        setupDesktopIcons();
        setupButtons();
        setupJoystick(R.id.joystickLeftContainer, R.id.joystickLeftKnob, "Move");
        setupJoystick(R.id.joystickRightContainer, R.id.joystickRightKnob, "Look");
        setupFpsMeter();

        findViewById(R.id.btnSettings).setOnClickListener(v -> showSettings());
        findViewById(R.id.btnRunExe).setOnClickListener(v -> {
            Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
            intent.setType("*/*");
            startActivityForResult(Intent.createChooser(intent, "Select Windows EXE Game"), PICK_EXE_FILE);
        });
    }

    private void setupDesktopIcons() {
        findViewById(R.id.iconComputer).setOnClickListener(v -> Toast.makeText(this, "Opening: My Computer", Toast.LENGTH_SHORT).show());
        findViewById(R.id.iconDriveC).setOnClickListener(v -> Toast.makeText(this, "Opening: Local Disk (C:)", Toast.LENGTH_SHORT).show());
        findViewById(R.id.iconControlPanel).setOnClickListener(v -> Toast.makeText(this, "Opening: Control Panel", Toast.LENGTH_SHORT).show());
        findViewById(R.id.btnStartMenu).setOnClickListener(v -> Toast.makeText(this, "Windows Start Menu", Toast.LENGTH_SHORT).show());
    }

    private void setupJoystick(int containerId, int knobId, String stickName) {
        RelativeLayout container = findViewById(containerId);
        View knob = findViewById(knobId);

        container.setOnTouchListener((v, event) -> {
            float width = container.getWidth();
            float height = container.getHeight();
            float centerX = width / 2;
            float centerY = height / 2;
            float maxRadius = width / 2 - knob.getWidth() / 2;

            if (event.getAction() == MotionEvent.ACTION_DOWN || event.getAction() == MotionEvent.ACTION_MOVE) {
                float dx = event.getX() - centerX;
                float dy = event.getY() - centerY;
                float distance = (float) Math.sqrt(dx * dx + dy * dy);

                if (distance > maxRadius && distance > 0) {
                    dx = (dx * maxRadius) / distance;
                    dy = (dy * maxRadius) / distance;
                }

                knob.setTranslationX(dx);
                knob.setTranslationY(dy);

                String dir = "";
                if (dy < -20) dir += "UP ";
                else if (dy > 20) dir += "DOWN ";
                if (dx > 20) dir += "RIGHT ";
                else if (dx < -20) dir += "LEFT ";

                txtTaskStatus.setText(stickName + ": " + dir);
            } else if (event.getAction() == MotionEvent.ACTION_UP || event.getAction() == MotionEvent.ACTION_CANCEL) {
                knob.animate().translationX(0).translationY(0).setDuration(100).start();
                txtTaskStatus.setText(stickName + ": Center");
            }
            return true;
        });
    }

    private void setupFpsMeter() {
        frameCallback = new Choreographer.FrameCallback() {
            @Override
            public void doFrame(long frameTimeNanos) {
                if (lastFrameTimeNanos == 0) lastFrameTimeNanos = frameTimeNanos;
                frameCount++;
                long diff = frameTimeNanos - lastFrameTimeNanos;
                if (diff >= 1000000000L) {
                    double fps = (frameCount * 1000000000.0) / diff;
                    fpsCounter.setText(String.format("FPS: %.1f", fps));
                    frameCount = 0;
                    lastFrameTimeNanos = frameTimeNanos;
                    txtTaskClock.setText(new SimpleDateFormat("hh:mm a", Locale.getDefault()).format(new Date()));
                }
                Choreographer.getInstance().postFrameCallback(this);
            }
        };
        Choreographer.getInstance().postFrameCallback(frameCallback);
    }

    private void bindTouch(int id, String name) {
        View v = findViewById(id);
        if (v != null) {
            v.setOnTouchListener((view, event) -> {
                if (event.getAction() == MotionEvent.ACTION_DOWN) {
                    if (vibrator != null) vibrator.vibrate(20);
                    txtTaskStatus.setText("Input: " + name);
                }
                return false;
            });
        }
    }

    private void setupButtons() {
        bindTouch(R.id.btnKeyA, "A");
        bindTouch(R.id.btnKeyB, "B");
        bindTouch(R.id.btnKeyX, "X");
        bindTouch(R.id.btnKeyY, "Y");
        bindTouch(R.id.btnL1, "L1");
        bindTouch(R.id.btnL2, "L2");
        bindTouch(R.id.btnL3, "L3");
        bindTouch(R.id.btnR1, "R1");
        bindTouch(R.id.btnR2, "R2");
        bindTouch(R.id.btnR3, "R3");
        bindTouch(R.id.btnPadUp, "D-Pad UP");
        bindTouch(R.id.btnPadDown, "D-Pad DOWN");
        bindTouch(R.id.btnPadLeft, "D-Pad LEFT");
        bindTouch(R.id.btnPadRight, "D-Pad RIGHT");
    }

    private void showSettings() {
        AlertDialog.Builder b = new AlertDialog.Builder(this);
        View v = LayoutInflater.from(this).inflate(R.layout.dialog_settings, null);
        v.findViewById(R.id.btnInstallPUP).setOnClickListener(view -> {
            Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
            intent.setType("*/*");
            startActivityForResult(Intent.createChooser(intent, "Select Firmware (.PUP / .BIN)"), PICK_PUP_FILE);
        });
        b.setView(v);
        b.setPositiveButton("OK", null);
        b.show();
    }

    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        if (requestCode == PICK_EXE_FILE && resultCode == RESULT_OK && data != null) {
            Uri uri = data.getData();
            String fn = (uri != null) ? uri.getLastPathSegment() : "Game.exe";
            txtTaskStatus.setText("Running: " + fn);
            Toast.makeText(this, "Game Launched: " + fn, Toast.LENGTH_SHORT).show();
        } else if (requestCode == PICK_PUP_FILE && resultCode == RESULT_OK && data != null) {
            Uri uri = data.getData();
            String fn = (uri != null) ? uri.getLastPathSegment() : "Firmware.PUP";
            txtTaskStatus.setText("Firmware Loaded: " + fn);
            Toast.makeText(this, "Firmware Installed: " + fn, Toast.LENGTH_LONG).show();
        }
    }
}
