                      </LinearLayout>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="44dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="160dp" android:layout_height="wrap_content" android:text="DXVK Engine:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgDxvk" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/dxvk_versions"/>
                      </LinearLayout>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="44dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="160dp" android:layout_height="wrap_content" android:text="Proton / Wine:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgProton" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/proton_layers"/>
                      </LinearLayout>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="44dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="160dp" android:layout_height="wrap_content" android:text="CPU Translator:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgBox64" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/box64_presets"/>
                      </LinearLayout>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="44dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="160dp" android:layout_height="wrap_content" android:text="Resolution:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgResolution" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/screen_resolutions"/>
                      </LinearLayout>

                      <View android:layout_width="match_parent" android:layout_height="1dp" android:layout_marginTop="14dp" android:layout_marginBottom="14dp" android:background="#1B283E"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SYSTEM FIRMWARE AND PACKAGES" android:textColor="#00FF66" android:textSize="13sp" android:textStyle="bold"/>
                      
                      <Button android:id="@+id/btnInstallPUP" android:layout_width="match_parent" android:layout_height="42dp" android:layout_marginTop="8dp" android:background="#1E385B" android:text="Install Firmware (.PUP / .BIN)" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/txtFirmwareStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marg 
                                # 6. MainActivity.java
          with open('app/src/main/java/com/vortexps3/emu/MainActivity.java', 'w') as f:
              f.write('''package com.vortexps3.emu;
              import android.app.Activity;
              import android.app.AlertDialog;
              import android.content.Context;
              import android.content.Intent;
              import android.net.Uri;
              import android.os.Bundle;
              import android.os.Vibrator;
              import android.view.Choreographer;
              import android.view.LayoutInflater;
              import android.view.MotionEvent;
              import android.view.View;
              import android.widget.*;
              import java.io.File;
              import java.io.FileOutputStream;
              import java.io.InputStream;
              import java.text.SimpleDateFormat;
              import java.util.Date;
              import java.util.Locale;

              public class MainActivity extends Activity {
                  private static final int PICK_EXE_FILE = 909;
                  private static final int PICK_PUP_FILE = 910;
                  private View homeContent, topBar;
                  private RelativeLayout inGameLayout;
                  private TextView txtCurrentGpuBadge, fpsCounter, txtTaskbarStatus, txtTaskbarClock, txtFirmwareStatusRef;
                  private Vibrator vibrator;
                  private int selGpu = 0;
                  private int selDxvk = 0;
                  private boolean showFps = true;
                  
                  private long lastFrameTimeNanos = 0;
                  private int frameCount = 0;
                  private Choreographer.FrameCallback frameCallback;

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      setContentView(R.layout.activity_main);
                      topBar = findViewById(R.id.topBar);
                      homeContent = findViewById(R.id.homeContent);
                      inGameLayout = findViewById(R.id.inGameLayout);
                      txtCurrentGpuBadge = findViewById(R.id.txtCurrentGpuBadge);
                      fpsCounter = findViewById(R.id.fpsCounter);
                      txtTaskbarStatus = findViewById(R.id.txtTaskbarStatus);
                      txtTaskbarClock = findViewById(R.id.txtTaskbarClock);
                      vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                      extractAssetsToDriveC();
                      setupControllerButtons();
                      setupDynamicJoystick(R.id.joystickLeftContainer, R.id.joystickLeftKnob, "Move");
                      setupDynamicJoystick(R.id.joystickRightContainer, R.id.joystickRightKnob, "Look");
                      setupFpsMeter();
                      setupDesktopIcons();

                      findViewById(R.id.btnOpenSettings).setOnClickListener(v -> showSettingsDialog());
                      findViewById(R.id.btnLaunchDesktop).setOnClickListener(v -> openWindowsDesktop("Desktop Core"));

                      findViewById(R.id.btnSelectExe).setOnClickListener(v -> {
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.setType("*/*");
                          startActivityForResult(Intent.createChooser(intent, "Select Windows EXE Game"), PICK_EXE_FILE);
                      });

                      findViewById(R.id.btnExitGame).setOnClickListener(v -> {
                          inGameLayout.setVisibility(View.GONE);
                          topBar.setVisibility(View.VISIBLE);
                          homeContent.setVisibility(View.VISIBLE);
                          Choreographer.getInstance().removeFrameCallback(frameCallback);
                          Toast.makeText(this, "Session Closed", Toast.LENGTH_SHORT).show();
                      });
                  }

                  private void setupDesktopIcons() {
                      findViewById(R.id.iconComputer).setOnClickListener(v -> Toast.makeText(this, "Opening My Computer", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.iconDriveC).setOnClickListener(v -> Toast.makeText(this, "Opening Drive C System32", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.iconControlPanel).setOnClickListener(v -> Toast.makeText(this, "Opening Control Panel", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnStartMenu).setOnClickListener(v -> Toast.makeText(this, "Start Menu", Toast.LENGTH_SHORT).show());
                  }

                  private void setupDynamicJoystick(int containerId, int knobId, String stickName) {
                      RelativeLayout container = findViewById(containerId);
                      View knob = findViewById(knobId);

                      container.setOnTouchListener((v, event) -> {
                          float width = container.getWidth();
                          float height = container.getHeight();
                          float centerX = width / 2.0f;
                          float centerY = height / 2.0f;
                          float maxRadius = width / 2.0f - knob.getWidth() / 2.0f;

                          if (event.getAction() == MotionEvent.ACTION_DOWN || event.getAction() == MotionEvent.ACTION_MOVE) {
                              float dx = event.getX() - centerX;
                              float dy = event.getY() - centerY;
                              double distance = Math.hypot(dx, dy);

                              if (distance > maxRadius) {
                                  dx = (float) (dx * maxRadius / distance);
                                  dy = (float) (dy * maxRadius / distance);
                              }

                              knob.setTranslationX(dx);
                              knob.setTranslationY(dy);

                              float normX = dx / maxRadius;
                              float normY = -dy / maxRadius;

                              String dir = "";
                              if (normY > 0.4f) dir += "UP ";
                              else if (normY < -0.4f) dir += "DOWN ";
                              if (normX > 0.4f) dir += "RIGHT ";
                              else if (normX < -0.4f) dir += "LEFT ";

                              txtTaskbarStatus.setText(stickName + ": " + dir + String.format("(X:%.2f, Y:%.2f)", normX, normY));
                          } else if (event.getAction() == MotionEvent.ACTION_UP || event.getAction() == MotionEvent.ACTION_CANCEL) {
                              knob.animate().translationX(0).translationY(0).setDuration(120).start();
                              txtTaskbarStatus.setText(stickName + ": Center");
                          }
                          return true;
                      });
                  }

                  private void setupFpsMeter() {
                      frameCallback = new Choreographer.FrameCallback() {
                          @Override
                          public void doFrame(long frameTimeNanos) {
                              if (lastFrameTimeNanos == 0) lastFrameTimeNanos = frameTimeNanos;
                              frameCount++;
                              long diff = frameTimeNanos - lastFrameTimeNanos;
                              if (diff >= 1_000_000_000L) {
                                  double fps = (frameCount * 1_000_000_000.0) / diff;
                                  if (showFps) {
                                      fpsCounter.setText(String.format("FPS: %.1f", fps));
                                      fpsCounter.setVisibility(View.VISIBLE);
                                  } else {
                                      fpsCounter.setVisibility(View.GONE);
                                  }
                                  frameCount = 0;
                                  lastFrameTimeNanos = frameTimeNanos;
                                  txtTaskbarClock.setText(new SimpleDateFormat("hh:mm a", Locale.getDefault()).format(new Date()));
                              }
                              if (inGameLayout.getVisibility() == View.VISIBLE) {
                                  Choreographer.getInstance().postFrameCallback(this);
                              }
                          }
                      };
                  }

                  private void showSettingsDialog() {
                      AlertDialog.Builder builder = new AlertDialog.Builder(this);
                      View view = LayoutInflater.from(this).inflate(R.layout.dialog_settings, null);
                      Spinner dlgGpu = view.findViewById(R.id.dlgGpu);
                      Spinner dlgDxvk = view.findViewById(R.id.dlgDxvk);
                      txtFirmwareStatusRef = view.findViewById(R.id.txtFirmwareStatus);
                      dlgGpu.setSelection(selGpu);
                      dlgDxvk.setSelection(selDxvk);

                      view.findViewById(R.id.btnInstallPUP).setOnClickListener(v -> {
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.setType("*/*");
                          startActivityForResult(Intent.createChooser(intent, "Select Firmware File"), PICK_PUP_FILE);
                      });

                      builder.setView(view);
                      builder.setPositiveButton("Save Settings", (dialog, which) -> {
                          selGpu = dlgGpu.getSelectedItemPosition();
                          selDxvk = dlgDxvk.getSelectedItemPosition();
                          txtCurrentGpuBadge.setText("Active GPU: " + dlgGpu.getSelectedItem().toString());
                          Toast.makeText(this, "Configuration Saved!", Toast.LENGTH_SHORT).show();
                      });
                      builder.setNegativeButton("Cancel", null);
                      builder.show();
                  }

                  private void extractAssetsToDriveC() {
                      new Thread(() -> {
                          try {
                              File sys32 = new File(getExternalFilesDir(null), "VortexDrive/drive_c/windows/system32");
                              if (!sys32.exists()) sys32.mkdirs();
                              File progFiles = new File(getExternalFilesDir(null), "VortexDrive/drive_c/Program Files");
                              if (!progFiles.exists()) progFiles.mkdirs();
                              String[] files = getAssets().list("rootfs/drive_c/windows/system32");
                              if (files != null) {
                                  for (String fn : files) {
                                      File target = new File(sys32, fn);
                                      if (!target.exists()) {
                                          InputStream in = getAssets().open("rootfs/drive_c/windows/system32/" + fn);
                                          FileOutputStream out = new FileOutputStream(target);
                                          byte[] buf = new byte[8192];
                                          int r;
                                          while ((r = in.read(buf)) != -1) out.write(buf, 0, r);
                                          in.close();
                                          out.close();
                                      }
                                  }
                              }
                          } catch (Exception ignored) {}
                      }).start();
                  }

                  private void openWindowsDesktop(String title) {
                      topBar.setVisibility(View.GONE);
                      homeContent.setVisibility(View.GONE);
                      inGameLayout.setVisibility(View.VISIBLE);
                      txtTaskbarStatus.setText("Running: " + title);
                      lastFrameTimeNanos = 0;
                      frameCount = 0;
                      Choreographer.getInstance().postFrameCallback(frameCallback);
                  }

                  private void bindTouch(int id, String name) {
                      View v = findViewById(id);
                      if (v != null) {
                          v.setOnTouchListener((view, event) -> {
                              if (event.getAction() == MotionEvent.ACTION_DOWN) {
                                  if (vibrator != null) vibrator.vibrate(25);
                                  txtTaskbarStatus.setText("Pressed: " + name);
                              } else if (event.getAction() == MotionEvent.ACTION_UP) {
                                  txtTaskbarStatus.setText("Released: " + name);
                              }
                              return false;
                          });
                      }
                  }

                  private void setupControllerButtons() {
                      bindTouch(R.id.btnKeyA, "A (Enter)");
                      bindTouch(R.id.btnKeyB, "B (Escape)");
                      bindTouch(R.id.btnKeyX, "X (Space)");
                      bindTouch(R.id.btnKeyY, "Y (Shift)");
                      bindTouch(R.id.btnL1, "L1");
                      bindTouch(R.id.btnL2, "L2");
                      bindTouch(R.id.btnL3, "L3");
                      bindTouch(R.id.btnR1, "R1");
                      bindTouch(R.id.btnR2, "R2");
                      bindTouch(R.id.btnR3, "R3");
                      bindTouch(R.id.btnPadUp, "D-Pad UP");
                      bindTouch(R.id.btnPadDown, "D-Pad DOWN");
                      bindTouch(R.id.btnPadLeft, "D-Pad LEFT");
                      bindTouch(R.id.btnPadRight, "D-Pad RIGHT");
                  }

                  @Override
                  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                      super.onActivityResult(requestCode, resultCode, data);
                      if (requestCode == PICK_EXE_FILE && resultCode == RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          String fn = (uri != null) ? uri.getLastPathSegment() : "Game.exe";
                          openWindowsDesktop(fn);
                      } else if (requestCode == PICK_PUP_FILE && resultCode == RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          String fn = (uri != null) ? uri.getLastPathSegment() : "Firmware.PUP";
                          if (txtFirmwareStatusRef != null) {
                              txtFirmwareStatusRef.setText("Firmware Installed: " + fn);
                          }
                          txtCurrentGpuBadge.setText("Firmware: " + fn + " Loaded");
                          Toast.makeText(this, "Firmware Installed: " + fn, Toast.LENGTH_LONG).show();
                      }
                  }
              }''')

