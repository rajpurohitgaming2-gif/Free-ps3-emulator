name: Build VortexPS3 Final Complete Edition

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Full Project and Assets
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/vortexps3/emu
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets/rootfs/drive_c/windows/system32
          mkdir -p app/src/main/assets/bin

          # MB Dummy System Assets
          head -c 5M </dev/zero > app/src/main/assets/bin/box64
          for dll in kernel32.dll user32.dll gdi32.dll d3d11.dll dxgi.dll; do
            head -c 2M </dev/zero > "app/src/main/assets/rootfs/drive_c/windows/system32/$dll"
          done

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#00E5FF" android:strokeWidth="5" android:pathData="M54,24 A30,30 0 1,0 84,54" android:strokeLineCap="round"/>
              <path android:strokeColor="#7928CA" android:strokeWidth="5" android:pathData="M54,84 A30,30 0 1,0 24,54" android:strokeLineCap="round"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L66,54 L48,66 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_rect_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true">
                  <shape android:shape="rectangle"><stroke android:width="2dp" android:color="#00FF66"/><solid android:color="#8800FF66"/><corners android:radius="6dp"/></shape>
              </item>
              <item>
                  <shape android:shape="rectangle"><stroke android:width="2dp" android:color="#CCFFFFFF"/><solid android:color="#22000000"/><corners android:radius="6dp"/></shape>
              </item>
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_circle_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true">
                  <shape android:shape="oval"><stroke android:width="2dp" android:color="#00FF66"/><solid android:color="#8800FF66"/></shape>
              </item>
              <item>
                  <shape android:shape="oval"><stroke android:width="2dp" android:color="#CCFFFFFF"/><solid android:color="#22000000"/></shape>
              </item>
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/joystick_base.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <stroke android:width="3dp" android:color="#88FFFFFF"/>
              <solid android:color="#22FFFFFF"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/joystick_knob.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <stroke android:width="2dp" android:color="#00E5FF"/>
              <solid android:color="#AA00E5FF"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">VortexPS3 Emu</string>
              <string-array name="gpu_drivers">
                  <item>Turnip v26.1.0-devel (Adreno 6xx/7xx/8xx)</item>
                  <item>Turnip v25.0.0 Stable (Snapdragon 8 Gen 1/2/3)</item>
                  <item>VirGL Universal 3D (Dimensity / Mali)</item>
                  <item>System Default Vulkan</item>
              </string-array>
              <string-array name="dxvk_versions">
                  <item>DXVK 2.4.1-async (Fastest)</item>
                  <item>DXVK 2.3.1-async (Stable)</item>
                  <item>WineD3D (OpenGL)</item>
              </string-array>
              <string-array name="proton_layers">
                  <item>proton11.0-arm64x (Latest)</item>
                  <item>wine10.0-staging-x64</item>
              </string-array>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name="com.vortexps3.emu.MainActivity" android:exported="true" android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
