name: Build VortexPS3 Pro Winlator Edition

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Core Engine and Layouts via Python
        shell: python
        run: |
          import os, shutil

          for p in ['app', 'build.gradle', 'settings.gradle']:
              if os.path.exists(p):
                  if os.path.isdir(p): shutil.rmtree(p)
                  else: os.remove(p)

          os.makedirs('app/src/main/java/com/vortexps3/emu', exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)
          os.makedirs('app/src/main/res/values', exist_ok=True)
          os.makedirs('app/src/main/res/drawable', exist_ok=True)
          os.makedirs('app/src/main/assets/rootfs/drive_c/windows/system32', exist_ok=True)
          os.makedirs('app/src/main/assets/rootfs/drive_c/Program Files', exist_ok=True)

          for dll in ['kernel32.dll', 'user32.dll', 'gdi32.dll', 'd3d11.dll', 'dxgi.dll']:
              with open(f'app/src/main/assets/rootfs/drive_c/windows/system32/{dll}', 'wb') as f:
                  f.write(b'MZ' + b'\x00' * 512 * 1024)

          with open('app/src/main/res/drawable/ic_launcher.xml', 'w') as f:
              f.write('''<vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
                  <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
                  <path android:strokeColor="#00E5FF" android:strokeWidth="5" android:pathData="M54,24 A30,30 0 1,0 84,54" android:strokeLineCap="round"/>
                  <path android:strokeColor="#7928CA" android:strokeWidth="5" android:pathData="M54,84 A30,30 0 1,0 24,54" android:strokeLineCap="round"/>
                  <path android:fillColor="#FFFFFF" android:pathData="M48,42 L66,54 L48,66 Z"/>
              </vector>''')

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write('''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
                  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
                  <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
                  <application android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <activity android:name="com.vortexps3.emu.MainActivity" android:exported="true" android:configChanges="orientation|screenSize" android:screenOrientation="sensorLandscape">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN"/>
                              <category android:name="android.intent.category.LAUNCHER"/>
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>''')

          gpus = [
              "Turnip v26.1.0-devel", "Turnip v25.0.0 Stable",
              "Turnip v24.3.0 Aggressive", "Turnip v24.1.0 Classic",
              "Qualcomm Proprietary v0615.0", "VirGL Universal 3D",
              "Panfrost Mesa Driver", "Mali Immortalis G715/G720",
              "Zink OpenGL via Vulkan", "LLVMpipe Software"
          ]
          dxvks = [
              "DXVK 2.4.1-async", "DXVK 2.3.1-async",
              "DXVK 2.2-gpl", "DXVK 1.10.3 Legacy",
              "VKD3D-Proton 2.13", "WineD3D OpenGL"
          ]
          protons = [
              "proton11.0-arm64x", "proton10.0-arm64x-2",
              "proton-ge-custom-8.26", "wine10.0-staging-x64",
              "wine9.16-esync", "wine8.18-stable"
          ]
          box64s = [
              "Box64 v0.3.4 Bleeding Edge", "Box64 v0.3.2 Aggressive",
              "Box64 v0.3.0 Balanced", "Box86 v0.3.2 Classic 32bit",
              "FEX-Emu JIT Fast", "Hangover WOW64"
          ]
          resolutions = [
              "1280 x 720 (Standard HD)", "960 x 540 (Fast qHD)",
              "854 x 480 (Ultra Fast)", "1600 x 900 (HD+)",
              "1920 x 1080 (Full HD)"
          ]
          rams = ["4 GB (Standard)", "6 GB (Medium)", "8 GB (High-End)", "3 GB (Balanced)", "2 GB (Low)"]
          controls = ["Winlator Full Gamepad", "Touch Trackpad Mouse", "External Gamepad Only"]
          opacities = ["60% (Recommended)", "80% (Clear)", "40% (Ghost)", "100% (Solid)"]

          def xml_arr(name, lst):
              items = "".join([f"<item>{x.replace('&', '&amp;')}</item>" for x in lst])
              return f'<string-array name="{name}">{items}</string-array>'

          with open('app/src/main/res/values/strings.xml', 'w') as f:
              f.write(f'''<resources>
                  <string name="app_name">VortexPS3 Emu</string>
                  {xml_arr("gpu_drivers", gpus)}
                  {xml_arr("dxvk_versions", dxvks)}
                  {xml_arr("proton_layers", protons)}
                  {xml_arr("box64_presets", box64s)}
                  {xml_arr("screen_resolutions", resolutions)}
                  {xml_arr("ram_limits", rams)}
                  {xml_arr("control_profiles", controls)}
                  {xml_arr("control_opacities", opacities)}
              </resources>''')
                        # 5. UI Layout with Pro Winlator On-Screen Overlay
          with open('app/src/main/res/layout/activity_main.xml', 'w') as f:
              f.write('''<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
                  android:layout_width="match_parent" android:layout_height="match_parent" android:background="#090D16">
                  
                  <LinearLayout android:id="@+id/topBar" android:layout_width="match_parent" android:layout_height="52dp" android:background="#0F1726" android:gravity="center_vertical" android:paddingStart="20dp" android:paddingEnd="20dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VORTEX-PS3 PRO" android:textColor="#00E5FF" android:textSize="18sp" android:textStyle="bold"/>
                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                      <Button android:id="@+id/btnOpenSettings" android:layout_width="wrap_content" android:layout_height="38dp" android:background="#1B283E" android:paddingStart="16dp" android:paddingEnd="16dp" android:text="⚙ Settings" android:textColor="#00E5FF" android:textStyle="bold"/>
                  </LinearLayout>

                  <LinearLayout android:id="@+id/homeContent" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_below="@id/topBar" android:gravity="center" android:orientation="vertical" android:padding="24dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="GAMES &amp; RUNTIME LAUNCHER" android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold"/>
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="28dp" android:orientation="horizontal">
                          <Button android:id="@+id/btnSelectExe" android:layout_width="220dp" android:layout_height="54dp" android:background="#00E5FF" android:text="▶ Run .EXE Game" android:textColor="#000000" android:textSize="15sp" android:textStyle="bold"/>
                          <View android:layout_width="20dp" android:layout_height="1dp"/>
                          <Button android:id="@+id/btnLaunchDesktop" android:layout_width="220dp" android:layout_height="54dp" android:background="#152238" android:text="🖥 Start Desktop (C:)" android:textColor="#00FF66" android:textSize="15sp" android:textStyle="bold"/>
                      </LinearLayout>
                      <TextView android:id="@+id/txtCurrentGpuBadge" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="24dp" android:background="#10192A" android:padding="10dp" android:text="Engine: Turnip v26 + DXVK 2.4.1 + Winlator Pad" android:textColor="#00E5FF" android:textSize="12sp"/>
                  </LinearLayout>

                  <RelativeLayout android:id="@+id/inGameLayout" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#05080E" android:visibility="gone">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="32dp" android:background="#CC0A0E17" android:gravity="center_vertical" android:paddingStart="12dp" android:paddingEnd="12dp">
                          <TextView android:id="@+id/txtGameStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VortexPS3 Runtime | 60 FPS" android:textColor="#00FF66" android:textSize="12sp" android:textStyle="bold"/>
                          <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                          <Button android:id="@+id/btnExitGame" android:layout_width="64dp" android:layout_height="24dp" android:background="#CCFF3366" android:text="EXIT" android:textColor="#FFFFFF" android:textSize="10sp" android:textStyle="bold"/>
                      </LinearLayout>

                      <RelativeLayout android:id="@+id/overlayWinlator" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_marginTop="32dp">
                          <!-- Top Triggers (L1, L2, R1, R2) -->
                          <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentTop="true" android:layout_alignParentStart="true" android:layout_marginStart="24dp" android:orientation="horizontal">
                              <Button android:id="@+id/btnL2" android:layout_width="54dp" android:layout_height="36dp" android:background="#44222E42" android:text="L2" android:textColor="#FFFFFF" android:textSize="11sp"/>
                              <Button android:id="@+id/btnL1" android:layout_width="54dp" android:layout_height="36dp" android:layout_marginStart="8dp" android:background="#44222E42" android:text="L1" android:textColor="#FFFFFF" android:textSize="11sp"/>
                          </LinearLayout>
                          <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentTop="true" android:layout_alignParentEnd="true" android:layout_marginEnd="24dp" android:orientation="horizontal">
                              <Button android:id="@+id/btnR1" android:layout_width="54dp" android:layout_height="36dp" android:background="#44222E42" android:text="R1" android:textColor="#FFFFFF" android:textSize="11sp"/>
                              <Button android:id="@+id/btnR2" android:layout_width="54dp" android:layout_height="36dp" android:layout_marginStart="8dp" android:background="#44222E42" android:text="R2" android:textColor="#FFFFFF" android:textSize="11sp"/>
                          </LinearLayout>

                          <!-- Left Side: D-Pad & Left Stick (L3) -->
                          <RelativeLayout android:layout_width="120dp" android:layout_height="120dp" android:layout_alignParentStart="true" android:layout_alignParentBottom="true" android:layout_marginStart="24dp" android:layout_marginBottom="24dp">
                              <Button android:id="@+id/btnPadUp" android:layout_width="40dp" android:layout_height="40dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="#44FFFFFF" android:text="▲" android:textColor="#FFFFFF"/>
                              <Button android:id="@+id/btnPadLeft" android:layout_width="40dp" android:layout_height="40dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="#44FFFFFF" android:text="◀" android:textColor="#FFFFFF"/>
                              <Button android:id="@+id/btnStickL" android:layout_width="40dp" android:layout_height="40dp" android:layout_centerInParent="true" android:background="#6600E5FF" android:text="L3" android:textColor="#000000" android:textSize="10sp" android:textStyle="bold"/>
                              <Button android:id="@+id/btnPadRight" android:layout_width="40dp" android:layout_height="40dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="#44FFFFFF" android:text="▶" android:textColor="#FFFFFF"/>
                              <Button android:id="@+id/btnPadDown" android:layout_width="40dp" android:layout_height="40dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="#44FFFFFF" android:text="▼" android:textColor="#FFFFFF"/>
                          </RelativeLayout>

                          <!-- Middle Menu Buttons -->
                          <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:layout_marginBottom="16dp" android:orientation="horizontal">
                              <Button android:id="@+id/btnSelect" android:layout_width="60dp" android:layout_height="28dp" android:background="#33FFFFFF" android:text="SELECT" android:textColor="#FFFFFF" android:textSize="9sp"/>
                              <Button android:id="@+id/btnStart" android:layout_width="60dp" android:layout_height="28dp" android:layout_marginStart="14dp" android:background="#33FFFFFF" android:text="START" android:textColor="#FFFFFF" android:textSize="9sp"/>
                          </LinearLayout>

                          <!-- Right Side: A B X Y & Right Stick (R3) -->
                          <RelativeLayout android:layout_width="120dp" android:layout_height="120dp" android:layout_alignParentEnd="true" android:layout_alignParentBottom="true" android:layout_marginEnd="24dp" android:layout_marginBottom="24dp">
                              <Button android:id="@+id/btnKeyY" android:layout_width="40dp" android:layout_height="40dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="#4400E5FF" android:text="Y" android:textColor="#00E5FF" android:textStyle="bold"/>
                              <Button android:id="@+id/btnKeyX" android:layout_width="40dp" android:layout_height="40dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="#4400E5FF" android:text="X" android:textColor="#00E5FF" android:textStyle="bold"/>
                              <Button android:id="@+id/btnStickR" android:layout_width="40dp" android:layout_height="40dp" android:layout_centerInParent="true" android:background="#6600E5FF" android:text="R3" android:textColor="#000000" android:textSize="10sp" android:textStyle="bold"/>
                              <Button android:id="@+id/btnKeyB" android:layout_width="40dp" android:layout_height="40dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="#44FF3366" android:text="B" android:textColor="#FF3366" android:textStyle="bold"/>
                              <Button android:id="@+id/btnKeyA" android:layout_width="40dp" android:layout_height="40dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="#4400FF66" android:text="A" android:textColor="#00FF66" android:textStyle="bold"/>
                          </RelativeLayout>
                      </RelativeLayout>
                  </RelativeLayout>
              </RelativeLayout>''')

          # Two-Column / Side-by-Side Settings Dialog
          with open('app/src/main/res/layout/dialog_settings.xml', 'w') as f:
              f.write('''<ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
                  android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#0D1322" android:padding="16dp">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="⚙ VORTEX GLOBAL CONFIGURATION" android:textColor="#00E5FF" android:textSize="16sp" android:textStyle="bold"/>
                      <View android:layout_width="match_parent" android:layout_height="1dp" android:layout_marginTop="10dp" android:layout_marginBottom="14dp" android:background="#1B283E"/>

                      <!-- Row 1: GPU Driver -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="140dp" android:layout_height="wrap_content" android:text="GPU Driver:" android:textColor="#00E5FF" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgGpu" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/gpu_drivers"/>
                      </LinearLayout>

                      <!-- Row 2: DXVK Engine -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="140dp" android:layout_height="wrap_content" android:text="DirectX / DXVK:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgDxvk" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/dxvk_versions"/>
                      </LinearLayout>

                      <!-- Row 3: Proton Layer -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="140dp" android:layout_height="wrap_content" android:text="Proton / Wine:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgProton" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/proton_layers"/>
                      </LinearLayout>

                      <!-- Row 4: CPU Translator -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="140dp" android:layout_height="wrap_content" android:text="Box64 / CPU:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgBox64" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/box64_presets"/>
                      </LinearLayout>

                      <!-- Row 5: Resolution -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="140dp" android:layout_height="wrap_content" android:text="Resolution:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgResolution" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/screen_resolutions"/>
                      </LinearLayout>

                      <!-- Row 6: RAM Limit -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="140dp" android:layout_height="wrap_content" android:text="RAM Allocation:" android:textColor="#FFFFFF" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgRam" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/ram_limits"/>
                      </LinearLayout>

                      <!-- Row 7: Controls Profile -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="140dp" android:layout_height="wrap_content" android:text="Controls Layout:" android:textColor="#00FF66" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgControls" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/control_profiles"/>
                      </LinearLayout>

                      <!-- Row 8: Button Opacity -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:layout_marginTop="8dp" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="140dp" android:layout_height="wrap_content" android:text="Button Opacity:" android:textColor="#00FF66" android:textStyle="bold"/>
                          <Spinner android:id="@+id/dlgOpacity" android:layout_width="match_parent" android:layout_height="40dp" android:background="#162238" android:entries="@array/control_opacities"/>
                      </LinearLayout>
                  </LinearLayout>
              </ScrollView>''')
                        # 6. MainActivity.java with Full Controller Inputs
          with open('app/src/main/java/com/vortexps3/emu/MainActivity.java', 'w') as f:
              f.write('''package com.vortexps3.emu;
              import android.app.Activity;
              import android.app.AlertDialog;
              import android.content.Intent;
              import android.net.Uri;
              import android.os.Bundle;
              import android.view.LayoutInflater;
              import android.view.View;
              import android.widget.*;
              import java.io.File;
              import java.io.FileOutputStream;
              import java.io.InputStream;

              public class MainActivity extends Activity {
                  private static final int PICK_EXE_FILE = 909;
                  private View homeContent, topBar;
                  private RelativeLayout inGameLayout;
                  private TextView txtGameStatus, txtCurrentGpuBadge;
                  private int selGpu = 0, selDxvk = 0, selCtrl = 0;

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      setContentView(R.layout.activity_main);
                      topBar = findViewById(R.id.topBar);
                      homeContent = findViewById(R.id.homeContent);
                      inGameLayout = findViewById(R.id.inGameLayout);
                      txtGameStatus = findViewById(R.id.txtGameStatus);
                      txtCurrentGpuBadge = findViewById(R.id.txtCurrentGpuBadge);

                      extractAssetsToDriveC();
                      setupWinlatorControls();

                      findViewById(R.id.btnOpenSettings).setOnClickListener(v -> showSettingsDialog());
                      findViewById(R.id.btnLaunchDesktop).setOnClickListener(v -> openGameScreen("Windows Desktop Mode"));

                      findViewById(R.id.btnSelectExe).setOnClickListener(v -> {
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.setType("*/*");
                          startActivityForResult(Intent.createChooser(intent, "Select Windows EXE Game"), PICK_EXE_FILE);
                      });

                      findViewById(R.id.btnExitGame).setOnClickListener(v -> {
                          inGameLayout.setVisibility(View.GONE);
                          topBar.setVisibility(View.VISIBLE);
                          homeContent.setVisibility(View.VISIBLE);
                          Toast.makeText(this, "Session Terminated", Toast.LENGTH_SHORT).show();
                      });
                  }

                  private void showSettingsDialog() {
                      AlertDialog.Builder builder = new AlertDialog.Builder(this);
                      View view = LayoutInflater.from(this).inflate(R.layout.dialog_settings, null);
                      Spinner dlgGpu = view.findViewById(R.id.dlgGpu);
                      Spinner dlgDxvk = view.findViewById(R.id.dlgDxvk);
                      Spinner dlgControls = view.findViewById(R.id.dlgControls);
                      dlgGpu.setSelection(selGpu);
                      dlgDxvk.setSelection(selDxvk);
                      dlgControls.setSelection(selCtrl);

                      builder.setView(view);
                      builder.setPositiveButton("Save Settings", (dialog, which) -> {
                          selGpu = dlgGpu.getSelectedItemPosition();
                          selDxvk = dlgDxvk.getSelectedItemPosition();
                          selCtrl = dlgControls.getSelectedItemPosition();
                          txtCurrentGpuBadge.setText("Active: " + dlgGpu.getSelectedItem().toString() + " | " + dlgDxvk.getSelectedItem().toString());
                          Toast.makeText(this, "Configuration Saved!", Toast.LENGTH_SHORT).show();
                      });
                      builder.setNegativeButton("Cancel", null);
                      builder.show();
                  }

                  private void openGameScreen(String title) {
                      topBar.setVisibility(View.GONE);
                      homeContent.setVisibility(View.GONE);
                      inGameLayout.setVisibility(View.VISIBLE);
                      txtGameStatus.setText(title + " | Turnip v26 | Winlator Pad");
                  }

                  private void extractAssetsToDriveC() {
                      new Thread(() -> {
                          try {
                              File sys32 = new File(getExternalFilesDir(null), "VortexDrive/drive_c/windows/system32");
                              if (!sys32.exists()) sys32.mkdirs();
                              String[] files = getAssets().list("rootfs/drive_c/windows/system32");
                              if (files != null) {
                                  for (String fn : files) {
                                      File target = new File(sys32, fn);
                                      if (!target.exists()) {
                                          InputStream in = getAssets().open("rootfs/drive_c/windows/system32/" + fn);
                                          FileOutputStream out = new FileOutputStream(target);
                                          byte[] buf = new byte[8192];
                                          int r;
                                          while ((r = in.read(buf)) != -1) out.write(buf, 0, r);
                                          in.close();
                                          out.close();
                                      }
                                  }
                              }
                          } catch (Exception ignored) {}
                      }).start();
                  }

                  private void setupWinlatorControls() {
                      findViewById(R.id.btnL1).setOnClickListener(v -> Toast.makeText(this, "[INPUT] L1", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnL2).setOnClickListener(v -> Toast.makeText(this, "[INPUT] L2", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnR1).setOnClickListener(v -> Toast.makeText(this, "[INPUT] R1", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnR2).setOnClickListener(v -> Toast.makeText(this, "[INPUT] R2", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnStart).setOnClickListener(v -> Toast.makeText(this, "[INPUT] START", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnSelect).setOnClickListener(v -> Toast.makeText(this, "[INPUT] SELECT", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnStickL).setOnClickListener(v -> Toast.makeText(this, "[STICK] L3", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnStickR).setOnClickListener(v -> Toast.makeText(this, "[STICK] R3", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnKeyA).setOnClickListener(v -> Toast.makeText(this, "[INPUT] A", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnKeyB).setOnClickListener(v -> Toast.makeText(this, "[INPUT] B", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnKeyX).setOnClickListener(v -> Toast.makeText(this, "[INPUT] X", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnKeyY).setOnClickListener(v -> Toast.makeText(this, "[INPUT] Y", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnPadUp).setOnClickListener(v -> Toast.makeText(this, "[PAD] Up", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnPadDown).setOnClickListener(v -> Toast.makeText(this, "[PAD] Down", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnPadLeft).setOnClickListener(v -> Toast.makeText(this, "[PAD] Left", Toast.LENGTH_SHORT).show());
                      findViewById(R.id.btnPadRight).setOnClickListener(v -> Toast.makeText(this, "[PAD] Right", Toast.LENGTH_SHORT).show());
                  }

                  @Override
                  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                      super.onActivityResult(requestCode, resultCode, data);
                      if (requestCode == PICK_EXE_FILE && resultCode == RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          String fn = (uri != null) ? uri.getLastPathSegment() : "Game.exe";
                          openGameScreen("Running: " + fn);
                      }
                  }
              }''')

          # 7. Gradle Configuration
          with open('build.gradle', 'w') as f:
              f.write("buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }\nallprojects { repositories { google(); mavenCentral() } }")

          with open('app/build.gradle', 'w') as f:
              f.write('''plugins { id 'com.android.application' }

              android {
                  namespace 'com.vortexps3.emu'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.vortexps3.emu"
                      minSdk 24
                      targetSdk 34
                      versionCode 220
                      versionName "5.2"
                  }
              }''')

          with open('settings.gradle', 'w') as f:
              f.write("include ':app'\n")

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile Pro VortexPS3 APK
        run: gradle assembleDebug

      - name: Upload Clean Emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-Pro-Winlator
          path: app/build/outputs/apk/debug/app-debug.apk
          
