                  versionCode 370
                  versionName "17.0"
              }
          }
          EOF

          echo "include ':app'" > settings.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile Final Complete APK
        run: gradle assembleDebug

      - name: Upload Complete Emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-Complete-Edition
          path: app/build/outputs/apk/debug/app-debug.apk
          
