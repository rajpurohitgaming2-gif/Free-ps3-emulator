name: Build VortexPS3 Update Engine

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Permanent Key and Project Files via Python
        shell: python
        run: |
          import os, shutil

          for path in ['app', 'build.gradle', 'settings.gradle']:
              if os.path.exists(path):
                  if os.path.isdir(path): shutil.rmtree(path)
                  else: os.remove(path)

          os.makedirs('app/src/main/java/com/vortexps3/emu', exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)
          os.makedirs('app/src/main/res/values', exist_ok=True)
          os.makedirs('app/src/main/res/drawable', exist_ok=True)

          # 1. Permanent Launcher Icon
          icon_xml = '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#00E5FF" android:strokeWidth="5" android:pathData="M54,24 A30,30 0 1,0 84,54" android:strokeLineCap="round"/>
              <path android:strokeColor="#7928CA" android:strokeWidth="5" android:pathData="M54,84 A30,30 0 1,0 24,54" android:strokeLineCap="round"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L66,54 L48,66 Z"/>
          </vector>'''
          with open('app/src/main/res/drawable/ic_launcher.xml', 'w', encoding='utf-8') as f:
              f.write(icon_xml.strip())

          # 2. Android Manifest
          manifest_xml = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="com.vortexps3.emu.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>'''
          with open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write(manifest_xml.strip())

          # 3. Full Worldwide Driver Database
          strings_xml = '''<resources>
              <string name="app_name">VortexPS3 Emu</string>

              <!-- ALL Worldwide GPU Drivers -->
              <string-array name="gpu_drivers">
                  <item>Turnip v26.1.0-devel (Adreno 6xx/7xx/8xx)</item>
                  <item>Turnip v25.0.0 Stable (Snapdragon 8 Gen 1/2/3)</item>
                  <item>Turnip v24.3.0 Aggressive (High FPS Performance)</item>
                  <item>Turnip v24.2.0-rc4 (Balanced Stability)</item>
                  <item>Turnip v24.1.0 Classic (Snapdragon 720G/778G/870)</item>
                  <item>Turnip v23.3.0 Legacy (Adreno 5xx/6xx Older Chips)</item>
                  <item>Turnip A8xx Hotfix (Snapdragon 8 Gen 3/4 Fix)</item>
                  <item>Turnip DXVK-GPL Enabled Build (No Stutter)</item>
                  <item>Turnip Kgsl / Sysfs Optimized Driver</item>
                  <item>Qualcomm Proprietary v0615.0 (Vulkan 1.3 Native)</item>
                  <item>Qualcomm Proprietary v0512.68 (Adreno 6xx Legacy)</item>
                  <item>VirGL Universal 3D (Dimensity 7000/8000/9000)</item>
                  <item>VirGL Mali-G7x Compatibility Fix</item>
                  <item>Panfrost Mesa Driver (Mali Midgard/Bifrost/Valhall)</item>
                  <item>Mali Immortalis G715/G720 Vulkan Compatibility</item>
                  <item>Zink Engine (OpenGL via Vulkan Translation)</item>
                  <item>LLVMpipe Universal (Software CPU Fallback)</item>
                  <item>System Default Android Vulkan Driver</item>
              </string-array>

              <!-- ALL Worldwide DXVK Versions -->
              <string-array name="dxvk_versions">
                  <item>DXVK 2.4.1-async (Fastest Shader Pipeline)</item>
                  <item>DXVK 2.3.1-async (Balanced Stable Standard)</item>
                  <item>DXVK 2.2-gpl (DirectX 11 Modern Titles)</item>
                  <item>DXVK 2.0-async (Smooth FPS Optimizer)</item>
                  <item>DXVK 1.10.3 (DirectX 9 / 10 Legacy Games Fix)</item>
                  <item>DXVK 1.9.4 (DirectX 9 Lightweight)</item>
                  <item>VKD3D-Proton 2.13 (DirectX 12 Support)</item>
                  <item>WineD3D (OpenGL Pure Translation)</item>
              </string-array>

              <!-- ALL Worldwide Proton & Wine Layers -->
              <string-array name="proton_layers">
                  <item>proton11.0-arm64x (Latest Best Game Compatibility)</item>
                  <item>proton10.0-arm64x-2 (AAA Games Stable)</item>
                  <item>proton9.0-arm64x-3 (Low System Overhead)</item>
                  <item>proton-ge-custom-8.26 (Gaming Optimized)</item>
                  <item>wine10.0-staging-x64 (Pure Wine Engine)</item>
                  <item>wine9.22-vanilla-x64 (Native Windows Core)</item>
                  <item>wine9.16-esync (Multi-Thread Performance)</item>
                  <item>wine8.18-stable (High Stability Fallback)</item>
                  <item>wine7.22-legacy (Old PC Games Specialist)</item>
              </string-array>

              <!-- ALL CPU Translators (Box64 / Box86 / FEX) -->
              <string-array name="box64_presets">
                  <item>Box64 v0.3.4 (Bleeding Edge - Latest Instructions)</item>
                  <item>Box64 v0.3.2 Aggressive (Highest FPS Booster)</item>
                  <item>Box64 v0.3.0 Balanced (Most Stable for AAA)</item>
                  <item>Box64 v0.2.8 Legacy (Old 64-bit Game Fix)</item>
                  <item>Box64 Safe Multi-threading (Big.LITTLE Fix)</item>
                  <item>Box64 Dynarec Fastmath Mode (Speed Hack)</item>
                  <item>Box86 v0.3.2 Aggressive (32-bit Classic Games)</item>
                  <item>Box86 Performance Safe (GTA / NFS / Classic PC)</item>
                  <item>Box86 Compatibility (Fix Old Visual C++ Errors)</item>
                  <item>FEX-Emu v2402 (Fast ARM64 JIT Translator)</item>
                  <item>FEX-Emu Multi-Core Vector Mode</item>
                  <item>Hangover / WOW64 Native Engine (Direct Translation)</item>
              </string-array>

              <!-- Full Resolutions -->
              <string-array name="screen_resolutions">
                  <item>1280 x 720 (16:9 Standard HD - Recommended)</item>
                  <item>960 x 540 (qHD Fast Performance / Low-End)</item>
                  <item>854 x 480 (FWVGA Ultra Fast Mode)</item>
                  <item>1600 x 900 (HD+ Balanced)</item>
                  <item>1920 x 1080 (Full HD 1080p - High End Phones)</item>
                  <item>800 x 600 (4:3 Classic PC Scale)</item>
                  <item>1024 x 768 (4:3 Standard)</item>
              </string-array>

              <!-- RAM Limits -->
              <string-array name="ram_limits">
                  <item>4 GB (Standard 6GB/8GB Phones)</item>
                  <item>6 GB (Medium Gaming Phones)</item>
                  <item>8 GB (High-End Snapdragon 12GB+)</item>
                  <item>3 GB (Balanced)</item>
                  <item>2 GB (Low-End Phones 4GB RAM)</item>
              </string-array>

              <!-- Input Profiles -->
              <string-array name="input_profiles">
                  <item>Virtual Gamepad (Touch Overlay D-Pad + Buttons)</item>
                  <item>Keyboard &amp; Mouse Mode</item>
                  <item>External USB / Bluetooth Controller</item>
                  <item>Disable All Overlays</item>
              </string-array>

              <string-array name="input_opacity">
                  <item>100% Opacity (Solid Buttons)</item>
                  <item>75% Opacity (Balanced)</item>
                  <item>50% Opacity (Semi-Transparent)</item>
                  <item>25% Opacity (Minimal Ghost)</item>
              </string-array>
          </resources>'''
          with open('app/src/main/res/values/strings.xml', 'w', encoding='utf-8') as f:
              f.write(strings_xml.strip())
                        # 4. Multi-Category Modern UI + In-Game X11 Display Surface Layout
          layout_xml = '''<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
