                    cat << 'EOF' > app/src/main/java/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;
          import android.app.*;
          import android.graphics.Color;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              private RelativeLayout containersScreen, containerEditScreen, desktopContainer;
              private TextView fpsCounter, txtTaskClock, txtAddressPath, txtStatusBar, txtCardSub;
              private ListView pcListView;
              private ImageView imgMouseCursor;
              private long lastTime = 0;
              private int frames = 0;
              private File currentDir = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  containersScreen = findViewById(R.id.containersScreen);
                  containerEditScreen = findViewById(R.id.containerEditScreen);
                  desktopContainer = findViewById(R.id.desktopContainer);
                  fpsCounter = findViewById(R.id.fpsCounter);
                  txtTaskClock = findViewById(R.id.txtTaskClock);
                  txtAddressPath = findViewById(R.id.txtAddressPath);
                  txtStatusBar = findViewById(R.id.txtStatusBar);
                  txtCardSub = findViewById(R.id.txtCardSub);
                  pcListView = findViewById(R.id.pcListView);
                  imgMouseCursor = findViewById(R.id.imgMouseCursor);

                  initDriveFileSystem();

                  findViewById(R.id.btnRunDesktop).setOnClickListener(v -> {
                      containersScreen.setVisibility(View.GONE);
                      containerEditScreen.setVisibility(View.GONE);
                      desktopContainer.setVisibility(View.VISIBLE);
                      loadComputerRoot();
                  });

                  findViewById(R.id.btnEditContainer).setOnClickListener(v -> {
                      containersScreen.setVisibility(View.GONE);
                      containerEditScreen.setVisibility(View.VISIBLE);
                  });
                  findViewById(R.id.btnEditBack).setOnClickListener(v -> {
                      containerEditScreen.setVisibility(View.GONE);
                      containersScreen.setVisibility(View.VISIBLE);
                  });
                  findViewById(R.id.btnSaveConfig).setOnClickListener(v -> {
                      Spinner spn = findViewById(R.id.spnProton);
                      if (spn != null && spn.getSelectedItem() != null) txtCardSub.setText(spn.getSelectedItem().toString() + " • 1280x720");
                      containerEditScreen.setVisibility(View.GONE);
                      containersScreen.setVisibility(View.VISIBLE);
                      Toast.makeText(this, "Saved!", Toast.LENGTH_SHORT).show();
                  });

                  findViewById(R.id.btnExit).setOnClickListener(v -> {
                      desktopContainer.setVisibility(View.GONE);
                      containersScreen.setVisibility(View.VISIBLE);
                  });

                  findViewById(R.id.treeComputer).setOnClickListener(v -> loadComputerRoot());
                  findViewById(R.id.treeDriveC).setOnClickListener(v -> loadDir(new File(getExternalFilesDir(null), "drive_c"), "Computer > C:"));
                  findViewById(R.id.treeDriveD).setOnClickListener(v -> loadDir(new File(getExternalFilesDir(null), "drive_d"), "Computer > D:"));
                  findViewById(R.id.treeDriveZ).setOnClickListener(v -> loadDir(getExternalFilesDir(null), "Computer > Z:"));

                  findViewById(R.id.toolUp).setOnClickListener(v -> {
                      if (currentDir != null && currentDir.getParentFile() != null) loadDir(currentDir.getParentFile(), "Computer > " + currentDir.getParentFile().getName());
                      else loadComputerRoot();
                  });

                  desktopContainer.setOnTouchListener((v, e) -> {
                      if (imgMouseCursor != null && (e.getAction() == MotionEvent.ACTION_MOVE || e.getAction() == MotionEvent.ACTION_DOWN)) {
                          imgMouseCursor.setX(e.getX()); imgMouseCursor.setY(e.getY());
                      }
                      return false;
                  });

                  Choreographer.getInstance().postFrameCallback(new Choreographer.FrameCallback() {
                      @Override public void doFrame(long time) {
                          if (lastTime == 0) lastTime = time; frames++;
                          if (time - lastTime >= 1000000000L) {
                              if (fpsCounter != null) fpsCounter.setText(String.format("FPS: %.1f", (frames * 1000000000.0) / (time - lastTime)));
                              frames = 0; lastTime = time;
                              if (txtTaskClock != null) txtTaskClock.setText(new SimpleDateFormat("hh:mm a", Locale.getDefault()).format(new Date()));
                          }
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  });
              }

              private void initDriveFileSystem() {
                  try {
                      File c = new File(getExternalFilesDir(null), "drive_c/windows/system32");
                      File g = new File(getExternalFilesDir(null), "drive_c/Games");
                      c.mkdirs(); g.mkdirs();
                      new File(c, "kernel32.dll").createNewFile();
                      new File(g, "GTA_V.exe").createNewFile();
                  } catch (Exception ignored) {}
              }

              private void loadComputerRoot() {
                  currentDir = null;
                  if (txtAddressPath != null) txtAddressPath.setText("Computer > ");
                  if (txtStatusBar != null) txtStatusBar.setText("4 Drives Ready");

                  String[] drives = {"💾 C: Local Drive (Windows)", "💾 D: Local Drive (Games)", "💾 E: CD-ROM", "💾 Z: Linux Root / System"};
                  renderSafeList(drives, true, null);
              }

              private void loadDir(File dir, String displayPath) {
                  if (dir == null) return;
                  if (!dir.exists()) dir.mkdirs();
                  currentDir = dir;
                  if (txtAddressPath != null) txtAddressPath.setText(displayPath + " > ");

                  File[] files = dir.listFiles();
                  int count = (files != null) ? files.length : 0;
                  if (txtStatusBar != null) txtStatusBar.setText(count + " Items");

                  ArrayList<String> list = new ArrayList<>();
                  if (files != null && files.length > 0) {
                      for (File f : files) list.add((f.isDirectory() ? "📁 " : "📄 ") + f.getName());
                  } else {
                      list.add("(Empty Folder)");
                  }
                  renderSafeList(list.toArray(new String[0]), false, files);
              }

              private void renderSafeList(String[] data, boolean isRoot, File[] files) {
                  ArrayAdapter<String> adapter = new ArrayAdapter<String>(this, android.R.layout.simple_list_item_1, data) {
                      @Override public View getView(int pos, View cv, ViewGroup p) {
                          TextView tv = (TextView) super.getView(pos, cv, p);
                          tv.setTextColor(Color.WHITE);
                          tv.setTextSize(11);
                          return tv;
                      }
                  };
                  if (pcListView != null) {
                      pcListView.setAdapter(adapter);
                      pcListView.setOnItemClickListener((p, v, pos, id) -> {
                          if (isRoot) {
                              if (pos == 0) loadDir(new File(getExternalFilesDir(null), "drive_c"), "Computer > C:");
                              else if (pos == 1) loadDir(new File(getExternalFilesDir(null), "drive_c/Games"), "Computer > D:");
                              else loadDir(getExternalFilesDir(null), "Computer > Z:");
                          } else {
                              if (files != null && pos < files.length && files[pos].isDirectory()) {
                                  loadDir(files[pos], txtAddressPath.getText().toString() + files[pos].getName());
                              } else if (files != null && pos < files.length) {
                                  Toast.makeText(this, "Launched: " + files[pos].getName(), Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }
              }
          }
          EOF

          cat << 'EOF' > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vortexps3.emu'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vortexps3.emu"
                  minSdk 24
                  targetSdk 34
                  versionCode 800
                  versionName "60.0"
              }
          }
          EOF

          echo "include ':app'" > settings.gradle

