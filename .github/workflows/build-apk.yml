name: Build VortexPS3 Modular Emulator

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Clean Tabbed Emulator Structure
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/vortexps3/emu
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # 1. High Quality Vector Icon
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#00E5FF" android:strokeWidth="5" android:pathData="M54,24 A30,30 0 1,0 84,54" android:strokeLineCap="round"/>
              <path android:strokeColor="#7928CA" android:strokeWidth="5" android:pathData="M54,84 A30,30 0 1,0 24,54" android:strokeLineCap="round"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L66,54 L48,66 Z"/>
          </vector>
          EOF

          # 2. Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="com.vortexps3.emu.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 3. Hardware Presets & Controls Data
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">VortexPS3 Emu</string>

              <!-- GPU Drivers Options -->
              <string-array name="gpu_drivers">
                  <item>Mesa Turnip v26.1.0 (Snapdragon Adreno 6xx/7xx)</item>
                  <item>Turnip v24.3.0 Aggressive (High Performance)</item>
                  <item>VirGL Universal (Mali / MediaTek Dimensity)</item>
                  <item>System Default Driver</item>
              </string-array>

              <!-- Resolutions -->
              <string-array name="screen_resolutions">
                  <item>1280 x 720 (16:9 HD Recommended)</item>
                  <item>960 x 540 (qHD Fast / Low-End Devices)</item>
                  <item>1920 x 1080 (Full HD 1080p)</item>
                  <item>800 x 600 (4:3 Classic PC)</item>
              </string-array>

              <!-- Input Profiles -->
              <string-array name="input_profiles">
                  <item>Virtual Gamepad (Touch Overlay)</item>
                  <item>Keyboard &amp; Mouse Mode</item>
                  <item>External USB / Bluetooth Controller</item>
                  <item>Disable All Overlays</item>
              </string-array>

              <!-- Input Opacity -->
              <string-array name="input_opacity">
                  <item>100% Opacity (Solid)</item>
                  <item>75% Opacity (Balanced)</item>
                  <item>50% Opacity (Semi-Transparent)</item>
                  <item>25% Opacity (Minimal)</item>
              </string-array>

              <!-- DXVK Engine -->
              <string-array name="dxvk_versions">
                  <item>DXVK 2.4.1-async (Best Smooth FPS)</item>
                  <item>DXVK 2.3.1 (Stable Standard)</item>
                  <item>DXVK 1.10.3 (DirectX 9 / Old Games)</item>
              </string-array>

              <!-- Box64 / Proton Layers -->
              <string-array name="proton_layers">
                  <item>proton11.0-arm64x (Latest Best Compat)</item>
                  <item>proton10.0-arm64x-2 (AAA Games Stable)</item>
                  <item>wine10.0-x64-2 (Pure Engine)</item>
              </string-array>

              <!-- RAM Limit -->
              <string-array name="ram_limits">
                  <item>4 GB (Standard Phones)</item>
                  <item>6 GB (Medium Gaming Phones)</item>
                  <item>8 GB (High-End Snapdragon)</item>
                  <item>2 GB (Low-End Phones)</item>
              </string-array>
          </resources>
          EOF

          # 4. Multi-Category Modern UI (Left Tabs: GPU/Display, Input/Controls, Engine/Advanced)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#070A11"
              android:orientation="horizontal">

              <!-- Left Sidebar: App Header & Category Tabs -->
              <LinearLayout
                  android:layout_width="230dp"
                  android:layout_height="match_parent"
                  android:background="#0D1322"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🌀 VORTEX-PS3"
                      android:textColor="#00E5FF"
                      android:textSize="20sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:text="ENGINE BY Yash (AI VIDEO HUB)"
                      android:textColor="#52647E"
                      android:textSize="10sp" />

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginTop="14dp"
                      android:layout_marginBottom="14dp"
                      android:background="#1B283E" />

                  <!-- Tab Buttons -->
                  <Button
                      android:id="@+id/tabDisplay"
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:background="#00E5FF"
                      android:text="🖥 GPU &amp; Display"
                      android:textColor="#000000"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/tabControls"
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:layout_marginTop="8dp"
                      android:background="#141E30"
                      android:text="🎮 Input &amp; Controls"
                      android:textColor="#FFFFFF" />

                  <Button
                      android:id="@+id/tabEngine"
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:layout_marginTop="8dp"
                      android:background="#141E30"
                      android:text="⚙ Engine &amp; DXVK"
                      android:textColor="#FFFFFF" />

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1" />

                  <Button
                      android:id="@+id/btnSelectExe"
                      android:layout_width="match_parent"
                      android:layout_height="46dp"
                      android:background="#00E5FF"
                      android:text="▶ Start Game (.EXE)"
                      android:textColor="#000000"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- Right Content Area (Swappable Category Pages) -->
              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:padding="20dp">

                  <!-- 1. Display & GPU Settings Panel -->
                  <ScrollView
                      android:id="@+id/panelDisplay"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:visibility="visible">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="GRAPHICS &amp; DISPLAY CONFIGURATION"
                              android:textColor="#FFFFFF"
                              android:textSize="16sp"
                              android:textStyle="bold" />

                          <!-- GPU Driver -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="18dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="GPU Driver:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnGpu"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/gpu_drivers" />
                          </LinearLayout>

                          <!-- Resolution -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="16dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="Screen Resolution:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnResolution"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/screen_resolutions" />
                          </LinearLayout>
                      </LinearLayout>
                  </ScrollView>

                  <!-- 2. Controls & Input Settings Panel -->
                  <ScrollView
                      android:id="@+id/panelControls"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="INPUT &amp; CONTROLLER CONFIGURATION"
                              android:textColor="#FFFFFF"
                              android:textSize="16sp"
                              android:textStyle="bold" />

                          <!-- Control Type -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="18dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="Input Method:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnInput"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/input_profiles" />
                          </LinearLayout>

                          <!-- Opacity -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="16dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="Button Opacity:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnOpacity"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/input_opacity" />
                          </LinearLayout>
                      </LinearLayout>
                  </ScrollView>

                  <!-- 3. Engine & Performance Settings Panel -->
                  <ScrollView
                      android:id="@+id/panelEngine"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="ADVANCED ENGINE &amp; TRANSLATOR"
                              android:textColor="#FFFFFF"
                              android:textSize="16sp"
                              android:textStyle="bold" />

                          <!-- DXVK -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="18dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="DXVK Engine:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnDxvk"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/dxvk_versions" />
                          </LinearLayout>

                          <!-- Proton Layer -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="16dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="Proton / Wine Layer:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnProton"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/proton_layers" />
                          </LinearLayout>

                          <!-- RAM -->
                          <LinearLayout
                              android:layout_width="match_parent"
                                       # 5. MainActivity.java (Tab Switcher & Launcher)
          cat << 'EOF' > app/src/main/java/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ScrollView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final int PICK_EXE_FILE = 606;
              private ScrollView panelDisplay, panelControls, panelEngine;
              private Button tabDisplay, tabControls, tabEngine;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  panelDisplay = findViewById(R.id.panelDisplay);
                  panelControls = findViewById(R.id.panelControls);
                  panelEngine = findViewById(R.id.panelEngine);

                  tabDisplay = findViewById(R.id.tabDisplay);
                  tabControls = findViewById(R.id.tabControls);
                  tabEngine = findViewById(R.id.tabEngine);

                  tabDisplay.setOnClickListener(v -> switchTab(0));
                  tabControls.setOnClickListener(v -> switchTab(1));
                  tabEngine.setOnClickListener(v -> switchTab(2));

                  Button btnSelectExe = findViewById(R.id.btnSelectExe);
                  btnSelectExe.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                      intent.setType("*/*");
                      startActivityForResult(Intent.createChooser(intent, "Select Game Executable (.exe)"), PICK_EXE_FILE);
                  });
              }

              private void switchTab(int index) {
                  panelDisplay.setVisibility(index == 0 ? View.VISIBLE : View.GONE);
                  panelControls.setVisibility(index == 1 ? View.VISIBLE : View.GONE);
                  panelEngine.setVisibility(index == 2 ? View.VISIBLE : View.GONE);

                  tabDisplay.setBackgroundColor(index == 0 ? Color.parseColor("#00E5FF") : Color.parseColor("#141E30"));
                  tabDisplay.setTextColor(index == 0 ? Color.BLACK : Color.WHITE);

                  tabControls.setBackgroundColor(index == 1 ? Color.parseColor("#00E5FF") : Color.parseColor("#141E30"));
                  tabControls.setTextColor(index == 1 ? Color.BLACK : Color.WHITE);

                  tabEngine.setBackgroundColor(index == 2 ? Color.parseColor("#00E5FF") : Color.parseColor("#141E30"));
                  tabEngine.setTextColor(index == 2 ? Color.BLACK : Color.WHITE);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK_EXE_FILE && resultCode == RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      String fileName = (uri != null) ? uri.getLastPathSegment() : "Game.exe";
                      Toast.makeText(this, "Launching Container with: " + fileName, Toast.LENGTH_LONG).show();
                  }
              }
          }
          EOF

          # 6. Build Gradle Setup
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }

          android {
              namespace 'com.vortexps3.emu'
              compileSdk 34

              defaultConfig {
                  applicationId "com.vortexps3.emu"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          echo "include ':app'" > settings.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile VortexPS3 Modular APK
        run: gradle assembleDebug

      - name: Upload Finished Modular APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-Modular-Settings
          path: app/build/outputs/apk/debug/app-debug.apk
          
