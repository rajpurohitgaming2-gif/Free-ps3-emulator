name: Build VortexPS3 Modular Emulator

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Project Files Safely via Python
        shell: python
        run: |
          import os, shutil

          for path in ['app', 'build.gradle', 'settings.gradle']:
              if os.path.exists(path):
                  if os.path.isdir(path): shutil.rmtree(path)
                  else: os.remove(path)

          os.makedirs('app/src/main/java/com/vortexps3/emu', exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)
          os.makedirs('app/src/main/res/values', exist_ok=True)
          os.makedirs('app/src/main/res/drawable', exist_ok=True)

          # 1. Launcher Icon
          icon_xml = '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#00E5FF" android:strokeWidth="5" android:pathData="M54,24 A30,30 0 1,0 84,54" android:strokeLineCap="round"/>
              <path android:strokeColor="#7928CA" android:strokeWidth="5" android:pathData="M54,84 A30,30 0 1,0 24,54" android:strokeLineCap="round"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L66,54 L48,66 Z"/>
          </vector>'''
          with open('app/src/main/res/drawable/ic_launcher.xml', 'w', encoding='utf-8') as f:
              f.write(icon_xml.strip())

          # 2. Android Manifest
          manifest_xml = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="com.vortexps3.emu.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>'''
          with open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write(manifest_xml.strip())

          # 3. Complete Expanded Hardware Presets (Snapdragon, Dimensity, Mali, Exynos, Unisoc)
          strings_xml = '''<resources>
              <string name="app_name">VortexPS3 Emu</string>

              <!-- GPU Drivers for ALL Mobile Processors -->
              <string-array name="gpu_drivers">
                  <item>Mesa Turnip v26.1.0-devel (Adreno 6xx/7xx/8xx)</item>
                  <item>Turnip v25.0.0 Stable (Snapdragon 8 Gen 1/2/3)</item>
                  <item>Turnip v24.3.0 Aggressive (High FPS Adreno 650/660)</item>
                  <item>Turnip v24.1.0 Classic (Snapdragon 720G/778G/870)</item>
                  <item>Turnip A8xx Hotfix (Snapdragon 8 Gen 3/4)</item>
                  <item>Qualcomm Proprietary v0615.0 Driver (Vulkan Native)</item>
                  <item>VirGL Universal 3D (MediaTek Dimensity / Helio)</item>
                  <item>Panfrost Mesa (Mali-G52 / G57 / G68 / G77 / G78)</item>
                  <item>Mali Immortalis G715/G720 Vulkan Compatibility</item>
                  <item>Zink Engine (OpenGL over Vulkan Translation)</item>
                  <item>LLVMpipe Universal (Unisoc / Software CPU Fallback)</item>
                  <item>System Default Android Graphic Driver</item>
              </string-array>

              <!-- Screen Resolutions -->
              <string-array name="screen_resolutions">
                  <item>1280 x 720 (16:9 Standard HD - Recommended)</item>
                  <item>960 x 540 (qHD Fast Performance / Low-End)</item>
                  <item>854 x 480 (FWVGA Ultra Fast Mode)</item>
                  <item>1600 x 900 (HD+ Balanced)</item>
                  <item>1920 x 1080 (Full HD 1080p - High End Phones)</item>
                  <item>800 x 600 (4:3 Classic PC Scale)</item>
                  <item>1024 x 768 (4:3 Standard)</item>
              </string-array>

              <!-- Complete DXVK Direct3D Translators -->
              <string-array name="dxvk_versions">
                  <item>DXVK 2.4.1-async (Fastest Shader Pipeline)</item>
                  <item>DXVK 2.3.1-async (Balanced Stable)</item>
                  <item>DXVK 2.2-gpl (DirectX 11 Modern Titles)</item>
                  <item>DXVK 2.0-async (Smooth FPS)</item>
                  <item>DXVK 1.10.3 (DirectX 9 / 10 Legacy Games Fix)</item>
                  <item>DXVK 1.9.4 (DirectX 9 Lightweight)</item>
                  <item>VKD3D-Proton 2.13 (DirectX 12 Support)</item>
                  <item>WineD3D (OpenGL Pure Translation)</item>
              </string-array>

              <!-- Complete Proton / Wine Compatibility Layers -->
              <string-array name="proton_layers">
                  <item>proton11.0-arm64x (Latest Best Game Compatibility)</item>
                  <item>proton10.0-arm64x-2 (AAA Games Stable)</item>
                  <item>proton9.0-arm64x-3 (Low System Overhead)</item>
                  <item>proton-ge-custom-8.26 (Gaming Optimized)</item>
                  <item>wine10.0-staging-x64 (Pure Wine Engine)</item>
                  <item>wine9.22-vanilla-x64 (Native Windows Core)</item>
                  <item>wine9.16-esync (Multi-Thread Performance)</item>
                  <item>wine8.18-stable (High Stability Fallback)</item>
                  <item>wine7.22-legacy (Old PC Games Specialist)</item>
              </string-array>

              <!-- Box64 / CPU Emulator Presets -->
              <string-array name="box64_presets">
                  <item>Box64 v0.3.2 Aggressive (Highest FPS)</item>
                  <item>Box64 Performance Safe (Stable Gaming)</item>
                  <item>Box64 Compatibility (Fix Unity / UE4 Game Crashes)</item>
                  <item>FEX-Emu ARM64 Translator (Alternative Engine)</item>
              </string-array>

              <!-- RAM Limits -->
              <string-array name="ram_limits">
                  <item>4 GB (Standard 6GB/8GB Phones)</item>
                  <item>6 GB (Medium Gaming Phones)</item>
                  <item>8 GB (High-End Snapdragon 12GB+)</item>
                  <item>3 GB (Balanced)</item>
                  <item>2 GB (Low-End Phones 4GB RAM)</item>
              </string-array>

              <!-- Input Profiles -->
              <string-array name="input_profiles">
                  <item>Virtual Gamepad (Touch Overlay D-Pad + Buttons)</item>
                  <item>Keyboard &amp; Mouse Mode</item>
                  <item>External USB / Bluetooth Controller</item>
                  <item>Disable All Overlays</item>
              </string-array>

              <string-array name="input_opacity">
                  <item>100% Opacity (Solid Buttons)</item>
                  <item>75% Opacity (Balanced)</item>
                  <item>50% Opacity (Semi-Transparent)</item>
                  <item>25% Opacity (Minimal Ghost)</item>
              </string-array>
          </resources>'''
          with open('app/src/main/res/values/strings.xml', 'w', encoding='utf-8') as f:
              f.write(strings_xml.strip())
                        # 4. Multi-Category Modern UI Layout with Full Driver Lists
          layout_xml = '''<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#070A11"
              android:orientation="horizontal">

              <!-- Left Sidebar: App Header & Category Tabs -->
              <LinearLayout
                  android:layout_width="230dp"
                  android:layout_height="match_parent"
                  android:background="#0D1322"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🌀 VORTEX-PS3"
                      android:textColor="#00E5FF"
                      android:textSize="20sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:text="ENGINE BY Yash (AI VIDEO HUB)"
                      android:textColor="#52647E"
                      android:textSize="10sp" />

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginTop="14dp"
                      android:layout_marginBottom="14dp"
                      android:background="#1B283E" />

                  <!-- Tab Buttons -->
                  <Button
                      android:id="@+id/tabDisplay"
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:background="#00E5FF"
                      android:text="🖥 GPU &amp; Display"
                      android:textColor="#000000"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/tabControls"
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:layout_marginTop="8dp"
                      android:background="#141E30"
                      android:text="🎮 Input &amp; Controls"
                      android:textColor="#FFFFFF" />

                  <Button
                      android:id="@+id/tabEngine"
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:layout_marginTop="8dp"
                      android:background="#141E30"
                      android:text="⚙ Engine &amp; DXVK"
                      android:textColor="#FFFFFF" />

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1" />

                  <Button
                      android:id="@+id/btnSelectExe"
                      android:layout_width="match_parent"
                      android:layout_height="46dp"
                      android:background="#00E5FF"
                      android:text="▶ Start Game (.EXE)"
                      android:textColor="#000000"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- Right Content Area (Swappable Category Panels) -->
              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:padding="20dp">

                  <!-- 1. Display & GPU Settings Panel -->
                  <ScrollView
                      android:id="@+id/panelDisplay"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:visibility="visible">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="GRAPHICS &amp; DISPLAY CONFIGURATION"
                              android:textColor="#FFFFFF"
                              android:textSize="16sp"
                              android:textStyle="bold" />

                          <!-- GPU Driver -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="18dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="GPU Driver:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnGpu"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/gpu_drivers" />
                          </LinearLayout>

                          <!-- Resolution -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="16dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="Screen Resolution:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnResolution"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/screen_resolutions" />
                          </LinearLayout>
                      </LinearLayout>
                  </ScrollView>

                  <!-- 2. Controls & Input Settings Panel -->
                  <ScrollView
                      android:id="@+id/panelControls"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="INPUT &amp; CONTROLLER CONFIGURATION"
                              android:textColor="#FFFFFF"
                              android:textSize="16sp"
                              android:textStyle="bold" />

                          <!-- Control Type -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="18dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="Input Method:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnInput"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/input_profiles" />
                          </LinearLayout>

                          <!-- Opacity -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="16dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="Button Opacity:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnOpacity"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/input_opacity" />
                          </LinearLayout>
                      </LinearLayout>
                  </ScrollView>

                  <!-- 3. Engine & Performance Settings Panel -->
                  <ScrollView
                      android:id="@+id/panelEngine"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="ADVANCED ENGINE, DXVK &amp; PROTON"
                              android:textColor="#FFFFFF"
                              android:textSize="16sp"
                              android:textStyle="bold" />

                          <!-- DXVK -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="18dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="DXVK Engine:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnDxvk"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/dxvk_versions" />
                          </LinearLayout>

                          <!-- Proton / Wine Layer -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="16dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="Proton / Wine Layer:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnProton"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/proton_layers" />
                          </LinearLayout>

                          <!-- Box64 Presets -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="16dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="CPU Translator (Box64):"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnBox64"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/box64_presets" />
                          </LinearLayout>

                          <!-- RAM -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="16dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:layout_width="160dp"
                                  android:layout_height="wrap_content"
                                  android:text="RAM Allocation:"
                                  android:textColor="#00E5FF"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <Spinner
                                  android:id="@+id/spnRam"
                                  android:layout_width="match_parent"
                                  android:layout_height="44dp"
                                  android:background="#111B2C"
                                  android:entries="@array/ram_limits" />
                          </LinearLayout>
                      </LinearLayout>
                  </ScrollView>
              </FrameLayout>
          </LinearLayout>'''
          with open('app/src/main/res/layout/activity_main.xml', 'w', encoding='utf-8') as f:
              f.write(layout_xml.strip())
                        # 5. MainActivity.java (Tab Switching & Launcher)
          main_java = '''package com.vortexps3.emu;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ScrollView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final int PICK_EXE_FILE = 606;
              private ScrollView panelDisplay, panelControls, panelEngine;
              private Button tabDisplay, tabControls, tabEngine;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  panelDisplay = findViewById(R.id.panelDisplay);
                  panelControls = findViewById(R.id.panelControls);
                  panelEngine = findViewById(R.id.panelEngine);

                  tabDisplay = findViewById(R.id.tabDisplay);
                  tabControls = findViewById(R.id.tabControls);
                  tabEngine = findViewById(R.id.tabEngine);

                  tabDisplay.setOnClickListener(v -> switchTab(0));
                  tabControls.setOnClickListener(v -> switchTab(1));
                  tabEngine.setOnClickListener(v -> switchTab(2));

                  Button btnSelectExe = findViewById(R.id.btnSelectExe);
                  btnSelectExe.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                      intent.setType("*/*");
                      startActivityForResult(Intent.createChooser(intent, "Select Game Executable (.exe)"), PICK_EXE_FILE);
                  });
              }

              private void switchTab(int index) {
                  panelDisplay.setVisibility(index == 0 ? View.VISIBLE : View.GONE);
                  panelControls.setVisibility(index == 1 ? View.VISIBLE : View.GONE);
                  panelEngine.setVisibility(index == 2 ? View.VISIBLE : View.GONE);

                  tabDisplay.setBackgroundColor(index == 0 ? Color.parseColor("#00E5FF") : Color.parseColor("#141E30"));
                  tabDisplay.setTextColor(index == 0 ? Color.BLACK : Color.WHITE);

                  tabControls.setBackgroundColor(index == 1 ? Color.parseColor("#00E5FF") : Color.parseColor("#141E30"));
                  tabControls.setTextColor(index == 1 ? Color.BLACK : Color.WHITE);

                  tabEngine.setBackgroundColor(index == 2 ? Color.parseColor("#00E5FF") : Color.parseColor("#141E30"));
                  tabEngine.setTextColor(index == 2 ? Color.BLACK : Color.WHITE);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK_EXE_FILE && resultCode == RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      String fileName = (uri != null) ? uri.getLastPathSegment() : "Game.exe";
                      Toast.makeText(this, "Launching Container with: " + fileName, Toast.LENGTH_LONG).show();
                  }
              }
          }'''
          with open('app/src/main/java/com/vortexps3/emu/MainActivity.java', 'w', encoding='utf-8') as f:
              f.write(main_java.strip())

          # 6. Gradle Files
          root_gradle = '''buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }'''
          with open('build.gradle', 'w', encoding='utf-8') as f:
              f.write(root_gradle.strip())

          app_gradle = '''plugins { id 'com.android.application' }

          android {
              namespace 'com.vortexps3.emu'
              compileSdk 34

              defaultConfig {
                  applicationId "com.vortexps3.emu"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }'''
          with open('app/build.gradle', 'w', encoding='utf-8') as f:
              f.write(app_gradle.strip())

          with open('settings.gradle', 'w', encoding='utf-8') as f:
              f.write("include ':app'\n")

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile VortexPS3 Complete Emulator APK
        run: gradle assembleDebug

      - name: Upload Finished Modular APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-All-Drivers-Emulator
          path: app/build/outputs/apk/debug/app-debug.apk
          
