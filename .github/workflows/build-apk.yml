name: Build VortexPS3 Pro Emulator

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Graphic Tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build Complete Console UI with Hardware Selectors
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/vortexps3/emu
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # 1. Custom Icon
          convert -size 512x512 xc:#0A0E17 \
            -fill none -stroke "#00E5FF" -strokewidth 18 -draw "circle 256,256 256,70" \
            -fill none -stroke "#7928CA" -strokewidth 14 -draw "circle 256,256 256,130" \
            -fill white -stroke none -pointsize 130 -gravity center -annotate +0-10 "V3" \
            -fill "#00E5FF" -pointsize 32 -gravity south -annotate +0+60 "EMULATOR" \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # 2. Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="com.vortexps3.emu.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 3. Hardware Selectors Data (GPU, RAM, Resolution, DXVK, Proton)
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">VortexPS3 Emu</string>

              <!-- GPU Drivers -->
              <string-array name="gpu_drivers">
                  <item>Mesa Turnip v26.1.0 (Snapdragon Adreno 6xx/7xx)</item>
                  <item>Turnip v24.3.0 Aggressive (Snapdragon High FPS)</item>
                  <item>Turnip A8xx Hotfix (Snapdragon 8 Gen 3/4)</item>
                  <item>VirGL Universal (Mali / MediaTek / Dimensity)</item>
                  <item>System Default Mali Driver</item>
              </string-array>

              <!-- Resolution -->
              <string-array name="screen_resolutions">
                  <item>1280 x 720 (16:9 Standard - Recommended)</item>
                  <item>1920 x 1080 (1080p FHD - High End)</item>
                  <item>960 x 540 (qHD - Best Performance for Low-end)</item>
                  <item>1600 x 900 (HD+ Balanced)</item>
                  <item>800 x 600 (4:3 Classic)</item>
              </string-array>

              <!-- RAM Allocation -->
              <string-array name="ram_limits">
                  <item>4 GB (Recommended for 6GB/8GB Phones)</item>
                  <item>6 GB (For Heavy AAA PC Titles)</item>
                  <item>8 GB (High End 12GB+ RAM Phones)</item>
                  <item>2 GB (For 4GB RAM Low-end Phones)</item>
              </string-array>

              <!-- DXVK Engine -->
              <string-array name="dxvk_versions">
                  <item>DXVK 2.4.1-async (Best Smooth FPS)</item>
                  <item>DXVK 2.3.1 (Stable & Balanced)</item>
                  <item>DXVK 1.10.3 (DirectX 9 / Old Games Fix)</item>
                  <item>wined3d (Software Fallback)</item>
              </string-array>

              <!-- Proton / Compatibility Layer -->
              <string-array name="proton_layers">
                  <item>proton11.0-arm64x (Latest Best Compat)</item>
                  <item>proton10.0-arm64x-2 (AAA Games Stable)</item>
                  <item>proton9.0-arm64x-3 (Low Overheads)</item>
                  <item>wine10.0-x64-2 (Pure Wine Engine)</item>
                  <item>wine9.16-x64-2 (Classic Fallback)</item>
              </string-array>
          </resources>
          EOF

          # 4. Modern Dashboard Layout
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#060911"
              android:orientation="horizontal">

              <!-- Left Sidebar -->
              <LinearLayout
                  android:layout_width="230dp"
                  android:layout_height="match_parent"
                  android:background="#0C1322"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🌀 VORTEX-PS3"
                      android:textColor="#00E5FF"
                      android:textSize="22sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:text="BY Yash (AI VIDEO HUB)"
                      android:textColor="#5A6F87"
                      android:textSize="11sp" />

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginTop="16dp"
                      android:layout_marginBottom="20dp"
                      android:background="#1B2942" />

                  <Button
                      android:id="@+id/btnSelectExe"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="#00E5FF"
                      android:text="▶ Launch .EXE Game"
                      android:textColor="#000000"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnReset"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:background="#16233B"
                      android:text="⚙ Reset Defaults"
                      android:textColor="#FFFFFF" />
              </LinearLayout>

              <!-- Tuning Panel -->
              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:padding="24dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Device Hardware & Performance Setup"
                          android:textColor="#FFFFFF"
                          android:textSize="20sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="Tune GPU, Resolution, RAM, DXVK & Proton layer according to your smartphone"
                          android:textColor="#70849E"
                          android:textSize="13sp" />

                      <!-- 1. GPU Driver -->
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="20dp"
                          android:text="1. GPU DRIVER (Snapdragon / MediaTek / Mali)"
                          android:textColor="#00E5FF"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <Spinner
                          android:id="@+id/spnGpu"
                          android:layout_width="match_parent"
                          android:layout_height="48dp"
                          android:layout_marginTop="6dp"
                          android:background="#131D31"
                          android:entries="@array/gpu_drivers"
                          android:padding="10dp" />

                      <!-- 2. Resolution -->
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="16dp"
                          android:text="2. SCREEN RESOLUTION (Display Scale)"
                          android:textColor="#00E5FF"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <Spinner
                          android:id="@+id/spnResolution"
                          android:layout_width="match_parent"
                          android:layout_height="48dp"
                          android:layout_marginTop="6dp"
                          android:background="#131D31"
                          android:entries="@array/screen_resolutions"
                          android:padding="10dp" />

                      <!-- 3. RAM Limit -->
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="16dp"
                          android:text="3. RAM ALLOCATION (Container Memory)"
                          android:textColor="#00E5FF"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <Spinner
                          android:id="@+id/spnRam"
                          android:layout_width="match_parent"
                          android:layout_height="48dp"
                          android:layout_marginTop="6dp"
                          android:background="#131D31"
                          android:entries="@array/ram_limits"
                          android:padding="10dp" />

                      <!-- 4. DXVK Engine -->
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="16dp"
                          android:text="4. DIRECTX GRAPHICS ENGINE (DXVK)"
                          android:textColor="#00E5FF"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <Spinner
                          android:id="@+id/spnDxvk"
                          android:layout_width="match_parent"
                          android:layout_height="48dp"
                          android:layout_marginTop="6dp"
                          android:background="#131D31"
                          android:entries="@array/dxvk_versions"
                          android:padding="10dp" />

                      <!-- 5. Proton Layer -->
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="16dp"
                          android:text="5. COMPATIBILITY LAYER (Proton / Wine)"
                          android:textColor="#00E5FF"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <Spinner
                          android:id="@+id/spnProton"
                          android:layout_width="match_parent"
                          android:layout_height="48dp"
                          android:layout_marginTop="6dp"
                          android:background="#131D31"
                          android:entries="@array/proton_layers"
                          android:padding="10dp" />

                      <!-- Config Summary Box -->
                      <TextView
                          android:id="@+id/txtStatus"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="24dp"
                          android:background="#0D1627"
                          android:padding="14dp"
                          android:text="Profile: Tap 'Launch .EXE Game' to select and run your game file with this custom configuration."
                          android:textColor="#8AA0BE"
                          android:textSize="13sp" />
                  </LinearLayout>
              </ScrollView>
          </LinearLayout>
          EOF

          # 5. MainActivity Code
          cat << 'EOF' > app/src/main/java/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final int PICK_EXE_FILE = 202;
              private TextView txtStatus;
              private Spinner spnGpu, spnResolution, spnRam, spnDxvk, spnProton;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  txtStatus = findViewById(R.id.txtStatus);
                  spnGpu = findViewById(R.id.spnGpu);
                  spnResolution = findViewById(R.id.spnResolution);
                  spnRam = findViewById(R.id.spnRam);
                  spnDxvk = findViewById(R.id.spnDxvk);
                  spnProton = findViewById(R.id.spnProton);

                  Button btnSelectExe = findViewById(R.id.btnSelectExe);
                  btnSelectExe.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                      intent.setType("*/*");
                      startActivityForResult(Intent.createChooser(intent, "Choose .exe Game File"), PICK_EXE_FILE);
                  });

                  Button btnReset = findViewById(R.id.btnReset);
                  btnReset.setOnClickListener(v -> {
                      spnGpu.setSelection(0);
                      spnResolution.setSelection(0);
                      spnRam.setSelection(0);
                      spnDxvk.setSelection(0);
                      spnProton.setSelection(0);
                      Toast.makeText(this, "Reset to Recommended Settings", Toast.LENGTH_SHORT).show();
                  });
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK_EXE_FILE && resultCode == RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      String fileName = (uri != null) ? uri.getLastPathSegment() : "Game.exe";
                      String details = "Loaded: " + fileName + "\n"
                              + "• GPU: " + spnGpu.getSelectedItem() + "\n"
                              + "• Res: " + spnResolution.getSelectedItem() + "\n"
                              + "• RAM: " + spnRam.getSelectedItem() + "\n"
                              + "• DXVK: " + spnDxvk.getSelectedItem() + "\n"
                              + "• Layer: " + spnProton.getSelectedItem();
                      txtStatus.setText(details);
                      Toast.makeText(this, "Launching with custom profile...", Toast.LENGTH_LONG).show();
                  }
              }
          }
          EOF

          # 6. Gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }

          android {
              namespace 'com.vortexps3.emu'
              compileSdk 34

              defaultConfig {
                  applicationId "com.vortexps3.emu"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          echo "include ':app'" > settings.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build VortexPS3 APK
        run: gradle assembleDebug

      - name: Upload VortexPS3 Emulator
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-Tuning-Emulator
          path: app/build/outputs/apk/debug/app-debug.apk
          
