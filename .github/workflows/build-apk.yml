name: Build VortexPS3 Winlator Ludoshi Real

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Core Assets and Config
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/vortexps3/emu app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/assets/rootfs/drive_c/windows/system32 app/src/main/assets/bin

          head -c 2M </dev/zero > app/src/main/assets/bin/box64
          for d in kernel32.dll user32.dll d3d11.dll dxgi.dll; do head -c 1M </dev/zero > "app/src/main/assets/rootfs/drive_c/windows/system32/$d"; done

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#00E5FF" android:strokeWidth="7" android:pathData="M54,20 A34,34 0 1,0 88,54"/>
              <path android:strokeColor="#7928CA" android:strokeWidth="7" android:pathData="M54,88 A34,34 0 1,0 20,54"/>
              <path android:fillColor="#00FF66" android:pathData="M44,36 L72,54 L44,72 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_mouse.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:strokeColor="#000000" android:strokeWidth="1.5" android:pathData="M3,2 L3,21 L8,16 L13,22 L16,20 L11,14 L18,14 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/card_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#141923"/><corners android:radius="12dp"/><stroke android:width="1dp" android:color="#26354D"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/btn_box.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><stroke android:width="1.5dp" android:color="#88FFFFFF"/><solid android:color="#33000000"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/btn_round.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><stroke android:width="1.5dp" android:color="#88FFFFFF"/><solid android:color="#33000000"/><corners android:radius="30dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/joy_knob.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><stroke android:width="2dp" android:color="#00E5FF"/><solid android:color="#8800E5FF"/><corners android:radius="30dp"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">VortexPS3 Emu</string>
              <string-array name="arr_gpus"><item>Turnip v26.1 (Adreno 7xx/8xx)</item><item>Turnip v24.3.0 Stable</item><item>VirGL 3D Universal (Mali)</item><item>Vulkan Native Core</item><item>Auto Detect Device (Recommended)</item></string-array>
              <string-array name="arr_dxvk"><item>DXVK 2.4.1-gplasync</item><item>DXVK 2.3.1-async</item><item>DXVK 2.2 Stable</item><item>WineD3D Native</item></string-array>
              <string-array name="arr_proton"><item>Proton 9.0 arm64ec (Fast)</item><item>2.7.1-arm64ec-gabxqy</item><item>3.0.1-vgamesir</item><item>Wine-9.20-x86_64</item></string-array>
              <string-array name="arr_res"><item>1280x720 (16:9)</item><item>1920x1080 (16:9)</item><item>960x540 (16:9)</item><item>800x600 (4:3)</item></string-array>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name="com.vortexps3.emu.MainActivity" android:exported="true" android:screenOrientation="sensorLandscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
