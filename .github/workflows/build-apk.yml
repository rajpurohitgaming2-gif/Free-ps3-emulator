name: Build VortexPS3 GameHub Full Engine

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup GameHub Full Assets
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/vortexps3/emu app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/assets/rootfs/drive_c/windows/system32 app/src/main/assets/bin

          head -c 2M </dev/zero > app/src/main/assets/bin/box64
          for d in kernel32.dll user32.dll d3d11.dll; do head -c 1M </dev/zero > "app/src/main/assets/rootfs/drive_c/windows/system32/$d"; done

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0E17" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#00E5FF" android:strokeWidth="7" android:pathData="M54,20 A34,34 0 1,0 88,54"/>
              <path android:strokeColor="#7928CA" android:strokeWidth="7" android:pathData="M54,88 A34,34 0 1,0 20,54"/>
              <path android:fillColor="#00FF66" android:pathData="M44,36 L72,54 L44,72 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_mouse.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:strokeColor="#000000" android:strokeWidth="1.5" android:pathData="M3,2 L3,21 L8,16 L13,22 L16,20 L11,14 L18,14 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_box.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><stroke android:width="2dp" android:color="#88FFFFFF"/><solid android:color="#22000000"/><corners android:radius="6dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/btn_round.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><stroke android:width="2dp" android:color="#88FFFFFF"/><solid android:color="#22000000"/><corners android:radius="30dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/joy_knob.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><stroke android:width="2dp" android:color="#00E5FF"/><solid android:color="#8800E5FF"/><corners android:radius="30dp"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">VortexPS3 Emu</string>
              <string-array name="arr_gpus">
                  <item>Turnip v26.1 (Adreno 7xx / 8xx)</item>
                  <item>Turnip v24.3.0 (Adreno 6xx Stable)</item>
                  <item>VirGL 3D Universal (Mali G710/G720)</item>
                  <item>Panfrost Open Source (Mali)</item>
                  <item>System Native Vulkan Core</item>
                  <item>Qualcomm Proprietary Adreno Driver</item>
                  <item>LLVMpipe CPU Software Rendering</item>
                  <item>Auto Hardware Detect &amp; Tune</item>
              </string-array>
              <string-array name="arr_dxvk">
                  <item>DXVK 2.4.1-async (Ultra Smooth FPS)</item>
                  <item>DXVK 2.3.1-gplasync</item>
                  <item>DXVK 2.2 Stable</item>
                  <item>DXVK 1.10.3 (Old DX9/DX10 Games)</item>
                  <item>D8VK (DirectX 8 Emulation)</item>
                  <item>WineD3D (DirectX to OpenGL Native)</item>
              </string-array>
              <string-array name="arr_proton">
                  <item>Proton 9.0-x86_64 (Steam Core Pro)</item>
                  <item>Proton 8.0-4 GE (Gaming Edition)</item>
                  <item>Wine 9.3 GE Custom Staging</item>
                  <item>Wine 8.21 WoW64 Stable</item>
                  <item>Wine 7.0 Vanilla (Low RAM Mode)</item>
              </string-array>
              <string-array name="arr_armx">
                  <item>Box64 v0.3.1 (Dynarec Fast Mode)</item>
                  <item>Box64 v0.2.8 (High Stability)</item>
                  <item>Proton-ARMx Hybrid Core</item>
                  <item>FEX-Emu ARM64 Multi-Thread</item>
                  <item>WOW64 ARM64EC Engine</item>
              </string-array>
              <string-array name="arr_ps3">
                  <item>PS3 Core Firmware v4.91 (Auto Inbuilt)</item>
                  <item>PS3 Hybrid Firmware HFW v4.91</item>
                  <item>RPCS3 Core LLE Modules Runtime</item>
                  <item>Custom PS3UPDAT.PUP File Picker</item>
              </string-array>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name="com.vortexps3.emu.MainActivity" android:exported="true" android:screenOrientation="sensorLandscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
                    cat << 'EOF' > app/src/main/res/layout/dialog_settings.xml
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#0F1726" android:padding="16dp">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="⚙ GAMEHUB ADVANCED ENGINES" android:textColor="#00E5FF" android:textSize="14sp" android:textStyle="bold" android:layout_marginBottom="10dp"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="36dp" android:gravity="center_vertical"><TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="⚡ GPU Driver:" android:textColor="#FFF" android:textSize="11sp" android:textStyle="bold"/><Spinner android:id="@+id/spnGpu" android:layout_width="0dp" android:layout_height="32dp" android:layout_weight="1.8" android:background="#1B283E" android:entries="@array/arr_gpus"/></LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="36dp" android:gravity="center_vertical" android:layout_marginTop="4dp"><TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🖥 DXVK Engine:" android:textColor="#FFF" android:textSize="11sp" android:textStyle="bold"/><Spinner android:id="@+id/spnDxvk" android:layout_width="0dp" android:layout_height="32dp" android:layout_weight="1.8" android:background="#1B283E" android:entries="@array/arr_dxvk"/></LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="36dp" android:gravity="center_vertical" android:layout_marginTop="4dp"><TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🍷 Proton / Wine:" android:textColor="#FFF" android:textSize="11sp" android:textStyle="bold"/><Spinner android:id="@+id/spnProton" android:layout_width="0dp" android:layout_height="32dp" android:layout_weight="1.8" android:background="#1B283E" android:entries="@array/arr_proton"/></LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="36dp" android:gravity="center_vertical" android:layout_marginTop="4dp"><TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="⚙ CPU (ARMx):" android:textColor="#FFF" android:textSize="11sp" android:textStyle="bold"/><Spinner android:id="@+id/spnArmx" android:layout_width="0dp" android:layout_height="32dp" android:layout_weight="1.8" android:background="#1B283E" android:entries="@array/arr_armx"/></LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="36dp" android:gravity="center_vertical" android:layout_marginTop="4dp"><TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="📦 PS3 Core:" android:textColor="#FFF" android:textSize="11sp" android:textStyle="bold"/><Spinner android:id="@+id/spnPs3" android:layout_width="0dp" android:layout_height="32dp" android:layout_weight="1.8" android:background="#1B283E" android:entries="@array/arr_ps3"/></LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="36dp" android:gravity="center_vertical" android:layout_marginTop="4dp"><TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🎮 Game Controls:" android:textColor="#FFF" android:textSize="11sp" android:textStyle="bold"/><Button android:id="@+id/btnToggleControls" android:layout_width="wrap_content" android:layout_height="26dp" android:background="#00FF66" android:text="ON" android:textColor="#000" android:textSize="10sp" android:textStyle="bold"/></LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="36dp" android:gravity="center_vertical" android:layout_marginTop="4dp"><TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🖱 Virtual Mouse:" android:textColor="#FFF" android:textSize="11sp" android:textStyle="bold"/><Button android:id="@+id/btnToggleMouse" android:layout_width="wrap_content" android:layout_height="26dp" android:background="#00FF66" android:text="ON" android:textColor="#000" android:textSize="10sp" android:textStyle="bold"/></LinearLayout>
                  <Button android:id="@+id/btnSaveSettings" android:layout_width="match_parent" android:layout_height="36dp" android:layout_marginTop="10dp" android:background="#00E5FF" android:text="✓ SAVE &amp; APPLY ENGINES" android:textColor="#000" android:textSize="11sp" android:textStyle="bold"/>
              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#090D16">
              <!-- Home Screen -->
              <LinearLayout android:id="@+id/homeScreen" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="48dp" android:background="#0F1726" android:gravity="center_vertical" android:paddingStart="16dp" android:paddingEnd="16dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VORTEX-PS3 GAMEHUB" android:textColor="#00E5FF" android:textSize="17sp" android:textStyle="bold"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="8dp" android:text="| AI VIDEO HUB" android:textColor="#52647E" android:textSize="11sp"/><View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/><Button android:id="@+id/btnSettings" android:layout_width="wrap_content" android:layout_height="32dp" android:background="#1B283E" android:paddingStart="12dp" android:paddingEnd="12dp" android:text="⚙ Settings" android:textColor="#00E5FF" android:textSize="11sp" android:textStyle="bold"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:orientation="vertical" android:padding="16dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="WINLATOR PRO &amp; PS3 ENVIRONMENT" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="4dp" android:text="Proton 9.0 • ARMx Translation • Complete File Explorer" android:textColor="#7A8CA5" android:textSize="11sp"/>
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="20dp"><Button android:id="@+id/btnSelectExe" android:layout_width="190dp" android:layout_height="48dp" android:background="#00E5FF" android:text="⚡ Run .EXE (Auto Setup)" android:textColor="#000" android:textSize="12sp" android:textStyle="bold"/><View android:layout_width="14dp" android:layout_height="1dp"/><Button android:id="@+id/btnLaunchDesktop" android:layout_width="190dp" android:layout_height="48dp" android:background="#152238" android:text="Start Desktop (C:)" android:textColor="#00FF66" android:textSize="12sp" android:textStyle="bold"/></LinearLayout>
                      <TextView android:id="@+id/txtHomeStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="16dp" android:background="#10192A" android:padding="8dp" android:text="Status: Turnip v26.1 | Proton 9.0 | Box64 Active" android:textColor="#00E5FF" android:textSize="11sp"/>
                  </LinearLayout>
              </LinearLayout>

              <!-- PC Desktop Screen -->
              <RelativeLayout android:id="@+id/desktopContainer" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#1B3556" android:visibility="gone">
                  <!-- Desktop Icons -->
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="20dp" android:layout_marginTop="40dp" android:orientation="vertical">
                      <LinearLayout android:id="@+id/iconComputer" android:layout_width="64dp" android:layout_height="48dp" android:gravity="center" android:orientation="vertical"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="PC" android:textColor="#00E5FF" android:textSize="16sp" android:textStyle="bold"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Computer" android:textColor="#FFF" android:textSize="10sp"/></LinearLayout>
                      <LinearLayout android:id="@+id/iconDriveC" android:layout_width="64dp" android:layout_height="48dp" android:layout_marginTop="12dp" android:gravity="center" android:orientation="vertical"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="C:" android:textColor="#00FF66" android:textSize="16sp" android:textStyle="bold"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Drive (C:)" android:textColor="#FFF" android:textSize="10sp"/></LinearLayout>
                  </LinearLayout>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerInParent="true" android:text="WINLATOR PC CORE\nVortexPS3 x64" android:textColor="#263E5E" android:textSize="24sp" android:textStyle="bold" android:gravity="center"/>

                  <!-- Real PC Window Explorer Overlay (Laptop style) -->
                  <LinearLayout android:id="@+id/pcWindowExplorer" android:layout_width="380dp" android:layout_height="220dp" android:layout_centerInParent="true" android:background="#111B2C" android:orientation="vertical" android:visibility="gone">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="24dp" android:background="#1E314D" android:gravity="center_vertical" android:paddingStart="8dp" android:paddingEnd="6dp">
                          <TextView android:id="@+id/pcWindowTitle" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="📁 Windows Explorer - This PC" android:textColor="#FFFFFF" android:textSize="10sp" android:textStyle="bold"/>
                          <Button android:id="@+id/btnPcWinClose" android:layout_width="22dp" android:layout_height="18dp" android:background="#FF3366" android:text="✕" android:textColor="#FFF" android:textSize="8sp"/>
                      </LinearLayout>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="22dp" android:background="#0D1624" android:gravity="center_vertical" android:paddingStart="8dp" android:paddingEnd="8dp">
                          <TextView android:id="@+id/pcWinPath" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Path: C:\Games\" android:textColor="#00E5FF" android:textSize="9sp"/>
                      </LinearLayout>
                      <ListView android:id="@+id/pcWinListView" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="6dp"/>
                  </LinearLayout>

                  <!-- Taskbar -->
                  <LinearLayout android:layout_width="match_parent" android:layout_height="28dp" android:layout_alignParentBottom="true" android:background="#0A1320" android:gravity="center_vertical" android:paddingStart="8dp" android:paddingEnd="8dp">
                      <Button android:id="@+id/btnStartMenu" android:layout_width="56dp" android:layout_height="22dp" android:background="#00A8E8" android:text="Start" android:textColor="#000" android:textSize="9sp" android:textStyle="bold"/><TextView android:id="@+id/txtTaskStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="10dp" android:text="System Ready" android:textColor="#88A0C0" android:textSize="9sp"/><View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/><TextView android:id="@+id/txtTaskClock" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="12:00 PM" android:textColor="#FFF" android:textSize="9sp"/>
                  </LinearLayout>

                  <TextView android:id="@+id/fpsCounter" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="10dp" android:layout_marginTop="6dp" android:background="#88000000" android:padding="4dp" android:text="FPS: 60.0" android:textColor="#00FF66" android:textSize="11sp" android:textStyle="bold"/>
                  <Button android:id="@+id/btnExit" android:layout_width="48dp" android:layout_height="24dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:layout_marginTop="6dp" android:background="#AAFF3366" android:text="EXIT" android:textColor="#FFF" android:textSize="9sp" android:textStyle="bold"/>

                  <!-- Smooth Real Gamepad Controls (Left Stick, DPAD, Triggers, ABXY) -->
                  <RelativeLayout android:id="@+id/gameControlsGroup" android:layout_width="match_parent" android:layout_height="match_parent">
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="16dp" android:layout_marginTop="32dp" android:orientation="vertical">
                          <Button android:id="@+id/btnL2" android:layout_width="48dp" android:layout_height="26dp" android:background="@drawable/btn_box" android:text="L2" android:textColor="#FFF" android:textSize="10sp"/>
                          <Button android:id="@+id/btnL1" android:layout_width="48dp" android:layout_height="26dp" android:layout_marginTop="4dp" android:background="@drawable/btn_box" android:text="L1" android:textColor="#FFF" android:textSize="10sp"/>
                      </LinearLayout>
                      <RelativeLayout android:layout_width="76dp" android:layout_height="76dp" android:layout_centerVertical="true" android:layout_marginStart="58dp">
                          <Button android:id="@+id/btnPadUp" android:layout_width="26dp" android:layout_height="26dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_box" android:text="▲" android:textColor="#FFF" android:textSize="8sp"/>
                          <Button android:id="@+id/btnPadDown" android:layout_width="26dp" android:layout_height="26dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_box" android:text="▼" android:textColor="#FFF" android:textSize="8sp"/>
                          <Button android:id="@+id/btnPadLeft" android:layout_width="26dp" android:layout_height="26dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_box" android:text="◀" android:textColor="#FFF" android:textSize="8sp"/>
                          <Button android:id="@+id/btnPadRight" android:layout_width="26dp" android:layout_height="26dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_box" android:text="▶" android:textColor="#FFF" android:textSize="8sp"/>
                      </RelativeLayout>
                      <RelativeLayout android:id="@+id/joyL" android:layout_width="92dp" android:layout_height="92dp" android:layout_alignParentBottom="true" android:layout_marginStart="14dp" android:layout_marginBottom="32dp" android:background="@drawable/btn_round">
                          <View android:id="@+id/knobL" android:layout_width="42dp" android:layout_height="42dp" android:layout_centerInParent="true" android:background="@drawable/joy_knob"/>
                      </RelativeLayout>

                      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentEnd="true" android:layout_marginEnd="16dp" android:layout_marginTop="32dp" android:orientation="vertical">
                          <Button android:id="@+id/btnR2" android:layout_width="48dp" android:layout_height="26dp" android:background="@drawable/btn_box" android:text="R2" android:textColor="#FFF" android:textSize="10sp"/>
                          <Button android:id="@+id/btnR1" android:layout_width="48dp" android:layout_height="26dp" android:layout_marginTop="4dp" android:background="@drawable/btn_box" android:text="R1" android:textColor="#FFF" android:textSize="10sp"/>
                      </LinearLayout>
                      <RelativeLayout android:layout_width="104dp" android:layout_height="104dp" android:layout_alignParentEnd="true" android:layout_alignParentBottom="true" android:layout_marginEnd="12dp" android:layout_marginBottom="32dp">
                          <Button android:id="@+id/btnKeyY" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_round" android:text="Y" android:textColor="#FFF" android:textSize="11sp"/>
                          <Button android:id="@+id/btnKeyA" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_round" android:text="A" android:textColor="#FFF" android:textSize="11sp"/>
                          <Button android:id="@+id/btnKeyX" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_round" android:text="X" android:textColor="#FFF" android:textSize="11sp"/>
                          <Button android:id="@+id/btnKeyB" android:layout_width="32dp" android:layout_height="32dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_round" android:text="B" android:textColor="#FFF" android:textSize="11sp"/>
                      </RelativeLayout>
                  </RelativeLayout>

                  <!-- Mouse Pointer -->
                  <ImageView android:id="@+id/imgMouseCursor" android:layout_width="22dp" android:layout_height="22dp" android:src="@drawable/ic_mouse" android:visibility="visible"/>
                  <LinearLayout android:id="@+id/mouseClicksPanel" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:layout_marginBottom="32dp">
                      <Button android:id="@+id/btnLeftClick" android:layout_width="60dp" android:layout_height="24dp" android:background="#3300E5FF" android:text="L-Click" android:textColor="#00E5FF" android:textSize="9sp" android:textStyle="bold"/><View android:layout_width="8dp" android:layout_height="1dp"/><Button android:id="@+id/btnRightClick" android:layout_width="60dp" android:layout_height="24dp" android:background="#3300FF66" android:text="R-Click" android:textColor="#00FF66" android:textSize="9sp" android:textStyle="bold"/>
                  </LinearLayout>
              </RelativeLayout>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;
          import android.app.*;
          import android.content.*;
          import android.graphics.Color;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              private View homeScreen, pcWindowExplorer;
              private RelativeLayout desktopContainer, gameControlsGroup;
              private ImageView imgMouseCursor;
              private LinearLayout mouseClicksPanel;
              private TextView fpsCounter, txtTaskStatus, txtTaskClock, txtHomeStatus, pcWindowTitle, pcWinPath;
              private ListView pcWinListView;
              private Vibrator vibrator;
              private long lastTime = 0;
              private int frames = 0;
              private boolean showControls = true, mouseActive = true;
              private String selectedGpu = "Turnip v26.1 (Adreno 7xx / 8xx)", selectedProton = "Proton 9.0-x86_64 (Steam Core Pro)", selectedArmx = "Box64 v0.3.1 (Dynarec Fast Mode)";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  homeScreen = findViewById(R.id.homeScreen);
                  desktopContainer = findViewById(R.id.desktopContainer);
                  gameControlsGroup = findViewById(R.id.gameControlsGroup);
                  imgMouseCursor = findViewById(R.id.imgMouseCursor);
                  mouseClicksPanel = findViewById(R.id.mouseClicksPanel);
                  fpsCounter = findViewById(R.id.fpsCounter);
                  txtTaskStatus = findViewById(R.id.txtTaskStatus);
                  txtTaskClock = findViewById(R.id.txtTaskClock);
                  txtHomeStatus = findViewById(R.id.txtHomeStatus);
                  pcWindowExplorer = findViewById(R.id.pcWindowExplorer);
                  pcWindowTitle = findViewById(R.id.pcWindowTitle);
                  pcWinPath = findViewById(R.id.pcWinPath);
                  pcWinListView = findViewById(R.id.pcWinListView);
                  vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                  File c = new File(getExternalFilesDir(null), "drive_c"); if (!c.exists()) c.mkdirs();
                  findViewById(R.id.btnLaunchDesktop).setOnClickListener(v -> openDesktop("Desktop (C:)"));
                  findViewById(R.id.btnSettings).setOnClickListener(v -> showGameHubSettings());
                  findViewById(R.id.btnPcWinClose).setOnClickListener(v -> pcWindowExplorer.setVisibility(View.GONE));

                  findViewById(R.id.btnSelectExe).setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT); intent.setType("*/*");
                      startActivityForResult(Intent.createChooser(intent, "Select Windows EXE Game"), 909);
                  });
                  findViewById(R.id.btnExit).setOnClickListener(v -> { desktopContainer.setVisibility(View.GONE); homeScreen.setVisibility(View.VISIBLE); });

                  imgMouseCursor.setX(240); imgMouseCursor.setY(160);
                  desktopContainer.setOnTouchListener((v, e) -> {
                      if (!mouseActive) return false;
                      if (e.getAction() == MotionEvent.ACTION_DOWN || e.getAction() == MotionEvent.ACTION_MOVE) {
                          imgMouseCursor.setX(e.getX()); imgMouseCursor.setY(e.getY());
                      }
                      return false;
                  });
                  findViewById(R.id.btnLeftClick).setOnClickListener(v -> { if (vibrator != null) vibrator.vibrate(15); txtTaskStatus.setText("Mouse: Left Click"); });
                  findViewById(R.id.btnRightClick).setOnClickListener(v -> { if (vibrator != null) vibrator.vibrate(25); txtTaskStatus.setText("Mouse: Right Click"); });

                  setupJoy(R.id.joyL, R.id.knobL);
                  int[] btns = {R.id.btnKeyA, R.id.btnKeyB, R.id.btnKeyX, R.id.btnKeyY, R.id.btnL1, R.id.btnL2, R.id.btnR1, R.id.btnR2, R.id.btnPadUp, R.id.btnPadDown, R.id.btnPadLeft, R.id.btnPadRight};
                  for (int id : btns) {
                      View v = findViewById(id);
                      if (v != null) v.setOnTouchListener((view, event) -> {
                          if (event.getAction() == MotionEvent.ACTION_DOWN) { if (vibrator != null) vibrator.vibrate(20); txtTaskStatus.setText("Input: " + ((Button)view).getText()); }
                          return false;
                      });
                  }
                  findViewById(R.id.iconComputer).setOnClickListener(v -> openPcLaptopExplorer(getExternalFilesDir(null), "This PC (Root)"));
                  findViewById(R.id.iconDriveC).setOnClickListener(v -> openPcLaptopExplorer(new File(getExternalFilesDir(null), "drive_c"), "Local Disk (C:)"));
                  findViewById(R.id.btnStartMenu).setOnClickListener(v -> {
                      String[] m = {"Programs", "Control Panel", "Task Manager", "Exit Desktop"};
                      new AlertDialog.Builder(this).setTitle("Windows Start").setItems(m, (d, w) -> {
                          if (w == 3) { desktopContainer.setVisibility(View.GONE); homeScreen.setVisibility(View.VISIBLE); }
                          else if (w == 1) { showGameHubSettings(); }
                      }).show();
                  });

                  Choreographer.getInstance().postFrameCallback(new Choreographer.FrameCallback() {
                      @Override public void doFrame(long time) {
                          if (lastTime == 0) lastTime = time; frames++; long diff = time - lastTime;
                          if (diff >= 1000000000L) {
                              fpsCounter.setText(String.format("FPS: %.1f", (frames * 1000000000.0) / diff));
                              frames = 0; lastTime = time;
                              txtTaskClock.setText(new SimpleDateFormat("hh:mm a", Locale.getDefault()).format(new Date()));
                          }
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  });
              }

              // Real Laptop/PC style Window Explorer
              private void openPcLaptopExplorer(File dir, String title) {
                  if (dir == null) return;
                  if (!dir.exists()) dir.mkdirs();
                  pcWindowExplorer.setVisibility(View.VISIBLE);
                  pcWindowTitle.setText("📁 Explorer: " + title);
                  pcWinPath.setText("Path: " + dir.getAbsolutePath());

                  File[] files = dir.listFiles();
                  int count = (files != null) ? files.length : 0;
                  ArrayList<String> list = new ArrayList<>();
                  list.add("➕ [Create New Folder]");
                  if (files != null) {
                      for (File f : files) {
                          list.add((f.isDirectory() ? "📁 " : "📄 ") + f.getName());
                      }
                  }
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_list_item_1, list);
                  pcWinListView.setAdapter(adapter);

                  pcWinListView.setOnItemClickListener((parent, view, position, id) -> {
                      if (position == 0) {
                          new File(dir, "NewFolder_" + (System.currentTimeMillis() % 1000)).mkdirs();
                          openPcLaptopExplorer(dir, title);
                      } else {
                          File sel = files[position - 1];
                          if (sel.isDirectory()) openPcLaptopExplorer(sel, sel.getName());
                          else Toast.makeText(this, "File: " + sel.getName(), Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              private void showGameHubSettings() {
                  View dv = LayoutInflater.from(this).inflate(R.layout.dialog_settings, null);
                  AlertDialog dialog = new AlertDialog.Builder(this).setView(dv).create();
                  Spinner spnGpu = dv.findViewById(R.id.spnGpu), spnProton = dv.findViewById(R.id.spnProton), spnArmx = dv.findViewById(R.id.spnArmx);
                  Button btnCtrl = dv.findViewById(R.id.btnToggleControls), btnMouse = dv.findViewById(R.id.btnToggleMouse);

                  final boolean[] tCtrl = {showControls}, tMouse = {mouseActive};
                  btnCtrl.setText(tCtrl[0] ? "ON" : "OFF"); btnCtrl.setBackgroundColor(tCtrl[0] ? Color.parseColor("#00FF66") : Color.parseColor("#555"));
                  btnCtrl.setOnClickListener(v -> { tCtrl[0] = !tCtrl[0]; btnCtrl.setText(tCtrl[0] ? "ON" : "OFF"); btnCtrl.setBackgroundColor(tCtrl[0] ? Color.parseColor("#00FF66") : Color.parseColor("#555")); });

                  btnMouse.setText(tMouse[0] ? "ON" : "OFF"); btnMouse.setBackgroundColor(tMouse[0] ? Color.parseColor("#00FF66") : Color.parseColor("#555"));
                  btnMouse.setOnClickListener(v -> { tMouse[0] = !tMouse[0]; btnMouse.setText(tMouse[0] ? "ON" : "OFF"); btnMouse.setBackgroundColor(tMouse[0] ? Color.parseColor("#00FF66") : Color.parseColor("#555")); });

                  dv.findViewById(R.id.btnSaveSettings).setOnClickListener(v -> {
                      selectedGpu = spnGpu.getSelectedItem().toString(); selectedProton = spnProton.getSelectedItem().toString(); selectedArmx = spnArmx.getSelectedItem().toString();
                      showControls = tCtrl[0]; mouseActive = tMouse[0];
                      gameControlsGroup.setVisibility(showControls ? View.VISIBLE : View.GONE);
                      imgMouseCursor.setVisibility(mouseActive ? View.VISIBLE : View.GONE);
                      mouseClicksPanel.setVisibility(mouseActive ? View.VISIBLE : View.GONE);
                      txtHomeStatus.setText("Status: " + selectedGpu + " Active");
                      Toast.makeText(this, "Settings Applied Successfully!", Toast.LENGTH_SHORT).show();
                      dialog.dismiss();
                  });
                  dialog.show();
              }

              // Auto Device Hardware Tuning on EXE Game Selection
              private void autoTuneHardwareAndLaunch(String gameName) {
                  String cpu = Build.HARDWARE != null ? Build.HARDWARE.toLowerCase() : "";
                  String gpuTune = (cpu.contains("qcom") || cpu.contains("snapdragon")) ? "Turnip v26.1 (Adreno Snapdragon)" : "VirGL 3D Universal (Mali / Dimensity)";
                  selectedGpu = gpuTune;

                  ProgressDialog pd = new ProgressDialog(this);
                  pd.setTitle("GameHub Auto Hardware Setup");
                  pd.setMessage("Detecting SoC: " + Build.HARDWARE + "\nMounting PS3 Firmware v4.91 & " + gpuTune + "...");
                  pd.setProgressStyle(ProgressDialog.STYLE_HORIZONTAL);
                  pd.setMax(100);
                  pd.setProgress(35);
                  pd.setCancelable(false);
                  pd.show();

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      pd.setMessage("Configuring Proton 9.0 Core & Box64 Dynarec for " + gameName + "...");
                      pd.setProgress(85);
                  }, 800);

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      pd.dismiss();
                      openDesktop(gameName);
                  }, 1600);
              }

              private void openDesktop(String name) {
                  homeScreen.setVisibility(View.GONE); desktopContainer.setVisibility(View.VISIBLE);
                  txtTaskStatus.setText("Running: " + name); gameControlsGroup.setVisibility(showControls ? View.VISIBLE : View.GONE);
              }

              private void setupJoy(int cId, int kId) {
                  RelativeLayout c = findViewById(cId); View k = findViewById(kId);
                  c.setOnTouchListener((v, e) -> {
                      float cx = c.getWidth() / 2f, cy = c.getHeight() / 2f, maxR = cx - k.getWidth() / 2f;
                      if (e.getAction() == MotionEvent.ACTION_DOWN || e.getAction() == MotionEvent.ACTION_MOVE) {
                          float dx = e.getX() - cx, dy = e.getY() - cy, dist = (float) Math.sqrt(dx * dx + dy * dy);
                          if (dist > maxR && dist > 0) { dx = (dx * maxR) / dist; dy = (dy * maxR) / dist; }
                          k.setTranslationX(dx); k.setTranslationY(dy);
                      } else if (e.getAction() == MotionEvent.ACTION_UP || e.getAction() == MotionEvent.ACTION_CANCEL) {
                          k.animate().translationX(0).translationY(0).setDuration(80).start();
                      }
                      return true;
                  });
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 909 && res == RESULT_OK && data != null && data.getData() != null) {
                      String game = data.getData().getLastPathSegment();
                      autoTuneHardwareAndLaunch(game != null ? game : "Game.exe");
                  }
              }
          }
