                                    cat << 'EOF' > app/src/main/java/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;
          import android.app.*;
          import android.content.*;
          import android.graphics.Color;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              private RelativeLayout containersScreen, containerEditScreen, desktopContainer, gameControlsGroup;
              private LinearLayout pcWindowComputer, mouseClicksPanel;
              private ImageView imgMouseCursor;
              private TextView fpsCounter, txtTaskClock, hudDevice, txtAddressPath, txtStatusBar, txtCardSub;
              private ListView pcListView;
              private Vibrator vibrator;
              private long lastTime = 0;
              private int frames = 0;
              private boolean showControls = true, mouseActive = true;
              private String selectedGpu = "Turnip v26.1 (Adreno)", selectedProton = "proton-9.0-arm64ec";
              private File currentDir = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  containersScreen = findViewById(R.id.containersScreen);
                  containerEditScreen = findViewById(R.id.containerEditScreen);
                  desktopContainer = findViewById(R.id.desktopContainer);
                  gameControlsGroup = findViewById(R.id.gameControlsGroup);
                  pcWindowComputer = findViewById(R.id.pcWindowComputer);
                  mouseClicksPanel = findViewById(R.id.mouseClicksPanel);
                  imgMouseCursor = findViewById(R.id.imgMouseCursor);
                  fpsCounter = findViewById(R.id.fpsCounter);
                  txtTaskClock = findViewById(R.id.txtTaskClock);
                  hudDevice = findViewById(R.id.hudDevice);
                  txtAddressPath = findViewById(R.id.txtAddressPath);
                  txtStatusBar = findViewById(R.id.txtStatusBar);
                  txtCardSub = findViewById(R.id.txtCardSub);
                  vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                  initDriveFileSystem();

                  // Run Button (▶) on Card
                  findViewById(R.id.btnRunDesktop).setOnClickListener(v -> openDesktop());

                  // Edit Button (✏) on Card
                  findViewById(R.id.btnEditContainer).setOnClickListener(v -> {
                      containersScreen.setVisibility(View.GONE);
                      containerEditScreen.setVisibility(View.VISIBLE);
                  });
                  findViewById(R.id.btnEditBack).setOnClickListener(v -> {
                      containerEditScreen.setVisibility(View.GONE);
                      containersScreen.setVisibility(View.VISIBLE);
                  });
                  findViewById(R.id.btnSaveConfig).setOnClickListener(v -> {
                      Spinner spnGpu = findViewById(R.id.spnGraphics);
                      Spinner spnProton = findViewById(R.id.spnProton);
                      selectedGpu = spnGpu.getSelectedItem().toString();
                      selectedProton = spnProton.getSelectedItem().toString();
                      txtCardSub.setText(selectedProton + " • 1280x720");
                      containerEditScreen.setVisibility(View.GONE);
                      containersScreen.setVisibility(View.VISIBLE);
                      Toast.makeText(this, "Container-1 Saved!", Toast.LENGTH_SHORT).show();
                  });

                  findViewById(R.id.btnProperties).setOnClickListener(v -> Toast.makeText(this, "Container-1: Ready", Toast.LENGTH_SHORT).show());
                  findViewById(R.id.btnMore).setOnClickListener(v -> Toast.makeText(this, "Duplicate / Export Container", Toast.LENGTH_SHORT).show());
                  findViewById(R.id.fabAdd).setOnClickListener(v -> Toast.makeText(this, "Create New Container", Toast.LENGTH_SHORT).show());

                  findViewById(R.id.btnExit).setOnClickListener(v -> {
                      desktopContainer.setVisibility(View.GONE);
                      containersScreen.setVisibility(View.VISIBLE);
                  });

                  // Desktop Navigation & Tree View
                  findViewById(R.id.treeComputer).setOnClickListener(v -> loadComputerRoot());
                  findViewById(R.id.treeDriveC).setOnClickListener(v -> loadDir(new File(getExternalFilesDir(null), "drive_c"), "Computer > C:"));
                  findViewById(R.id.treeDriveD).setOnClickListener(v -> loadDir(new File(getExternalFilesDir(null), "drive_c/windows"), "Computer > D:"));
                  findViewById(R.id.treeDriveZ).setOnClickListener(v -> loadDir(getExternalFilesDir(null), "Computer > Z:"));

                  findViewById(R.id.toolUp).setOnClickListener(v -> {
                      if (currentDir != null && currentDir.getParentFile() != null) {
                          loadDir(currentDir.getParentFile(), "Computer > " + currentDir.getParentFile().getName());
                      } else {
                          loadComputerRoot();
                      }
                  });

                  findViewById(R.id.toolNewFolder).setOnClickListener(v -> {
                      if (currentDir != null) {
                          new File(currentDir, "NewFolder_" + (System.currentTimeMillis() % 1000)).mkdirs();
                          loadDir(currentDir, txtAddressPath.getText().toString());
                      }
                  });

                  imgMouseCursor.setX(240); imgMouseCursor.setY(160);
                  desktopContainer.setOnTouchListener((v, e) -> {
                      if (!mouseActive) return false;
                      if (e.getAction() == MotionEvent.ACTION_DOWN || e.getAction() == MotionEvent.ACTION_MOVE) {
                          imgMouseCursor.setX(e.getX()); imgMouseCursor.setY(e.getY());
                      }
                      return false;
                  });
                  findViewById(R.id.btnLeftClick).setOnClickListener(v -> { if (vibrator != null) vibrator.vibrate(15); });
                  findViewById(R.id.btnRightClick).setOnClickListener(v -> { if (vibrator != null) vibrator.vibrate(25); });

                  setupJoy(R.id.joyL, R.id.knobL);
                  setupJoy(R.id.joyR, R.id.knobR);

                  int[] btns = {R.id.btnKeyA, R.id.btnKeyB, R.id.btnKeyX, R.id.btnKeyY, R.id.btnL1, R.id.btnL2, R.id.btnR1, R.id.btnR2};
                  for (int id : btns) {
                      View v = findViewById(id);
                      if (v != null) v.setOnTouchListener((view, event) -> {
                          if (event.getAction() == MotionEvent.ACTION_DOWN && vibrator != null) vibrator.vibrate(20);
                          return false;
                      });
                  }

                  findViewById(R.id.btnStartMenu).setOnClickListener(v -> {
                      String[] m = {"💻 Computer", "⚙ Container Settings", "🎮 Toggle Controls", "❌ Exit Desktop"};
                      new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert).setTitle("Start").setItems(m, (d, w) -> {
                          if (w == 0) loadComputerRoot();
                          else if (w == 1) { desktopContainer.setVisibility(View.GONE); containerEditScreen.setVisibility(View.VISIBLE); }
                          else if (w == 2) { showControls = !showControls; gameControlsGroup.setVisibility(showControls ? View.VISIBLE : View.GONE); }
                          else if (w == 3) { desktopContainer.setVisibility(View.GONE); containersScreen.setVisibility(View.VISIBLE); }
                      }).show();
                  });

                  Choreographer.getInstance().postFrameCallback(new Choreographer.FrameCallback() {
                      @Override public void doFrame(long time) {
                          if (lastTime == 0) lastTime = time; frames++; long diff = time - lastTime;
                          if (diff >= 1000000000L) {
                              fpsCounter.setText(String.format("FPS: %.1f", (frames * 1000000000.0) / diff));
                              frames = 0; lastTime = time;
                              txtTaskClock.setText(new SimpleDateFormat("hh:mm a", Locale.getDefault()).format(new Date()));
                          }
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  });
              }

              private void initDriveFileSystem() {
                  File c = new File(getExternalFilesDir(null), "drive_c");
                  File win = new File(c, "windows/system32");
                  File prog = new File(c, "Program Files/Games");
                  win.mkdirs(); prog.mkdirs();
                  try {
                      new File(win, "kernel32.dll").createNewFile();
                      new File(win, "d3d11.dll").createNewFile();
                      new File(win, "dxgi.dll").createNewFile();
                      new File(prog, "GTA_V.exe").createNewFile();
                  } catch (Exception ignored) {}
              }

              private void loadComputerRoot() {
                  currentDir = null;
                  txtAddressPath.setText("Computer > ");
                  txtStatusBar.setText("4 Items");

                  ArrayList<String[]> drives = new ArrayList<>();
                  drives.add(new String[]{"💾 C:", "Local Drive", "", ""});
                  drives.add(new String[]{"💾 D:", "Local Drive", "", ""});
                  drives.add(new String[]{"💾 E:", "Local Drive", "", ""});
                  drives.add(new String[]{"💾 Z:", "Local Drive", "", ""});

                  renderList(drives, true);
              }

              private void loadDir(File dir, String displayPath) {
                  if (dir == null) return;
                  if (!dir.exists()) dir.mkdirs();
                  currentDir = dir;
                  txtAddressPath.setText(displayPath + " > ");

                  File[] files = dir.listFiles();
                  int count = (files != null) ? files.length : 0;
                  txtStatusBar.setText(count + " Items");

                  ArrayList<String[]> list = new ArrayList<>();
                  if (files != null) {
                      for (File f : files) {
                          String type = f.isDirectory() ? "File Folder" : "Application";
                          String size = f.isDirectory() ? "" : (f.length() / 1024) + " KB";
                          list.add(new String[]{(f.isDirectory() ? "📁 " : "📄 ") + f.getName(), type, size, "2026"});
                      }
                  }
                  renderList(list, false);
              }

              private void renderList(ArrayList<String[]> data, boolean isRoot) {
                  BaseAdapter adapter = new BaseAdapter() {
                      @Override public int getCount() { return data.size(); }
                      @Override public Object getItem(int p) { return data.get(p); }
                      @Override public long getItemId(int p) { return p; }
                      @Override public View getView(int p, View cv, ViewGroup parent) {
                          LinearLayout row = new LinearLayout(MainActivity.this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setPadding(6, 4, 6, 4);

                          TextView colName = new TextView(MainActivity.this);
                          colName.setLayoutParams(new LinearLayout.LayoutParams(120, ViewGroup.LayoutParams.WRAP_CONTENT));
                          colName.setText(data.get(p)[0]); colName.setTextColor(Color.WHITE); colName.setTextSize(9);

                          TextView colType = new TextView(MainActivity.this);
                          colType.setLayoutParams(new LinearLayout.LayoutParams(70, ViewGroup.LayoutParams.WRAP_CONTENT));
                          colType.setText(data.get(p)[1]); colType.setTextColor(Color.LTGRAY); colType.setTextSize(8);

                          TextView colSize = new TextView(MainActivity.this);
                          colSize.setLayoutParams(new LinearLayout.LayoutParams(50, ViewGroup.LayoutParams.WRAP_CONTENT));
                          colSize.setText(data.get(p)[2]); colSize.setTextColor(Color.GRAY); colSize.setTextSize(8);

                          row.addView(colName); row.addView(colType); row.addView(colSize);
                          return row;
                      }
                  };
                  pcListView.setAdapter(adapter);
                  pcListView.setOnItemClickListener((p, v, pos, id) -> {
                      if (isRoot) {
                          if (pos == 0) loadDir(new File(getExternalFilesDir(null), "drive_c"), "Computer > C:");
                          else if (pos == 1) loadDir(new File(getExternalFilesDir(null), "drive_c/windows"), "Computer > D:");
                          else loadDir(getExternalFilesDir(null), "Computer > Z:");
                      } else {
                          File[] files = currentDir.listFiles();
                          if (files != null && pos < files.length) {
                              File sel = files[pos];
                              if (sel.isDirectory()) loadDir(sel, txtAddressPath.getText().toString() + sel.getName());
                              else Toast.makeText(this, "Loaded: " + sel.getName(), Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
              }

              private void openDesktop() {
                  containersScreen.setVisibility(View.GONE);
                  containerEditScreen.setVisibility(View.GONE);
                  desktopContainer.setVisibility(View.VISIBLE);
                  loadComputerRoot();
              }

              private void setupJoy(int cId, int kId) {
                  RelativeLayout c = findViewById(cId); View k = findViewById(kId);
                  c.setOnTouchListener((v, e) -> {
                      float cx = c.getWidth() / 2f, cy = c.getHeight() / 2f, maxR = cx - k.getWidth() / 2f;
                      if (e.getAction() == MotionEvent.ACTION_DOWN || e.getAction() == MotionEvent.ACTION_MOVE) {
                          float dx = e.getX() - cx, dy = e.getY() - cy, dist = (float) Math.sqrt(dx * dx + dy * dy);
                          if (dist > maxR && dist > 0) { dx = (dx * maxR) / dist; dy = (dy * maxR) / dist; }
                          k.setTranslationX(dx); k.setTranslationY(dy);
                      } else if (e.getAction() == MotionEvent.ACTION_UP || e.getAction() == MotionEvent.ACTION_CANCEL) {
                          k.animate().translationX(0).translationY(0).setDuration(80).start();
                      }
                      return true;
                  });
              }
          }
