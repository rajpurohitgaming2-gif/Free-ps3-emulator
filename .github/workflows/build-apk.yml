              </RelativeLayout>

              <RelativeLayout android:layout_width="116dp" android:layout_height="116dp"
                  android:layout_alignParentEnd="true" android:layout_alignParentBottom="true" android:layout_marginEnd="18dp" android:layout_marginBottom="40dp">
                  <Button android:id="@+id/btnKeyY" android:layout_width="34dp" android:layout_height="34dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_circle_selector" android:text="Y" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
                  <Button android:id="@+id/btnKeyA" android:layout_width="34dp" android:layout_height="34dp" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:background="@drawable/btn_circle_selector" android:text="A" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
                  <Button android:id="@+id/btnKeyX" android:layout_width="34dp" android:layout_height="34dp" android:layout_alignParentStart="true" android:layout_centerVertical="true" android:background="@drawable/btn_circle_selector" android:text="X" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
                  <Button android:id="@+id/btnKeyB" android:layout_width="34dp" android:layout_height="34dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="@drawable/btn_circle_selector" android:text="B" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
              </RelativeLayout>
              <Button android:id="@+id/btnR3" android:layout_width="34dp" android:layout_height="26dp"
