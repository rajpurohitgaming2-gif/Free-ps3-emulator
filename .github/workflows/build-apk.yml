name: Build Fresh VortexPS3 Emu

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Pure VortexPS3 APK (Using AAPT2)
        run: |
          # 1. Build Tools और Platform पाथ सेट करना
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM_DIR=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          export PATH=$BUILD_TOOLS_DIR:$PATH

          echo "Using Build-Tools: $BUILD_TOOLS_DIR"
          echo "Using Platform: $PLATFORM_DIR"

          # 2. प्रोजेक्ट स्ट्रक्चर बनाना
          rm -rf project build unsigned.apk aligned.apk VortexPS3-New-Emulator.apk
          mkdir -p project/res/layout
          mkdir -p project/res/values
          mkdir -p project/src/com/vortexps3/emu
          mkdir -p build/obj
          mkdir -p build/compiled_res

          # AndroidManifest.xml
          cat << 'EOF' > project/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.vortexps3.emu"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="com.vortexps3.emu.MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Strings.xml
          cat << 'EOF' > project/res/values/strings.xml
          <resources>
              <string name="app_name">VortexPS3 Emu</string>
              <string name="welcome_title">WELCOME</string>
              <string name="welcome_sub">VORTEXPS3 EMULATOR</string>
              <string name="author">DEVELOPER: Yash (AI VIDEO HUB)</string>
          </resources>
          EOF

          # Welcome Screen Layout
          cat << 'EOF' > project/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#050505"
              android:gravity="center"
              android:orientation="vertical">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="@string/welcome_title"
                  android:textColor="#FFFFFF"
                  android:textSize="38sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="@string/welcome_sub"
                  android:textColor="#00E5FF"
                  android:textSize="20sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="@string/author"
                  android:textColor="#777777"
                  android:textSize="14sp" />
          </LinearLayout>
          EOF

          # MainActivity.java
          cat << 'EOF' > project/src/com/vortexps3/emu/MainActivity.java
          package com.vortexps3.emu;

          import android.app.Activity;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF

          # 3. रिसोर्सेज को compile करना (aapt2 compile)
          aapt2 compile --dir project/res -o build/compiled_res/

          # 4. रिसोर्सेज को लिंक करना और R.java + base apk बनाना (aapt2 link)
          aapt2 link -I $PLATFORM_DIR/android.jar \
            --manifest project/AndroidManifest.xml \
            --java project/src \
            -o build/base.apk \
            --auto-add-overlay \
            $(find build/compiled_res -name "*.flat")

          # 5. Java कोड को क्लास फाइल्स में कंपाइल करना
          javac -d build/obj \
            -cp $PLATFORM_DIR/android.jar \
            $(find project/src -name "*.java")

          # 6. D8 से classes.dex बनाना
          d8 --output build \
            --lib $PLATFORM_DIR/android.jar \
            $(find build/obj -name "*.class")

          # 7. classes.dex को APK में जोड़ना
          cd build
          zip -u base.apk classes.dex
          cd ..

          # 8. Aligned और Sign करना
          zipalign -p -f 4 build/base.apk aligned.apk

          keytool -genkey -v -keystore test.keystore -storepass android -alias androidkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Yash, OU=AI VIDEO HUB, O=VortexPS3 Studios, L=City, S=State, C=IN"

          apksigner sign --ks test.keystore --ks-pass pass:android --out VortexPS3-New-Emulator.apk aligned.apk

          echo "=== Success: VortexPS3-New-Emulator.apk Created! ==="

      - name: Upload Finished VortexPS3 APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexPS3-New-Emulator
          path: VortexPS3-New-Emulator.apk
          
